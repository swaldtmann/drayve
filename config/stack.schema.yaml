# Drayve stack.yaml Schema
# Defines all configuration options for a Drayve-managed server.
#
# Required fields: drayve_version, stack.name, stack.domain

type: object
required:
  - drayve_version
  - stack

properties:
  drayve_version:
    type: string
    description: Schema version for future upgrade compatibility.
    enum: ["0.1.0"]

  stack:
    type: object
    required:
      - name
      - domain
    properties:
      name:
        type: string
        description: Server name (used for hcloud, DNS, inventory).
        pattern: "^[a-z][a-z0-9-]*$"
      domain:
        type: string
        description: Primary domain for the stack.
      acme_email:
        type: string
        description: Email for Let's Encrypt certificate notifications.
        format: email
      acme_challenge:
        type: string
        description: >
          Which ACME challenge Traefik uses to issue certs. "http" (default)
          needs port 80 reachable from the internet, no DNS-provider secrets.
          "dns" uses acme_dns_provider below — needed for wildcard certs or
          hosts where port 80 can't be exposed.
        enum:
          - http
          - dns
        default: http
      acme_dns_provider:
        type: string
        description: >
          DNS-01 provider (only used when acme_challenge=dns). Any provider
          lego/Traefik supports. See https://doc.traefik.io/traefik/https/acme/#providers.
        default: hetzner
      acme_dns_env_vars:
        type: array
        description: >
          Env vars forwarded to the traefik container for the selected
          acme_dns_provider (values live in env.override on the host).
        items:
          type: string
        default: ["HETZNER_API_TOKEN"]
      acme_dns_propagation_delay:
        type: integer
        description: Seconds Traefik waits before checking DNS propagation (only acme_challenge=dns).
        default: 30

  provider:
    type: object
    properties:
      type:
        type: string
        description: >
          Server provider. "hetzner" uses hcloud API for provisioning + DNS.
          "manual" skips provisioning — expects an existing server with SSH access.
        enum:
          - hetzner
          - manual
        default: hetzner
      server_type:
        type: string
        description: Hetzner server type (only for provider.type=hetzner).
        default: cx23
      location:
        type: string
        description: Hetzner datacenter location.
        default: fsn1

  auth:
    type: object
    properties:
      provider:
        type: string
        description: >
          Authentication provider. Roles query auth_provider, not specific implementations.
        enum:
          - none
          - basic
          - authelia
          - authelia_remote
          - authentik
        default: basic
      cookie_domain:
        type: string
        description: >
          Authelia session cookie domain (only with auth.provider=authelia).
          Set it to a shared parent domain so other hosts below it can use this
          Authelia (see auth.provider=authelia_remote). Defaults to stack.domain.
      portal_url:
        type: string
        description: >
          Public URL of the Authelia portal, rendered as session.cookies[].authelia_url
          (only with auth.provider=authelia). Must be https:// and its host must equal
          or be a subdomain of the cookie domain. Defaults to https://auth.<stack.domain>.
      remote:
        type: object
        description: Authelia of another drayve host (required with auth.provider=authelia_remote).
        additionalProperties: false
        properties:
          forward_auth_url:
            type: string
            description: >
              Full forward-auth endpoint of the other host's Authelia, must start with
              https:// (e.g. https://auth.node01.example.org/api/authz/forward-auth).
              Traefik's auth@file middleware calls it.
          portal_url:
            type: string
            description: >
              Portal URL of the other host's Authelia (e.g. https://auth.node01.example.org).
              Only used for the link on the landing page; the login redirect comes from
              the Authelia host's own session.cookies[].authelia_url.
      lldap:
        type: boolean
        description: Deploy LLDAP as user backend (only with auth.provider=authelia).
        default: false
      lldap_base_dn:
        type: string
        description: LDAP base DN for LLDAP (only with auth.lldap=true).
        default: "DC=drayve,DC=local"
      access_control:
        type: object
        description: >
          Authelia access control (only with auth.provider=authelia). Rules are
          evaluated in order, the first matching rule wins; requests no rule
          matches get default_policy. A rule with groups cannot use "bypass".
        additionalProperties: false
        properties:
          default_policy:
            type: string
            enum: [deny, one_factor, two_factor, bypass]
            default: one_factor
          rules:
            type: array
            items:
              type: object
              required: [domain, policy]
              additionalProperties: false
              properties:
                domain:
                  description: Domain pattern or list of patterns (e.g. "*.example.com").
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                      minItems: 1
                policy:
                  type: string
                  enum: [deny, one_factor, two_factor, bypass]
                groups:
                  type: array
                  description: Rule matches members of any of these groups (Authelia subject "group:<name>").
                  items:
                    type: string
                resources:
                  type: array
                  description: Path regular expressions (Authelia "resources").
                  items:
                    type: string
                networks:
                  type: array
                  description: Source networks in CIDR notation (Authelia "networks").
                  items:
                    type: string
      users:
        type: array
        description: >
          Users for the Authelia file backend (only with auth.provider=authelia
          and auth.lldap=false). Password hashes are NOT set here: put an
          argon2id hash per user under authelia_user_password_hashes.<name> in
          secrets.yml (generate with `authelia crypto hash generate argon2`).
        items:
          type: object
          required: [name, email]
          properties:
            name:
              type: string
              description: Login name (key in Authelia's users file).
            displayname:
              type: string
              description: Display name. Defaults to name.
            email:
              type: string
            groups:
              type: array
              items:
                type: string
              default: []
      ldap:
        type: object
        description: External LDAP source for Authentik (only with auth.provider=authentik).
        properties:
          host:
            type: string
            description: LDAP server hostname or IP.
          port:
            type: integer
            description: LDAP port (636 for LDAPS).
            default: 636
          base_dn:
            type: string
            description: LDAP base DN for user search.
          bind_dn:
            type: string
            description: Bind DN for LDAP connection.
          readonly:
            type: boolean
            description: Read-only sync (no writeback to LDAP server).
            default: true
          sync_interval:
            type: integer
            description: Sync interval in minutes.
            default: 60

  monitoring:
    type: object
    properties:
      profile:
        type: string
        description: >
          Monitoring stack profile.
          "full" (~800MB): Prometheus, Grafana, Loki, Promtail, cAdvisor, node_exporter.
          "light" (~50MB): node_exporter, Promtail (push to remote Grafana).
          "none": No monitoring containers.
        enum:
          - full
          - light
          - none
        default: full
      # A-la-carte overrides (optional, override profile defaults)
      grafana:
        type: boolean
        description: Override Grafana on/off.
      prometheus:
        type: boolean
        description: Override Prometheus on/off.
      loki:
        type: boolean
        description: Override Loki on/off.
      cadvisor:
        type: boolean
        description: Override cAdvisor on/off.
      node_exporter:
        type: boolean
        description: Override node_exporter on/off.

  security:
    type: object
    properties:
      crowdsec:
        type: boolean
        description: Deploy CrowdSec + Traefik bouncer.
        default: true
      trusted_proxies:
        type: array
        description: >
          Extra addresses or networks (IPv4/IPv6, a single address is fine) whose
          X-Forwarded-* headers Traefik keeps, added to the always-trusted Docker
          range 172.16.0.0/12. Needed on the Authelia host of an authelia_remote
          pair: list the public IP of the other host as /32. Prefix length 0
          (0.0.0.0/0, ::/0), IPv4 networks shorter than /8, IPv6 networks shorter
          than /16 and IPv4-mapped IPv6 (::ffff:0:0/96 and anything inside it;
          write the address as IPv4) are rejected.
        items:
          type: string
        default: []
      crowdsec_whitelist_expressions:
        type: array
        description: >
          CrowdSec whitelist expressions (whitelist.expression, evaluated per
          log event in the s02-enrich stage), rendered next to the IP list
          crowdsec_whitelist. Keep them narrow: with Traefik's common log
          format the event carries the router name (evt.Meta.traefik_router_name),
          the method (evt.Meta.http_verb) and the path (evt.Meta.http_path),
          but no host name.
        items:
          type: string
        default: []
      crowdsec_parsers:
        type: array
        description: >
          Extra CrowdSec hub parsers installed at container start (PARSERS
          environment variable), e.g. crowdsecurity/nextcloud-whitelist.
        items:
          type: string
        default: []

  headers:
    type: object
    properties:
      clacks:
        type: boolean
        description: >
          Send "X-Clacks-Overhead: GNU Terry Pratchett" on all responses
          served through Traefik (websecure entrypoint middleware).
        default: false

  secrets:
    type: object
    properties:
      mode:
        type: string
        description: >
          "quickstart": auto-generate random secrets, no setup needed.
          "sops": versioned secrets via AGE + SOPS.
        enum:
          - quickstart
          - sops
        default: quickstart

  backup:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
      schedule:
        type: string
        description: Cron expression for backup schedule.
        default: "0 3 * * *"
      target:
        type: string
        description: Backup destination.
        enum:
          - kedge
          - local
          - sftp
        default: local

  extra_files:
    type: array
    description: >
      Out-of-band static config files (e.g. nginx.conf, a hand-maintained
      .htpasswd, redis.conf) for services declared in compose.override.yml.
      Drayve does NOT template or validate the content — it ships each file
      verbatim from deploy/<host>/<src> on the controller to <deploy_dir>/<dest>
      on the target host BEFORE `docker compose up`, so bind-mounts in the
      override resolve. A declared src that is missing locally fails the deploy
      early (before compose up), not as a downstream container crash.
    items:
      type: object
      required:
        - src
      properties:
        src:
          type: string
          description: >
            Path relative to deploy/<host>/ on the controller
            (e.g. "myapp/nginx.conf"). Must exist locally.
        dest:
          type: string
          description: >
            Path relative to the deploy dir on the target host.
            Defaults to the value of src (same relative layout).
        mode:
          type: string
          description: Octal file mode on the target host.
          default: "0644"
