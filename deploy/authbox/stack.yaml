# Drayve — drayve.authbox.org (cx33, fsn1)

drayve_version: "0.1.0"

stack:
  name: authbox
  domain: drayve.authbox.org
  acme_email: sw@authbox.de

provider:
  type: manual

auth:
  provider: authelia
  lldap: true
  lldap_users:
    - id: drayve-admin
      email: drayve-admin@authbox.org
      displayName: Drayve Admin
      password_var: drayve_admin_password
      groups:
        - lldap_admin

monitoring:
  profile: full

security:
  crowdsec: true
  crowdsec_whitelist:
    - 185.134.6.181

secrets:
  mode: quickstart

backup:
  enabled: false

apps:
  - name: Nextcloud
    url: https://cloud.drayve.authbox.org
    icon: "&#x2601;"
    description: Files, calendar, contacts
