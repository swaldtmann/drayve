# Drayve stack config.
# Copy this to deploy/<name>/stack.yaml and adjust.
#
# Full reference: docs/configuration.md

drayve_version: "0.1.0"

stack:
  name: myserver
  domain: example.com
  acme_email: you@example.com       # Let's Encrypt notifications

provider:
  type: manual                      # manual (existing server) | hetzner (auto-provision)

auth:
  provider: authelia                # none | basic | authelia
  lldap: true                       # user directory (only with authelia)
  # lldap_base_dn: "DC=myorg,DC=local"  # optional, default: DC=drayve,DC=local

  # Declarative OIDC clients (W-144). Omit to keep the legacy Grafana-only
  # default. Each client needs a matching `authelia_oidc_<id>_secret` in
  # deploy/<name>/secrets.yml. See docs/auth-oidc-clients.md for the full
  # schema (authorization_policies / claims_policies / consent_mode etc.).
  # oidc_clients:
  #   - id: grafana
  #     name: Grafana
  #     authorization_policy: one_factor
  #     consent_mode: implicit
  #     redirect_uris:
  #       - "https://grafana.example.com/login/generic_oauth"
  #     scopes: [openid, profile, email, groups]
  #   - id: forgejo
  #     name: Forgejo
  #     authorization_policy: forgejo_access
  #     consent_mode: implicit
  #     redirect_uris:
  #       - "https://git.example.com/user/oauth2/Authelia/callback"
  #     scopes: [openid, profile, email, groups]
  # authorization_policies:
  #   forgejo_access:
  #     default_policy: deny
  #     rules:
  #       - policy: one_factor
  #         subject: ["group:forgejo_users"]

monitoring:
  profile: full                     # full (~800MB) | light (~50MB) | none

security:
  crowdsec: true                    # intrusion detection + Traefik bouncer

secrets:
  mode: quickstart                  # quickstart (auto-generate) | sops (versioned)

backup:
  enabled: true
  schedule: "0 3 * * *"            # daily at 03:00
  target: local                     # local | storagebox | s3 | ssh
