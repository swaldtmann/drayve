---
# Backup test — basic auth + light monitoring + backup enabled.
- name: Test backup role
  hosts: all
  become: true
  vars:
    ops_repo_root: "{{ playbook_dir | regex_replace('/molecule/backup$', '') }}"
  roles:
    - role: common
    - role: docker
    - role: secrets
    - role: traefik
    - role: auth
    - role: monitoring
    - role: deploy
    - role: backup
