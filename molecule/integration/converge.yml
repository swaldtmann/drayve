---
- name: Integration — full Drayve stack
  hosts: all
  become: true
  vars:
    ops_repo_root: "{{ playbook_dir | regex_replace('/molecule/integration$', '') }}"
    ops_secrets_root: "{{ ops_repo_root }}"
  roles:
    - role: common
    - role: docker
    - role: secrets
    - role: traefik
    - role: auth
    - role: monitoring
    - role: deploy
