---
# Testrunde 3 — Authelia + LLDAP on a real Hetzner server.
#
# Tests the full auth stack: LLDAP user directory, Authelia SSO,
# Traefik forwardAuth middleware, OIDC JWKS key generation.
#
# Usage:
#   make test-integration  # or:
#   molecule test -s authelia
#
# Cost: ~0.01 EUR per run (cx23 for a few minutes).
driver:
  name: molecule_hetznercloud
platforms:
  - name: test-authelia
    image: ubuntu-24.04
    server_type: cx23
    location: nbg1
provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
  env:
    ANSIBLE_ROLES_PATH: "../../ansible/roles"
  inventory:
    group_vars:
      all:
        # --- Paths ---
        drayve_root: /opt/drayve
        drayve_deploy_dir: /opt/drayve/deploy/stack
        drayve_config_dir: /opt/drayve/config
        # --- User ---
        drayve_user: drayve
        drayve_uid: 1000
        drayve_group: drayve
        drayve_domain: test.drayve.local
        drayve_hostname: test-authelia
        # --- Common ---
        swap_size_mb: 1024
        swap_file: /swapfile
        common_packages:
          - curl
          - jq
          - rsync
          - git
          - ufw
          - python3-pip
          - acl
        ufw_allowed_ports:
          - { port: "22", proto: "tcp" }
          - { port: "80", proto: "tcp" }
          - { port: "443", proto: "tcp" }
        ssh_password_auth: "no"
        ssh_root_login: "prohibit-password"
        # --- Auth: Authelia + LLDAP ---
        auth_provider: authelia
        auth_lldap: true
        lldap_admin_password: test-lldap-admin-pw
        authelia_jwt_secret: test-jwt-secret-min-32-chars-long
        authelia_session_secret: test-session-secret-min-32-chars
        authelia_storage_encryption_key: test-storage-key-min-32-characters
        authelia_ldap_password: test-authelia-ldap-pw
        authelia_oidc_hmac_secret: test-oidc-hmac-secret-min-32-characters
        authelia_oidc_grafana_secret: test-grafana-oidc-secret-32chars
        # W-144: exercise the multi-client OIDC path. The forgejo client is
        # declarative-only — no real Forgejo container is deployed here.
        # Authelia must accept the config and serve /api/oidc/configuration.
        authelia_oidc_forgejo_secret: test-forgejo-oidc-secret-32chars
        auth:
          provider: authelia
          lldap: true
          oidc_clients:
            - id: grafana
              name: Grafana
              authorization_policy: one_factor
              consent_mode: implicit
              redirect_uris:
                - "https://grafana.test.drayve.local/login/generic_oauth"
              scopes: [openid, profile, email, groups]
            - id: forgejo
              name: Forgejo
              authorization_policy: forgejo_access
              consent_mode: implicit
              redirect_uris:
                - "https://git.test.drayve.local/user/oauth2/Authelia/callback"
              scopes: [openid, profile, email, groups]
          authorization_policies:
            forgejo_access:
              default_policy: deny
              rules:
                - policy: one_factor
                  subject: ["group:forgejo_users"]
        lldap_jwt_secret: test-lldap-jwt-secret-min-32-chars
        # --- Monitoring ---
        monitoring_profile: full
        # --- Security ---
        crowdsec_enabled: true
        # --- ACME ---
        acme_email: test@example.com
        # --- Secrets (test values) ---
        hetzner_api_token: ""
        grafana_admin_password: test-grafana-pw
        crowdsec_bouncer_key: test-bouncer-key
        crowdsec_lapi_key: test-lapi-key
        auth_basic_user: admin
        auth_basic_password: test-basic-pw
        # --- Images (pinned) ---
        node_exporter_image: prom/node-exporter:v1.10.2
        cadvisor_image: ghcr.io/google/cadvisor:0.56.2
        loki_image: grafana/loki:3.3.2
        promtail_image: grafana/promtail:3.3.2
        grafana_image: grafana/grafana:12.3.6
        prometheus_image: prom/prometheus:v3.4.0
        # --- Memory limits ---
        # --- Docker registry mirror (avoid rate limits) ---
        docker_registry_mirrors:
          - "http://192.0.2.10:5000"
        mem_traefik: 256m
        mem_crowdsec: 512m
        mem_lldap: 128m
        mem_authelia: 256m
        mem_prometheus: 512m
        mem_grafana: 256m
        mem_node_exporter: 32m
        mem_cadvisor: 64m
        mem_loki: 512m
        mem_promtail: 64m
verifier:
  name: testinfra
