---
# Authentik + LDAP Source integration test — real Hetzner server.
#
# Uses LLDAP as lightweight LDAP backend to test end-to-end sync.
# Creates a test user in LLDAP, syncs via Authentik LDAP source,
# verifies the user appears in Authentik.
#
# Usage:
#   make test-authentik-ldap  # or:
#   molecule test -s authentik-ldap
#
# Cost: ~0.01 EUR per run (cx23 for a few minutes).
driver:
  name: molecule_hetznercloud
platforms:
  - name: test-authentik-ldap
    image: ubuntu-24.04
    server_type: cx23
    location: nbg1
provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
  env:
    ANSIBLE_ROLES_PATH: "../../ansible/roles"
  inventory:
    group_vars:
      all:
        # --- Paths ---
        drayve_root: /opt/drayve
        drayve_deploy_dir: /opt/drayve/deploy/stack
        drayve_config_dir: /opt/drayve/config
        # --- User ---
        drayve_user: drayve
        drayve_uid: 1000
        drayve_group: drayve
        drayve_domain: test.drayve.local
        drayve_hostname: test-authentik-ldap
        # --- Common ---
        swap_size_mb: 1024
        swap_file: /swapfile
        common_packages:
          - curl
          - jq
          - rsync
          - git
          - ufw
          - python3-pip
          - acl
        ufw_allowed_ports:
          - { port: "22", proto: "tcp" }
          - { port: "80", proto: "tcp" }
          - { port: "443", proto: "tcp" }
        ssh_password_auth: "no"
        ssh_root_login: "prohibit-password"
        # --- Auth: Authentik + LDAP (LLDAP as test backend) ---
        auth_provider: authentik
        auth_lldap: true
        auth:
          provider: authentik
          ldap:
            host: lldap
            port: 3890
            base_dn: "DC=drayve,DC=local"
            bind_dn: "uid=admin,ou=people,DC=drayve,DC=local"
            readonly: true
            sync_interval: 60
        authentik_secret_key: test-authentik-secret-key-min-32-chars
        authentik_pg_pass: test-authentik-pg-password
        authentik_bootstrap_password: test-authentik-admin-pw
        authentik_bootstrap_token: test-authentik-bootstrap-token-32c
        authentik_oidc_grafana_secret: test-grafana-oidc-secret-32chars
        ldap_bind_password: test-lldap-admin-password
        # --- LLDAP (test backend for Authentik LDAP source) ---
        lldap_base_dn: "DC=drayve,DC=local"
        lldap_admin_password: test-lldap-admin-password
        lldap_jwt_secret: test-lldap-jwt-secret-min-32-chars!!
        lldap_image: lldap/lldap:stable
        mem_lldap: 128m
        lldap_users:
          - id: testuser
            email: testuser@test.drayve.local
            displayName: Test User
            password_var: lldap_test_password
            groups:
              - lldap_admin
        host_secrets:
          lldap_test_password: test-user-password-123
        # --- Monitoring ---
        monitoring_profile: full
        # --- Security ---
        crowdsec_enabled: true
        # --- ACME ---
        acme_email: test@example.com
        # --- Secrets (test values) ---
        hetzner_api_token: ""
        grafana_admin_password: test-grafana-pw
        crowdsec_bouncer_key: test-bouncer-key
        crowdsec_lapi_key: test-lapi-key
        auth_basic_user: admin
        auth_basic_password: test-basic-pw
        # --- Images (pinned) ---
        authentik_image: ghcr.io/goauthentik/server:2025.2.4
        authentik_pg_image: postgres:16-alpine
        authentik_redis_image: redis:7-alpine
        node_exporter_image: prom/node-exporter:v1.10.2
        cadvisor_image: ghcr.io/google/cadvisor:0.56.2
        loki_image: grafana/loki:3.3.2
        promtail_image: grafana/promtail:3.3.2
        grafana_image: grafana/grafana:12.3.6
        prometheus_image: prom/prometheus:v3.4.0
        # --- Docker registry mirror (avoid rate limits) ---
        docker_registry_mirrors:
          - "http://192.0.2.10:5000"
        # --- Memory limits ---
        mem_traefik: 256m
        mem_crowdsec: 512m
        mem_authentik_server: 512m
        mem_authentik_worker: 512m
        mem_authentik_pg: 256m
        mem_authentik_redis: 64m
        mem_prometheus: 512m
        mem_grafana: 256m
        mem_node_exporter: 32m
        mem_cadvisor: 64m
        mem_loki: 512m
        mem_promtail: 64m
verifier:
  name: testinfra
