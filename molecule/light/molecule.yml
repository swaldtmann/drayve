---
# Test: no auth + monitoring light (only exporters, no Grafana/Prometheus).
driver:
  name: molecule_hetznercloud
platforms:
  - name: test-light
    image: ubuntu-24.04
    server_type: cx33
    location: nbg1
provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
  env:
    ANSIBLE_ROLES_PATH: "../../ansible/roles"
  inventory:
    group_vars:
      all:
        drayve_root: /opt/drayve
        drayve_deploy_dir: /opt/drayve/deploy/stack
        drayve_config_dir: /opt/drayve/config
        drayve_user: drayve
        drayve_uid: 1000
        drayve_group: drayve
        drayve_domain: test.drayve.local
        drayve_hostname: test-light
        swap_size_mb: 1024
        swap_file: /swapfile
        common_packages:
          - curl
          - jq
          - rsync
          - git
          - ufw
          - python3-pip
          - acl
        ufw_allowed_ports:
          - { port: "22", proto: "tcp" }
          - { port: "80", proto: "tcp" }
          - { port: "443", proto: "tcp" }
        ssh_password_auth: "no"
        ssh_root_login: "prohibit-password"
        # Auth: none
        auth_provider: none
        auth_lldap: false
        # Monitoring: light (only exporters)
        monitoring_profile: light
        # Security
        crowdsec_enabled: true
        # ACME
        acme_email: test@example.com
        # Secrets
        hetzner_api_token: ""
        grafana_admin_password: ""
        crowdsec_bouncer_key: test-bouncer-key
        crowdsec_lapi_key: test-lapi-key
        auth_basic_user: ""
        auth_basic_password: ""
        # Images
        node_exporter_image: prom/node-exporter:v1.10.2
        promtail_image: grafana/promtail:3.3.2
        # Memory limits
        mem_traefik: 256m
        mem_crowdsec: 512m
        mem_node_exporter: 32m
        mem_promtail: 64m
verifier:
  name: testinfra
