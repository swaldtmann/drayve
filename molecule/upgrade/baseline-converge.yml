---
# Upgrade test, step 1: the baseline release. prepare.yml runs this playbook
# through a nested ansible-playbook with ANSIBLE_ROLES_PATH pointing at the roles
# of the baseline tag (git archive), so `include_role` inside the roles resolves
# against the old tree as well. The role list is the one of converge.yml; it was
# the same in every release since v0.8.x.
- name: Converge the baseline release
  hosts: all
  become: true
  vars:
    # Baselines up to v0.9.x run Promtail and need its image and memory limit; later
    # roles ignore them. Set here, not in molecule.yml: tests/python/test_pinned_images.py
    # requires a default and a registry entry for every *_image variable there.
    promtail_image: grafana/promtail:3.6.11
    mem_promtail: 64m
    upgrade_baseline_tag: unknown
    upgrade_baseline_commit: unknown
  pre_tasks:
    # Baselines before v0.11.3 only wait DPkg::Lock::Timeout=60 for the dpkg lock; on
    # a fresh VM unattended-upgrades holds it for minutes (release gate #176). The VM
    # is thrown away afterwards, so stop apt-daily and wait for the lock to be free.
    - name: Stop apt-daily timers and unattended-upgrades
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
        - unattended-upgrades.service
      register: _stop_apt_daily
      failed_when: _stop_apt_daily is failed and 'Could not find' not in (_stop_apt_daily.msg | default(''))

    # apt/dpkg lock with fcntl, flock(1) uses flock(2): the two do not see each other,
    # so flock cannot wait for apt (release gate #176 ran apt-daily-upgrade.service).
    # A transient unit ordered After= the apt-daily services stays queued until a
    # running job has finished. The services are not stopped: killing dpkg mid-run
    # can leave it broken.
    - name: Wait until apt-daily and apt-daily-upgrade jobs have finished
      ansible.builtin.command: >-
        timeout 1200 systemd-run --wait --quiet
        --property="After=apt-daily.service apt-daily-upgrade.service" /bin/true
      changed_when: false

    # Baselines before v0.11.3 do not refresh the apt index in their own apt tasks;
    # a fresh VM then fails with "No package matching 'apache2-utils'" (release gate #175).
    - name: Refresh the apt index for baselines without update_cache
      ansible.builtin.apt:
        update_cache: true
        lock_timeout: "{{ drayve_apt_lock_timeout | default(600) }}"
      register: _apt_update_baseline
      until: _apt_update_baseline is succeeded
      retries: 3
      delay: 10
  roles:
    - role: common
    - role: docker
    - role: secrets
    - role: traefik
    - role: auth
    - role: monitoring
    - role: deploy
  post_tasks:
    - name: Record the baseline release on the host
      ansible.builtin.copy:
        dest: /etc/drayve-upgrade-baseline
        content: "{{ upgrade_baseline_tag }} {{ upgrade_baseline_commit }}\n"
        mode: "0644"
