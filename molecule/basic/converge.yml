---
# Basic auth + full monitoring test.
- name: Test basic auth + full monitoring
  hosts: all
  become: true
  vars:
    ops_repo_root: "{{ playbook_dir | regex_replace('/molecule/basic$', '') }}"
    ops_secrets_root: "{{ ops_repo_root }}"
    ops_deploy_root: "{{ ops_repo_root }}"
  roles:
    - role: common
    - role: docker
    - role: secrets
    - role: traefik
    - role: auth
    - role: monitoring
    - role: deploy
