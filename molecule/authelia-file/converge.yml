---
# Authelia (file user backend) full stack. Also run again by the tests
# (tests/conftest.py, `deploy`) with extra variables and, once, with
# `--tags secrets,deploy`.
- name: Authelia file backend - full stack
  hosts: all
  become: true
  roles:
    - role: common
    - role: docker
    - role: secrets
    - role: traefik
    - role: auth
    - role: monitoring
    - role: deploy
