---
# Authelia configuration — managed by Ansible.
# Template: config/authelia/configuration.yml.j2

theme: dark

server:
  address: tcp://0.0.0.0:9091

log:
  level: info

totp:
  issuer: "example.com"

authentication_backend:
  ldap:
    address: "ldap://lldap:3890"
    base_dn: "DC=drayve,DC=local"
    users_filter: "(&({username_attribute}={input})(objectClass=person))"
    groups_filter: "(member={dn})"
    user: "uid=authelia,ou=people,DC=drayve,DC=local"
    password: "x"

access_control:
  default_policy: one_factor

session:
  secret: "s"
  cookies:
    - domain: "example.com"
      authelia_url: "https://auth.example.com"

storage:
  encryption_key: "k"
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt

identity_validation:
  reset_password:
    jwt_secret: "j"

identity_providers:
  oidc:
    hmac_secret: "h"
    jwks:
      - key_id: main
        algorithm: RS256
        key: |
          -----BEGIN RSA PRIVATE KEY-----
          stub
          -----END RSA PRIVATE KEY-----

    clients:
      - client_id: grafana
        client_name: Grafana
        client_secret: '$pbkdf2-sha512$310000$abc$def'
        authorization_policy: one_factor
        consent_mode: implicit
        redirect_uris:
          - "https://grafana.example.com/login/generic_oauth"
        scopes:
          - openid
          - profile
          - email
          - groups
