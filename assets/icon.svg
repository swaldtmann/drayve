<?xml version="1.0" encoding="UTF-8"?>
<!--
  drayve — Generic Ops framework for Docker stacks.
  Icon: stacked containers on a dray (German "Frachtkutsche") platform.
  The dray is the vehicle drayve owes its name to: a flat low cart
  for hauling heavy loads. Three stacked containers represent the
  multi-service stack drayve provisions and deploys atomically.
  256x256 viewBox renders crisply down to 32x32 (sidebar avatar).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- background -->
  <rect width="256" height="256" rx="36" fill="#0e1d2c"/>

  <!-- three stacked containers -->
  <!-- top container (cyan) -->
  <rect x="44" y="44"  width="168" height="44" rx="3" fill="#22d3ee"/>
  <!-- corrugation lines -->
  <g stroke="#0e1d2c" stroke-width="2" opacity="0.6">
    <line x1="60"  y1="50" x2="60"  y2="82"/>
    <line x1="78"  y1="50" x2="78"  y2="82"/>
    <line x1="96"  y1="50" x2="96"  y2="82"/>
    <line x1="114" y1="50" x2="114" y2="82"/>
    <line x1="132" y1="50" x2="132" y2="82"/>
    <line x1="150" y1="50" x2="150" y2="82"/>
    <line x1="168" y1="50" x2="168" y2="82"/>
    <line x1="186" y1="50" x2="186" y2="82"/>
  </g>

  <!-- middle container (blue) -->
  <rect x="44" y="96" width="168" height="44" rx="3" fill="#3b82f6"/>
  <g stroke="#0e1d2c" stroke-width="2" opacity="0.6">
    <line x1="60"  y1="102" x2="60"  y2="134"/>
    <line x1="78"  y1="102" x2="78"  y2="134"/>
    <line x1="96"  y1="102" x2="96"  y2="134"/>
    <line x1="114" y1="102" x2="114" y2="134"/>
    <line x1="132" y1="102" x2="132" y2="134"/>
    <line x1="150" y1="102" x2="150" y2="134"/>
    <line x1="168" y1="102" x2="168" y2="134"/>
    <line x1="186" y1="102" x2="186" y2="134"/>
  </g>

  <!-- bottom container (deep blue) -->
  <rect x="44" y="148" width="168" height="44" rx="3" fill="#1e40af"/>
  <g stroke="#0b1422" stroke-width="2" opacity="0.7">
    <line x1="60"  y1="154" x2="60"  y2="186"/>
    <line x1="78"  y1="154" x2="78"  y2="186"/>
    <line x1="96"  y1="154" x2="96"  y2="186"/>
    <line x1="114" y1="154" x2="114" y2="186"/>
    <line x1="132" y1="154" x2="132" y2="186"/>
    <line x1="150" y1="154" x2="150" y2="186"/>
    <line x1="168" y1="154" x2="168" y2="186"/>
    <line x1="186" y1="154" x2="186" y2="186"/>
  </g>

  <!-- dray platform under the stack -->
  <rect x="32" y="200" width="192" height="10" rx="2" fill="#94a3b8"/>
  <!-- two wheels -->
  <circle cx="74"  cy="220" r="14" fill="#475569" stroke="#0e1d2c" stroke-width="3"/>
  <circle cx="182" cy="220" r="14" fill="#475569" stroke="#0e1d2c" stroke-width="3"/>
  <!-- wheel hubs -->
  <circle cx="74"  cy="220" r="4" fill="#0e1d2c"/>
  <circle cx="182" cy="220" r="4" fill="#0e1d2c"/>
</svg>
