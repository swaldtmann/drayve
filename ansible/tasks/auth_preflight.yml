---
# Drayve auth preflight — fail early on inconsistent Authelia settings.
# Included from deploy.yml and validate.yml next to preflight_vars.yml.
# Mirrors the checks in scripts/validate-stack.py (that one runs on stack.yaml
# alone, this one inside the playbooks, where consumer repos call deploy/validate).
#
#   auth.provider = authelia_remote
#     - auth.remote.forward_auth_url and auth.remote.portal_url must be set
#     - forward_auth_url must start with https:// (no whitespace, no quotes —
#       it is written into a Traefik file-provider YAML)
#   auth.provider = authelia, with auth.cookie_domain and/or auth.portal_url set
#     - portal host must equal the cookie domain or be a subdomain of it
#       (https://www.authelia.com/configuration/session/introduction/)
#   auth.provider = authelia, Grafana deployed, auth.oidc_clients set
#     - the list replaces the default one, so it must contain id: grafana
#       (Grafana is always rendered with the Authelia OAuth block, login form off).
#       "Grafana deployed" mirrors roles/monitoring: monitoring_grafana, else
#       monitoring.profile / monitoring_profile == full.
#   auth.access_control / auth.users / auth.remote (types, policy enum, default_policy
#   required with rules, group existence in file mode, forward-auth path, ...)
#     - see the last task and ansible/playbooks/filter_plugins/drayve_auth.py
#   security.trusted_proxies (extra Traefik trustedIPs, e.g. the other host of an
#   authelia_remote pair): list of valid addresses/networks, never prefix length 0

- name: Drayve auth preflight — authelia_remote needs auth.remote.forward_auth_url
  ansible.builtin.assert:
    that:
      - (auth.remote.forward_auth_url | default('')) | length > 0
    fail_msg: "auth.provider=authelia_remote requires auth.remote.forward_auth_url (full endpoint, e.g. https://auth.<host>/api/authz/forward-auth)"
  when: (auth.provider | default('basic')) == 'authelia_remote'
  tags: [always]

- name: Drayve auth preflight — authelia_remote needs auth.remote.portal_url
  ansible.builtin.assert:
    that:
      - (auth.remote.portal_url | default('')) | length > 0
    fail_msg: "auth.provider=authelia_remote requires auth.remote.portal_url (e.g. https://auth.<host>)"
  when: (auth.provider | default('basic')) == 'authelia_remote'
  tags: [always]

- name: Drayve auth preflight — auth.remote.forward_auth_url must be a plain https:// URL
  ansible.builtin.assert:
    that:
      - >-
        (auth.remote.forward_auth_url | string).startswith('https://')
        and (auth.remote.forward_auth_url | string) is not search('\s')
        and '"' not in (auth.remote.forward_auth_url | string)
        and "'" not in (auth.remote.forward_auth_url | string)
    fail_msg: "auth.remote.forward_auth_url must start with https:// (no whitespace or quotes): {{ auth.remote.forward_auth_url }}"
  when:
    - (auth.provider | default('basic')) == 'authelia_remote'
    - (auth.remote.forward_auth_url | default('')) | length > 0
  tags: [always]

- name: Drayve auth preflight — portal must sit under the Authelia cookie domain
  ansible.builtin.assert:
    that:
      - (auth.portal_url | default('https://auth.' ~ drayve_domain, true)).startswith('https://')
      - >-
        (auth.portal_url | default('https://auth.' ~ drayve_domain, true) | urlsplit('hostname'))
        == (auth.cookie_domain | default(drayve_domain, true))
        or (auth.portal_url | default('https://auth.' ~ drayve_domain, true) | urlsplit('hostname'))
        .endswith('.' ~ (auth.cookie_domain | default(drayve_domain, true)))
    fail_msg: >-
      auth.portal_url ({{ auth.portal_url | default('https://auth.' ~ drayve_domain, true) }})
      must use https:// and its host must equal or be a subdomain of the cookie domain
      auth.cookie_domain ({{ auth.cookie_domain | default(drayve_domain, true) }}).
  when:
    - (auth.provider | default('basic')) == 'authelia'
    - (auth.cookie_domain | default('')) | length > 0 or (auth.portal_url | default('')) | length > 0
  tags: [always]

- name: Drayve auth preflight — custom auth.oidc_clients must keep the grafana client
  ansible.builtin.assert:
    that:
      - (auth.oidc_clients | selectattr('id', 'defined') | selectattr('id', 'equalto', 'grafana') | list | length) > 0
    fail_msg: >-
      auth.oidc_clients replaces the default client list and has no client with
      id: grafana, but Grafana is deployed with auth.provider=authelia and signs
      in only through that client (login form disabled). Add it to your list,
      e.g.: {id: grafana, name: Grafana, authorization_policy: one_factor,
      consent_mode: implicit, claims_policy: grafana,
      redirect_uris: ["https://grafana.{{ drayve_domain }}/login/generic_oauth"],
      scopes: [openid, profile, email, groups]}.
      See docs/auth-oidc-clients.md
  when:
    - (auth | default({})).provider | default('basic') == 'authelia'
    - (auth | default({})).oidc_clients is defined
    - (auth | default({})).oidc_clients is not none
    - monitoring_grafana | default(((monitoring | default({})).profile | default(monitoring_profile | default('full'))) == 'full') | bool
  tags: [always]

# Warning only (no abort): the client works, but without claims_policy the ID
# token has no groups claim, so Grafana's role mapping makes every admin Viewer.
- name: Drayve auth preflight — own grafana client should set claims_policy
  ansible.builtin.debug:
    msg: >-
      WARNING: auth.oidc_clients defines id: grafana without claims_policy: grafana
      - the ID token then lacks the groups claim and every Grafana admin becomes
      Viewer. Add claims_policy: grafana to the client.
      See docs/auth-oidc-clients.md
  when:
    - (auth | default({})).provider | default('basic') == 'authelia'
    - (auth | default({})).oidc_clients is defined
    - (auth | default({})).oidc_clients is not none
    - (auth.oidc_clients | selectattr('id', 'defined') | selectattr('id', 'equalto', 'grafana')
       | rejectattr('claims_policy', 'defined') | list | length) > 0
    - monitoring_grafana | default(((monitoring | default({})).profile | default(monitoring_profile | default('full'))) == 'full') | bool
  tags: [always]

# Access control, file-backend users and the forward-auth endpoint. The rules
# live in ansible/playbooks/filter_plugins/drayve_auth.py, the same code that
# scripts/validate-stack.py runs, so `make validate` and the playbooks cannot
# drift apart. Findings name the key path, never a value that could be a secret.
- name: Drayve auth preflight — access control, users and remote endpoint
  ansible.builtin.assert:
    that:
      - (auth | default({})) | drayve_auth_errors | length == 0
    fail_msg: |-
      auth settings in stack.yaml are not accepted:
        - {{ (auth | default({})) | drayve_auth_errors | join('\n  - ') }}
  tags: [always]

# security.trusted_proxies ends up in Traefik's forwardedHeaders.trustedIPs; a
# bad entry (0.0.0.0/0, a string instead of a list, ...) must not get that far.
- name: Drayve preflight — security.trusted_proxies
  ansible.builtin.assert:
    that:
      - (security | default({})) | drayve_trusted_proxies_errors | length == 0
    fail_msg: |-
      security.trusted_proxies in stack.yaml is not accepted:
        - {{ (security | default({})) | drayve_trusted_proxies_errors | join('\n  - ') }}
  tags: [always]

# Warnings only (no abort).
- name: Drayve auth preflight — warnings for access control and remote endpoint
  ansible.builtin.debug:
    msg: "WARNING: {{ item }}"
  loop: "{{ (auth | default({})) | drayve_auth_warnings }}"
  tags: [always]
