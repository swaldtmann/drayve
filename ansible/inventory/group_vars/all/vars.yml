---
# === Repo roots (for template/config lookups) ===
# ops_repo_root: legacy single-path (kept for backward compat as default of
# both split variables below — pre-W-109 inventories continue to work).
ops_repo_root: "{{ playbook_dir | regex_replace('/ansible(/playbooks)?$', '') }}"
# ops_secrets_root: SITE-repo root holding per-host state.
#   Expects: deploy/<host>/secrets.yml, deploy/<host>/env.override,
#            deploy/<host>/compose.override.yml, deploy/.age-key.txt
# ops_deploy_root: DRAYVE-OSS root holding shared assets.
#   Expects: ansible/templates/, config/, scripts/, dashboards/
# In vendor-submodule layouts (drayve-OSS under <site>/vendor/drayve/),
# override ops_secrets_root to <site> via -e on the make/ansible command;
# ops_deploy_root keeps its default and resolves to <site>/vendor/drayve.
# Removes the symlink hack (ansible/config/scripts/dashboards → vendor/drayve).
ops_secrets_root: "{{ ops_repo_root }}"
ops_deploy_root: "{{ ops_repo_root }}"

# === Paths ===
drayve_root: /opt/drayve
drayve_deploy_dir: "{{ drayve_root }}/deploy/stack"
drayve_config_dir: "{{ drayve_root }}/config"

# === User ===
drayve_user: drayve
drayve_uid: 1000
drayve_group: drayve

# === Swap ===
swap_size_mb: 2048

# === UFW ===
ufw_allowed_ports:
  - { port: "22", proto: "tcp" }
  - { port: "80", proto: "tcp" }
  - { port: "443", proto: "tcp" }

# === SSH ===
ssh_password_auth: "no"
ssh_root_login: "prohibit-password"

# === Domain (must be set per host or via -e domain=) ===
drayve_domain: ""

# === ACME / Let's Encrypt ===
# Set in stack.yaml: stack.acme_email
acme_email: ""

# === Auth ===
auth_provider: basic

# === Monitoring ===
monitoring_profile: full

# === Security ===
crowdsec_enabled: true

# === Monitoring images (pinned) ===
node_exporter_image: prom/node-exporter:v1.10.2
cadvisor_image: ghcr.io/google/cadvisor:0.56.2
# Keep Loki + Promtail on the same minor version to avoid feature mismatch
loki_image: grafana/loki:3.3.2
promtail_image: grafana/promtail:3.3.2
# GUARD: Grafana 12.4.x breaks Authelia OIDC integration (blank login page).
# Do NOT upgrade past 12.3.6 until https://github.com/grafana/grafana/issues/XXXXX is resolved.
# See: drayve#7
grafana_image: grafana/grafana:12.3.6
prometheus_image: prom/prometheus:v3.4.0

# === Authentik (pinned) ===
authentik_image: ghcr.io/goauthentik/server:2025.2.4
authentik_pg_image: postgres:16-alpine
authentik_redis_image: redis:7-alpine

# === Memory limits ===
mem_traefik: 256m
mem_crowdsec: 512m
mem_lldap: 128m
mem_authelia: 256m
mem_prometheus: 512m
mem_grafana: 256m
mem_node_exporter: 32m
mem_cadvisor: 64m
mem_loki: 512m
mem_promtail: 64m
mem_authentik_server: 512m
mem_authentik_worker: 512m
mem_authentik_pg: 256m
mem_authentik_redis: 64m
