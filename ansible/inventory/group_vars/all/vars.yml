---
# === Repo roots (for template/config lookups) ===
# ops_repo_root: legacy single-path (kept for backward compat as default of
# both split variables below — older inventories continue to work).
ops_repo_root: "{{ playbook_dir | regex_replace('/ansible(/playbooks)?$', '') }}"
# ops_secrets_root: SITE-repo root holding per-host state.
#   Expects: deploy/<host>/secrets.yml, deploy/<host>/env.override,
#            deploy/<host>/compose.override.yml, deploy/.age-key.txt
# ops_deploy_root: DRAYVE-OSS root holding shared assets.
#   Expects: ansible/templates/, config/, scripts/, dashboards/
# In vendor-submodule layouts (drayve-OSS under <site>/vendor/drayve/),
# override ops_secrets_root to <site> via -e on the make/ansible command;
# ops_deploy_root keeps its default and resolves to <site>/vendor/drayve.
# Removes the symlink hack (ansible/config/scripts/dashboards → vendor/drayve).
ops_secrets_root: "{{ ops_repo_root }}"
ops_deploy_root: "{{ ops_repo_root }}"

# === Paths ===
drayve_root: /opt/drayve
drayve_deploy_dir: "{{ drayve_root }}/deploy/stack"
drayve_config_dir: "{{ drayve_root }}/config"

# === User ===
drayve_user: drayve
drayve_uid: 1000
drayve_group: drayve

# === Swap ===
swap_size_mb: 2048

# === UFW ===
ufw_allowed_ports:
  - { port: "22", proto: "tcp" }
  - { port: "80", proto: "tcp" }
  - { port: "443", proto: "tcp" }

# === SSH ===
ssh_password_auth: "no"
ssh_root_login: "prohibit-password"

# === Domain (must be set per host or via -e domain=) ===
drayve_domain: ""

# === ACME / Let's Encrypt ===
# Set in stack.yaml: stack.acme_email
acme_email: ""

# === Landing ===
# When true (default), drayve runs a landing-page nginx on the apex domain
# that lists all configured apps grouped by category. Set to false in
# stack.yaml (services.landing.enabled: false) for single-app hosts where
# the app itself owns the apex route.
landing_enabled: true

# Domain the landing router claims (Host() rule). Empty = falls back to the
# apex (drayve_domain), the historical default. Override via stack.yaml
# (services.landing.domain: dash.example.com) when the apex itself is owned
# by something outside this stack (e.g. an unrelated site already living
# there) and the landing page needs its own subdomain instead.
landing_domain: ""

# === Auth ===
auth_provider: basic

# === Monitoring ===
monitoring_profile: full

# === Security ===
crowdsec_enabled: true

# === Monitoring images (pinned) ===
node_exporter_image: prom/node-exporter:v1.10.2
cadvisor_image: ghcr.io/google/cadvisor:0.56.2
# Keep Loki + Promtail on the same minor version to avoid feature mismatch
loki_image: grafana/loki:3.3.2
promtail_image: grafana/promtail:3.3.2
# Grafana was held at 12.3.6 after a never-diagnosed login incident with Authelia
# OIDC (2026-03). On 2026-10-12, 12.4.12 and 13.2.3 were tested against Authelia
# v4.39.28 and the login worked (no blank page); the incident did not reproduce.
# Only the login was measured. Major 13 was deliberately not adopted.
# How to bump: docs/configuration.md "Pinned images and how to bump them".
grafana_image: grafana/grafana:12.4.12
prometheus_image: prom/prometheus:v3.4.0

# === Auth images (pinned) ===
# lldap v0.6.3 = what `lldap/lldap:stable` pointed to on 2026-10-12 (same digest
# sha256:2a8454b668c1..., Docker Hub API
# https://hub.docker.com/v2/repositories/lldap/lldap/tags/v0.6.3). Keep the
# compose fallback in ansible/templates/docker-compose.yml.j2 in sync.
lldap_image: lldap/lldap:v0.6.3

# === Authentik (pinned) ===
authentik_image: ghcr.io/goauthentik/server:2025.10.4
# Postgres and Redis belong to Authentik: stay inside the major line (16.x, 7.x).
# A Postgres major change needs a data migration, it is not a plain bump.
# Both = what `postgres:16-alpine` / `redis:7-alpine` pointed to on 2026-10-12
# (same digests, Docker Hub API https://hub.docker.com/v2/repositories/library/<name>/tags/<tag>).
authentik_pg_image: postgres:16.15-alpine
authentik_redis_image: redis:7.4.11-alpine

# === Other framework images (pinned) ===
# Each = what the former floating tag pointed to on 2026-10-12 (same digest,
# Docker Hub API https://hub.docker.com/v2/repositories/<repo>/tags/<tag>;
# linux/amd64 + linux/arm64 present). Keep the compose fallback in
# ansible/templates/docker-compose.yml.j2 in sync (traefik_image lives in
# ansible/roles/traefik/defaults/main.yml).
# crowdsecurity/crowdsec:latest -> v1.8.1
crowdsec_image: crowdsecurity/crowdsec:v1.8.1
# nginx:alpine -> 1.31.6-alpine
landing_image: nginx:1.31.6-alpine

# === Memory limits ===
mem_traefik: 256m
mem_crowdsec: 512m
mem_lldap: 128m
mem_authelia: 256m
mem_prometheus: 512m
mem_grafana: 256m
mem_node_exporter: 32m
mem_cadvisor: 64m
mem_loki: 1g
mem_promtail: 64m
mem_authentik_server: 512m
mem_authentik_worker: 512m
mem_authentik_pg: 256m
mem_authentik_redis: 64m
