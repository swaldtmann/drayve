---
# host-update — Rolling Full-Upgrade + Reboot fuer Ubuntu-Hosts.
#
# AFKI-W-122 Phase 3. Pendant zu Phase 2 (host-base-update.yml): apt-Pakete
# einmalig ausrollen, optional Reboot, Services vorher/nachher abgleichen.
#
# Nutzt das zentrale Inventory tools/inventory-from-servers.sh (Filter wie
# Phase 2: ssh_alias + ki_freigabe + status != retiring/decommissioned/deleted/
# destroyed + patch.auto_update != false).
#
# Aufruf (Pilot gegen einen Host):
#   cd /Users/sw/claudes-welt/repos/drayve/ansible
#   ansible-playbook -i /Users/sw/claudes-welt/tools/inventory-from-servers.sh \
#     playbooks/host-update.yml --limit kigulls-dev
#
# Rolling gegen viele Hosts (serial=1 ist im Play schon gesetzt):
#   ansible-playbook -i .../inventory-from-servers.sh playbooks/host-update.yml \
#     --limit "prod-rezepte,forge-runner-drayve"
#
# Override Reboot-Verhalten:
#   -e hu_reboot_if_required=false   # nur upgrade, kein Reboot
#   -e hu_reboot_timeout=600         # SSH-Wait nach Reboot (Default 300s)
#   -e hu_apt_full_upgrade=false     # nur apt upgrade, kein full-upgrade
#
# AFKI-W-158 Teil A/B (2026-07-26):
# - Docker-Pakete (docker-ce, docker-ce-cli, containerd.io,
#   docker-compose-plugin) werden vor dem apt-Lauf gehalten (apt-mark hold)
#   und nach Reboot+Recovery wieder freigegeben. Verhindert das Race, das
#   den Traefik-Ausfall auf prod-hub ausgeloest hat (RCA S328-Folge44):
#   docker-ce-Postinstall restartet docker.service MITTEN im apt-Upgrade.
# - Externe Domain-Smokes (von der Control-Maschine, nicht vom Host) gegen
#   die `domains:`-Liste aus servers.yaml (durchgereicht via
#   tools/inventory-from-servers.sh). Default: nur WARN-Report. Hard-Fail
#   nur wenn `domains_required_up: true` fuer den Host gesetzt ist.

- name: Rolling host update
  hosts: all
  gather_facts: true
  serial: 1   # nie batch — bewusst sequentiell

  vars:
    hu_reboot_if_required: true
    hu_reboot_timeout: 300
    hu_apt_full_upgrade: true
    # Beide Docker-Paketierungs-Schemata: Docker's offizielles apt-Repo
    # (docker-ce*, containerd.io, docker-compose-plugin) UND Ubuntus eigene
    # Repos (docker.io, containerd, docker-compose-v2) -- welches ein Host
    # nutzt haengt davon ab, wie Docker installiert wurde (get-docker.sh vs.
    # `apt install docker.io`). Live-Fund horst (2026-07-26): hu_docker_packages
    # hardcodete nur das erste Schema, dpkg_selections("hold") schlug fehl mit
    # "Failed to find package" und brach den kompletten Lauf VOR dem Upgrade ab
    # (kein Schaden, aber kein Patch). Gefiltert auf tatsaechlich installierte
    # Pakete via hu_docker_packages_present (s. pre_tasks), keine Hardcode-Liste
    # mehr direkt in hold/unhold.
    hu_docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
      - docker.io
      - containerd
      - docker-compose-v2
    # domains/domains_required_up bewusst NICHT hier mit Default vorbelegt:
    # "play vars" haben HOEHERE Prioritaet als "inventory host vars" (Ansible-
    # Variablen-Praezedenz) -- ein Default hier wuerde die echten, per
    # tools/inventory-from-servers.sh durchgereichten Inventory-Werte fuer
    # JEDEN Host ueberschreiben statt nur als Fallback zu wirken (live gegen
    # kigulls-dev verifiziert: domains_checked kam als [] obwohl das Inventory
    # 2 Domains lieferte). Default steht stattdessen an jeder Nutzungsstelle
    # per Jinja `| default(...)`.

  pre_tasks:
    - name: Skip non-Ubuntu hosts cleanly (HAOS, FreeBSD, etc.)
      ansible.builtin.meta: end_host
      when: ansible_distribution != "Ubuntu"

    # AFKI-W-158 Teil A: docker-Pakete VOR dem apt full-upgrade festhalten.
    # RCA prod-hub traefik (2026-05-16, S328-Folge44): docker-ce-Postinstall
    # ruft mitten im apt-Lauf "systemctl restart docker" auf -- Container die
    # in diesem Race-Window stoppen, kommen ohne den Recovery-Step (post_tasks
    # unten) nicht zurueck. Hold verhindert das Docker-Update in DIESEM Lauf
    # komplett; Freigabe passiert erst nach Reboot+Recovery (post_tasks).
    - name: Detect docker presence (pre-upgrade)
      ansible.builtin.command: which docker
      register: hu_docker_present_pre
      changed_when: false
      failed_when: false

    # Nur tatsaechlich installierte Pakete filtern (s. hu_docker_packages
    # Kommentar oben) -- dpkg_selections("hold") auf ein unbekanntes Paket
    # ist ein harter Fehler ("Failed to find package"), kein no-op.
    - name: Gather installed package facts
      ansible.builtin.package_facts:
      when: hu_docker_present_pre.rc == 0

    - name: Determine which docker package names are actually installed
      ansible.builtin.set_fact:
        hu_docker_packages_present: "{{ hu_docker_packages | select('in', ansible_facts.packages | default({})) | list }}"
      when: hu_docker_present_pre.rc == 0

    - name: Hold docker packages before apt-upgrade
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ hu_docker_packages_present | default([]) }}"
      when: hu_docker_present_pre.rc == 0

    - name: Capture running systemd services (pre)
      ansible.builtin.shell: |
        set -o pipefail
        systemctl list-units --type=service --state=running --no-legend --no-pager \
          | awk '{print $1}' | sort
      args:
        executable: /bin/bash
      register: hu_services_pre
      changed_when: false

    - name: Capture failed systemd units (pre)
      ansible.builtin.shell: |
        set -o pipefail
        systemctl list-units --state=failed --no-legend --no-pager \
          | awk '{print $2}' | sort
      args:
        executable: /bin/bash
      register: hu_failed_pre
      changed_when: false

    - name: Show pre-state summary
      ansible.builtin.debug:
        msg:
          - "host={{ inventory_hostname }} kernel={{ ansible_kernel }} uptime_s={{ ansible_uptime_seconds }}"
          - "running_services={{ hu_services_pre.stdout_lines | length }}"
          - "failed_units_pre={{ hu_failed_pre.stdout_lines | length }}"

  tasks:
    - name: APT update (refresh package lists)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    - name: APT full-upgrade
      ansible.builtin.apt:
        upgrade: full
        autoremove: true
        autoclean: true
      when: hu_apt_full_upgrade | bool
      register: hu_apt_upgrade

    - name: APT upgrade (no full-upgrade)
      ansible.builtin.apt:
        upgrade: 'yes'
        autoremove: true
        autoclean: true
      when: not (hu_apt_full_upgrade | bool)
      register: hu_apt_upgrade_alt

    - name: Detect reboot-required after upgrade
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: hu_reboot_required

    - name: Read reboot-required.pkgs (if present)
      ansible.builtin.slurp:
        path: /var/run/reboot-required.pkgs
      register: hu_reboot_pkgs_raw
      when: hu_reboot_required.stat.exists
      failed_when: false

    - name: Show reboot-required decision
      ansible.builtin.debug:
        msg:
          - "reboot_required={{ hu_reboot_required.stat.exists }}"
          - "reboot_will_run={{ hu_reboot_if_required | bool and hu_reboot_required.stat.exists }}"
          - "reboot_pkgs={{ (hu_reboot_pkgs_raw.content | default('') | b64decode | trim).split('\n') if hu_reboot_required.stat.exists else [] }}"

    - name: Reboot host
      ansible.builtin.reboot:
        msg: "AFKI-W-122 Phase 3 rolling update — reboot triggered by host-update.yml"
        connect_timeout: 30
        reboot_timeout: "{{ hu_reboot_timeout | int }}"
        pre_reboot_delay: 5
        post_reboot_delay: 15
        test_command: uptime
      when:
        - hu_reboot_if_required | bool
        - hu_reboot_required.stat.exists
      register: hu_reboot_result

  post_tasks:
    - name: Re-gather facts after potential reboot
      ansible.builtin.setup:
        gather_subset:
          - "kernel"
          - "distribution"
          - "default_ipv4"
          - "virtual"

    # AFKI-W-158 Teil A: Docker-Pakete nach Reboot+Recovery wieder freigeben,
    # damit Phase 2 (unattended-upgrades, security-only) sie wieder normal
    # patchen kann. Nutzt dieselbe Pre-Upgrade-Erkennung (hu_docker_present_pre)
    # statt neu zu detektieren -- ein apt full-upgrade entfernt docker-ce nicht.
    - name: Unhold docker packages after upgrade+reboot
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: install
      loop: "{{ hu_docker_packages_present | default([]) }}"
      when: hu_docker_present_pre.rc == 0

    # Container-Recovery: AFKI-W-122 / RCA prod-hub 2026-05-16
    # docker-ce/containerd via apt-upgrade triggert ein docker.service-Restart
    # mid-dist-upgrade. Container die in dem schmalen Race-Window (zwischen
    # docker-Daemon-Restart und Ansible-Reboot) im "stopped"-Zwischenzustand
    # waren, kommen beim Boot nicht mehr hoch — Docker startet beim Boot nur
    # Container deren persistierter State "running" war. Hier abgefangen:
    # alle exited/created Container mit RestartPolicy != "no" werden gestartet.
    - name: Detect docker presence
      ansible.builtin.command: which docker
      register: hu_docker_present
      changed_when: false
      failed_when: false

    - name: Find stopped containers with auto-restart policy (recovery candidates)
      ansible.builtin.shell: |
        set -o pipefail
        docker ps -a --filter status=exited --filter status=created \
          --format '{{ "{{" }}.Names{{ "}}" }}' | while read -r name; do
          [ -z "$name" ] && continue
          policy=$(docker inspect "$name" --format '{{ "{{" }}.HostConfig.RestartPolicy.Name{{ "}}" }}' 2>/dev/null)
          case "$policy" in
            always|unless-stopped|on-failure) echo "$name $policy" ;;
          esac
        done
      args:
        executable: /bin/bash
      register: hu_recovery_candidates
      changed_when: false
      when: hu_docker_present.rc == 0

    - name: Recover stopped containers (docker start)
      ansible.builtin.command: "docker start {{ item.split(' ')[0] }}"
      loop: "{{ hu_recovery_candidates.stdout_lines | default([]) }}"
      register: hu_recovery_result
      when:
        - hu_docker_present.rc == 0
        - hu_recovery_candidates.stdout_lines | default([]) | length > 0
      changed_when: hu_recovery_result.rc == 0

    - name: Capture running systemd services (post)
      ansible.builtin.shell: |
        set -o pipefail
        systemctl list-units --type=service --state=running --no-legend --no-pager \
          | awk '{print $1}' | sort
      args:
        executable: /bin/bash
      register: hu_services_post
      changed_when: false

    - name: Capture failed systemd units (post)
      ansible.builtin.shell: |
        set -o pipefail
        systemctl list-units --state=failed --no-legend --no-pager \
          | awk '{print $2}' | sort
      args:
        executable: /bin/bash
      register: hu_failed_post
      changed_when: false

    - name: Diff pre/post services
      ansible.builtin.set_fact:
        hu_services_lost: "{{ hu_services_pre.stdout_lines | difference(hu_services_post.stdout_lines) }}"
        hu_services_new: "{{ hu_services_post.stdout_lines | difference(hu_services_pre.stdout_lines) }}"
        hu_failed_new: "{{ hu_failed_post.stdout_lines | difference(hu_failed_pre.stdout_lines) }}"

    - name: Smoke — uname + uptime
      ansible.builtin.command: "{{ item }}"
      register: hu_smoke
      changed_when: false
      loop:
        - uname -r
        - uptime

    # AFKI-W-158 Teil B: externe Domain-Smokes von der Control-Maschine aus
    # (nicht vom Host selbst -- ein Check von innen wuerde einen kaputten
    # externen Pfad wie Traefik/DNS/Cloud-Firewall nicht sehen). Quelle:
    # `domains:`-Liste des Hosts aus servers.yaml, durchgereicht via
    # tools/inventory-from-servers.sh. Leere Liste -> Task hat 0 Iterationen,
    # laeuft sauber durch (kein when noetig, Ansible skippt leere loops).
    #
    # Live-Fund (prod-genua, 2026-07-26): direkt nach "SSH wieder da" waren
    # alle 6 Domains 403/404 -- Traefik/Authelia waren nach dem Reboot noch
    # nicht vollstaendig warm. ~90s spaeter (manueller curl) waren alle 6
    # sauber (302 Authelia-Redirect bzw. 200). Kein echter Ausfall, sondern
    # ein Timing-Race zwischen "SSH erreichbar" und "Reverse-Proxy/Auth-
    # Backend fertig hochgefahren". Retry statt Blind-Sleep: wartet nur so
    # lange wie noetig, pro Domain unabhaengig (verschiedene Backends werden
    # unterschiedlich schnell warm).
    - name: External domain smokes (from control host)
      ansible.builtin.uri:
        url: "https://{{ item }}"
        method: GET
        status_code: [200, 301, 302, 401]
        timeout: 15
        validate_certs: true
      delegate_to: localhost
      loop: "{{ domains | default([]) }}"
      loop_control:
        label: "{{ item }}"
      register: hu_domain_smokes
      until: hu_domain_smokes.status is defined and hu_domain_smokes.status in [200, 301, 302, 401]
      retries: 6
      delay: 5
      ignore_errors: true
      changed_when: false

    - name: Collect failing domains
      ansible.builtin.set_fact:
        hu_domains_down: "{{ hu_domain_smokes.results | default([]) | selectattr('failed', 'equalto', true) | map(attribute='item') | list }}"

    - name: Final report
      ansible.builtin.debug:
        msg:
          - "host={{ inventory_hostname }}"
          - "kernel_after={{ ansible_kernel }}"
          - "rebooted={{ hu_reboot_result.rebooted | default(false) }}"
          - "services_running_pre={{ hu_services_pre.stdout_lines | length }} post={{ hu_services_post.stdout_lines | length }}"
          - "services_lost={{ hu_services_lost }}"
          - "services_new={{ hu_services_new }}"
          - "failed_units_pre={{ hu_failed_pre.stdout_lines | length }} post={{ hu_failed_post.stdout_lines | length }}"
          - "failed_units_new={{ hu_failed_new }}"
          - "docker_recovered={{ hu_recovery_candidates.stdout_lines | default([]) }}"
          - "domains_checked={{ domains | default([]) }}"
          - "domains_down={{ hu_domains_down }}"

    # Hinweis: hu_services_lost wird nur als WARN gemeldet (im Final report
    # oben sichtbar). Grund: `systemctl --state=running` ist ein Snapshot —
    # on-demand-Services (polkit, fsckd, timedated, snapd) sind nach Reboot
    # haeufig nicht "running" obwohl sie funktional aktiv sind. Echter
    # Service-Gesundheits-Check passiert ueber failed-units + ggf. Stack-
    # spezifische Smokes (Phase 3 Folge-Auftrag pro prod-Host).

    - name: Hard fail when new failed units appeared
      ansible.builtin.fail:
        msg: "New failed units after update/reboot on {{ inventory_hostname }}: {{ hu_failed_new }}"
      when: hu_failed_new | length > 0

    - name: Hard fail when required domains are down
      ansible.builtin.fail:
        msg: "domains_required_up=true fuer {{ inventory_hostname }}, aber nicht erreichbar: {{ hu_domains_down }}"
      when:
        - domains_required_up | default(false) | bool
        - hu_domains_down | length > 0
