---
# host-update — rolling full upgrade + reboot for Ubuntu hosts.
#
# Counterpart to host-base-update.yml: rolls out apt packages once,
# optionally reboots, and compares services before/after.
#
# Uses a central inventory script (filters as in host-base-update.yml:
# ssh_alias + ki_freigabe + status != retiring/decommissioned/deleted/
# destroyed + patch.auto_update != false).
#
# Usage (pilot against one host):
#   cd <drayve checkout>/ansible
#   ansible-playbook -i <your inventory script or file> \
#     playbooks/host-update.yml --limit myhost
#
# Rolling against many hosts (serial=1 is already set in the play):
#   ansible-playbook -i .../inventory-from-servers.sh playbooks/host-update.yml \
#     --limit "web-1,web-2"
#
# Override reboot behaviour:
#   -e hu_reboot_if_required=false   # upgrade only, no reboot
#   -e hu_reboot_timeout=600         # SSH wait after reboot (default 300s)
#   -e hu_apt_full_upgrade=false     # plain apt upgrade, no full-upgrade
#
# Docker hold and external domain smokes:
# - Docker packages (docker-ce, docker-ce-cli, containerd.io,
#   docker-compose-plugin) are held (apt-mark hold) before the apt run
#   and released again after reboot + recovery. Prevents the race that
#   caused a Traefik outage:
#   the docker-ce postinstall restarts docker.service IN THE MIDDLE of the apt upgrade.
# - External domain smokes (from the control machine, not from the host) against
#   the host's `domains:` list (passed through via inventory). Default: WARN report only. Hard fail
#   only if `domains_required_up: true` is set for the host.

- name: Rolling host update
  hosts: all
  gather_facts: true
  serial: 1   # never batch — deliberately sequential

  vars:
    hu_reboot_if_required: true
    hu_reboot_timeout: 300
    hu_apt_full_upgrade: true
    # Both Docker packaging schemes: Docker's official apt repo
    # (docker-ce*, containerd.io, docker-compose-plugin) AND Ubuntu's own
    # repos (docker.io, containerd, docker-compose-v2) -- which one a host
    # uses depends on how Docker was installed (get-docker.sh vs.
    # `apt install docker.io`). Live finding: hu_docker_packages
    # hardcoded only the first scheme, dpkg_selections("hold") failed with
    # "Failed to find package" and aborted the whole run BEFORE the upgrade
    # (no damage, but no patch). Filtered to actually installed
    # packages via hu_docker_packages_present (see pre_tasks), no hardcoded list
    # any more directly in hold/unhold.
    hu_docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
      - docker.io
      - containerd
      - docker-compose-v2
    # domains/domains_required_up deliberately NOT given a default here:
    # "play vars" have HIGHER precedence than "inventory host vars" (Ansible
    # variable precedence) -- a default here would override the real values
    # passed through via inventory for
    # EVERY host instead of acting only as a fallback (verified live:
    # domains_checked came out as [] although the inventory supplied 2 domains). The default lives at each point of use
    # via Jinja `| default(...)`.

  pre_tasks:
    - name: Skip non-Ubuntu hosts cleanly (HAOS, FreeBSD, etc.)
      ansible.builtin.meta: end_host
      when: ansible_distribution != "Ubuntu"

    # Hold docker packages BEFORE the apt full-upgrade.
    # RCA Traefik outage: the docker-ce postinstall
    # calls "systemctl restart docker" in the middle of the apt run -- containers that
    # stop in this race window do not come back without the recovery step (post_tasks
    # below). Hold prevents the Docker update entirely in THIS run;
    # release only happens after reboot + recovery (post_tasks).
    - name: Detect docker presence (pre-upgrade)
      ansible.builtin.command: which docker
      register: hu_docker_present_pre
      changed_when: false
      failed_when: false

    # Filter to actually installed packages only (see hu_docker_packages
    # comment above) -- dpkg_selections("hold") on an unknown package
    # is a hard error ("Failed to find package"), not a no-op.
    - name: Gather installed package facts
      ansible.builtin.package_facts:
      when: hu_docker_present_pre.rc == 0

    - name: Determine which docker package names are actually installed
      ansible.builtin.set_fact:
        hu_docker_packages_present: "{{ hu_docker_packages | select('in', ansible_facts.packages | default({})) | list }}"
      when: hu_docker_present_pre.rc == 0

    - name: Hold docker packages before apt-upgrade
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ hu_docker_packages_present | default([]) }}"
      when: hu_docker_present_pre.rc == 0

    - name: Capture running systemd services (pre)
      ansible.builtin.shell: |
        set -o pipefail
        systemctl list-units --type=service --state=running --no-legend --no-pager \
          | awk '{print $1}' | sort
      args:
        executable: /bin/bash
      register: hu_services_pre
      changed_when: false

    - name: Capture failed systemd units (pre)
      ansible.builtin.shell: |
        set -o pipefail
        systemctl list-units --state=failed --no-legend --no-pager \
          | awk '{print $2}' | sort
      args:
        executable: /bin/bash
      register: hu_failed_pre
      changed_when: false

    - name: Show pre-state summary
      ansible.builtin.debug:
        msg:
          - "host={{ inventory_hostname }} kernel={{ ansible_kernel }} uptime_s={{ ansible_uptime_seconds }}"
          - "running_services={{ hu_services_pre.stdout_lines | length }}"
          - "failed_units_pre={{ hu_failed_pre.stdout_lines | length }}"

  tasks:
    - name: APT update (refresh package lists)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    - name: APT full-upgrade
      ansible.builtin.apt:
        upgrade: full
        autoremove: true
        autoclean: true
      when: hu_apt_full_upgrade | bool
      register: hu_apt_upgrade

    - name: APT upgrade (no full-upgrade)
      ansible.builtin.apt:
        upgrade: 'yes'
        autoremove: true
        autoclean: true
      when: not (hu_apt_full_upgrade | bool)
      register: hu_apt_upgrade_alt

    - name: Detect reboot-required after upgrade
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: hu_reboot_required

    - name: Read reboot-required.pkgs (if present)
      ansible.builtin.slurp:
        path: /var/run/reboot-required.pkgs
      register: hu_reboot_pkgs_raw
      when: hu_reboot_required.stat.exists
      failed_when: false

    - name: Show reboot-required decision
      ansible.builtin.debug:
        msg:
          - "reboot_required={{ hu_reboot_required.stat.exists }}"
          - "reboot_will_run={{ hu_reboot_if_required | bool and hu_reboot_required.stat.exists }}"
          - "reboot_pkgs={{ (hu_reboot_pkgs_raw.content | default('') | b64decode | trim).split('\n') if hu_reboot_required.stat.exists else [] }}"

    - name: Reboot host
      ansible.builtin.reboot:
        msg: "Rolling update — reboot triggered by host-update.yml"
        connect_timeout: 30
        reboot_timeout: "{{ hu_reboot_timeout | int }}"
        pre_reboot_delay: 5
        post_reboot_delay: 15
        test_command: uptime
      when:
        - hu_reboot_if_required | bool
        - hu_reboot_required.stat.exists
      register: hu_reboot_result

  post_tasks:
    - name: Re-gather facts after potential reboot
      ansible.builtin.setup:
        gather_subset:
          - "kernel"
          - "distribution"
          - "default_ipv4"
          - "virtual"

    # Release docker packages again after reboot + recovery,
    # so that host-base-update (unattended-upgrades, security-only) can patch them normally
    # again. Uses the same pre-upgrade detection (hu_docker_present_pre)
    # instead of detecting anew -- an apt full-upgrade does not remove docker-ce.
    - name: Unhold docker packages after upgrade+reboot
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: install
      loop: "{{ hu_docker_packages_present | default([]) }}"
      when: hu_docker_present_pre.rc == 0

    # Container recovery (RCA Traefik outage)
    # docker-ce/containerd via apt-upgrade triggers a docker.service restart
    # mid-dist-upgrade. Containers that were in the "stopped" intermediate state in the narrow race window (between
    # docker daemon restart and Ansible reboot)
    # do not come back up at boot -- at boot Docker only starts
    # containers whose persisted state was "running". Caught here:
    # all exited/created containers with RestartPolicy != "no" are started.
    #
    # Live finding: "on-failure" means by Docker semantics
    # "only restart if the last exit code was != 0" -- a one-shot job (e.g. zammad-init)
    # that finished cleanly with 0 deliberately STAYS stopped in Docker.
    # The recovery filter ignored the exit code and
    # always restarted on-failure containers, even after exit 0 -- harmless
    # for idempotent init scripts, but semantically wrong (not a recovery
    # case, just an unnecessary re-run). "always"/"unless-stopped" stay
    # unchanged (they should always run anyway, regardless of exit code
    # -- exactly the traefik case from the original RCA).
    - name: Detect docker presence
      ansible.builtin.command: which docker
      register: hu_docker_present
      changed_when: false
      failed_when: false

    - name: Find stopped containers with auto-restart policy (recovery candidates)
      ansible.builtin.shell: |
        set -o pipefail
        docker ps -a --filter status=exited --filter status=created \
          --format '{{ "{{" }}.Names{{ "}}" }}' | while read -r name; do
          [ -z "$name" ] && continue
          policy=$(docker inspect "$name" --format '{{ "{{" }}.HostConfig.RestartPolicy.Name{{ "}}" }}' 2>/dev/null)
          case "$policy" in
            always|unless-stopped)
              echo "$name $policy"
              ;;
            on-failure)
              exit_code=$(docker inspect "$name" --format '{{ "{{" }}.State.ExitCode{{ "}}" }}' 2>/dev/null)
              [ "$exit_code" != "0" ] && echo "$name $policy"
              ;;
          esac
        done
      args:
        executable: /bin/bash
      register: hu_recovery_candidates
      changed_when: false
      when: hu_docker_present.rc == 0

    - name: Recover stopped containers (docker start)
      ansible.builtin.command: "docker start {{ item.split(' ')[0] }}"
      loop: "{{ hu_recovery_candidates.stdout_lines | default([]) }}"
      register: hu_recovery_result
      when:
        - hu_docker_present.rc == 0
        - hu_recovery_candidates.stdout_lines | default([]) | length > 0
      changed_when: hu_recovery_result.rc == 0

    - name: Capture running systemd services (post)
      ansible.builtin.shell: |
        set -o pipefail
        systemctl list-units --type=service --state=running --no-legend --no-pager \
          | awk '{print $1}' | sort
      args:
        executable: /bin/bash
      register: hu_services_post
      changed_when: false

    - name: Capture failed systemd units (post)
      ansible.builtin.shell: |
        set -o pipefail
        systemctl list-units --state=failed --no-legend --no-pager \
          | awk '{print $2}' | sort
      args:
        executable: /bin/bash
      register: hu_failed_post
      changed_when: false

    - name: Diff pre/post services
      ansible.builtin.set_fact:
        hu_services_lost: "{{ hu_services_pre.stdout_lines | difference(hu_services_post.stdout_lines) }}"
        hu_services_new: "{{ hu_services_post.stdout_lines | difference(hu_services_pre.stdout_lines) }}"
        hu_failed_new: "{{ hu_failed_post.stdout_lines | difference(hu_failed_pre.stdout_lines) }}"

    - name: Smoke — uname + uptime
      ansible.builtin.command: "{{ item }}"
      register: hu_smoke
      changed_when: false
      loop:
        - uname -r
        - uptime

    # External domain smokes from the control machine
    # (not from the host itself -- a check from the inside would not see a broken
    # external path such as Traefik/DNS/cloud firewall). Source:
    # the host's `domains:` list, passed through via inventory. Empty list -> task has 0 iterations,
    # runs through cleanly (no when needed, Ansible skips empty loops).
    #
    # Live finding: right after "SSH is back", all
    # 6 domains returned 403/404 -- Traefik/Authelia were not yet
    # fully warm after the reboot. ~90s later (manual curl) all 6
    # were fine (302 Authelia redirect or 200). Not a real outage but
    # a timing race between "SSH reachable" and "reverse proxy/auth
    # backend fully up". Retry instead of blind sleep: waits only as
    # long as needed, per domain independently (different backends warm up
    # at different speeds).
    - name: External domain smokes (from control host)
      ansible.builtin.uri:
        url: "https://{{ item }}"
        method: GET
        status_code: [200, 301, 302, 401]
        timeout: 15
        validate_certs: true
      delegate_to: localhost
      loop: "{{ domains | default([]) }}"
      loop_control:
        label: "{{ item }}"
      register: hu_domain_smokes
      until: hu_domain_smokes.status is defined and hu_domain_smokes.status in [200, 301, 302, 401]
      retries: 6
      delay: 5
      ignore_errors: true
      changed_when: false

    - name: Collect failing domains
      ansible.builtin.set_fact:
        hu_domains_down: "{{ hu_domain_smokes.results | default([]) | selectattr('failed', 'equalto', true) | map(attribute='item') | list }}"

    - name: Final report
      ansible.builtin.debug:
        msg:
          - "host={{ inventory_hostname }}"
          - "kernel_after={{ ansible_kernel }}"
          - "rebooted={{ hu_reboot_result.rebooted | default(false) }}"
          - "services_running_pre={{ hu_services_pre.stdout_lines | length }} post={{ hu_services_post.stdout_lines | length }}"
          - "services_lost={{ hu_services_lost }}"
          - "services_new={{ hu_services_new }}"
          - "failed_units_pre={{ hu_failed_pre.stdout_lines | length }} post={{ hu_failed_post.stdout_lines | length }}"
          - "failed_units_new={{ hu_failed_new }}"
          - "docker_recovered={{ hu_recovery_candidates.stdout_lines | default([]) }}"
          - "domains_checked={{ domains | default([]) }}"
          - "domains_down={{ hu_domains_down }}"

    # Note: hu_services_lost is only reported as WARN (visible in the final report
    # above). Reason: `systemctl --state=running` is a snapshot —
    # on-demand services (polkit, fsckd, timedated, snapd) are often not
    # "running" after a reboot even though they are functionally active. A real
    # service health check happens via failed units + optionally stack-
    # specific smokes (separately per host).

    - name: Hard fail when new failed units appeared
      ansible.builtin.fail:
        msg: "New failed units after update/reboot on {{ inventory_hostname }}: {{ hu_failed_new }}"
      when: hu_failed_new | length > 0

    - name: Hard fail when required domains are down
      ansible.builtin.fail:
        msg: "domains_required_up=true for {{ inventory_hostname }}, but not reachable: {{ hu_domains_down }}"
      when:
        - domains_required_up | default(false) | bool
        - hu_domains_down | length > 0
