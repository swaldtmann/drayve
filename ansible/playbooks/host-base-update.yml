---
# host-base-update — applies the host-base-update role to all Ubuntu hosts
# in scope (auto_update != false in the inventory).
#
# Flaechige unattended-upgrades-Hygiene.
# Reboots are NOT triggered here — host-update.yml handles that.
#
# Inventory:
#   Nutzt ein zentrales Inventory-Skript (filtert ssh_alias,
#   ki_freigabe=true, status!=retiring/decommissioned, patch.auto_update!=false).
#
# Aufruf:
#   cd <drayve checkout>/ansible
#   ansible-playbook -i <your inventory script or file> \
#     playbooks/host-base-update.yml [--limit myhost] [--check --diff]
#
# Idempotenz-Beweis: zweiter Lauf erwartet `changed=0`.

- name: Apply host-base-update role
  hosts: all
  # become: nicht noetig — alle Inventory-Hosts haben Direct-Root-Login
  # (ssh_user=root oder named-user mit uid=0). host-update.yml (apt-upgrade + reboot)
  # bleibt unkritisch, weil Tasks ohnehin als root laufen.
  gather_facts: true

  pre_tasks:
    - name: Skip non-Ubuntu hosts cleanly (HAOS, FreeBSD, etc.)
      ansible.builtin.meta: end_host
      when: ansible_distribution != "Ubuntu"

  roles:
    - role: host-base-update
