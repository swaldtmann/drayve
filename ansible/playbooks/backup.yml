---
# Deploy/update backup configuration on Drayve hosts.
#
# Usage:
#   cd ansible && ansible-playbook playbooks/backup.yml -e @../stack.yaml
#   cd ansible && ansible-playbook playbooks/backup.yml -l myhost -e @../stack.yaml

- name: Configure backup
  hosts: drayve
  become: true

  pre_tasks:
    - name: Drayve preflight — required deployment variables
      ansible.builtin.import_tasks: ../tasks/preflight_vars.yml

  roles:
    - backup
