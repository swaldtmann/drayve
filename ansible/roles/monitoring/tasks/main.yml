---
# Monitoring role — profile-based with a-la-carte overrides.
#
# Profiles:
#   full (~800MB)  — Prometheus, Grafana, Loki, Promtail, cAdvisor, node_exporter
#   light (~50MB)  — node_exporter, Promtail (push to remote Grafana)
#   none           — no monitoring containers

# === Resolve profile from stack.yaml or flat var ===
- name: Resolve monitoring profile
  ansible.builtin.set_fact:
    _monitoring_profile: "{{ monitoring.profile | default(monitoring_profile) | default('full') }}"
  tags: [monitoring]

# === Resolve effective flags ===
- name: Set monitoring defaults from profile
  ansible.builtin.set_fact:
    _mon_grafana: "{{ monitoring_grafana | default(_monitoring_profile == 'full') | bool }}"
    _mon_prometheus: "{{ monitoring_prometheus | default(_monitoring_profile == 'full') | bool }}"
    _mon_loki: "{{ monitoring_loki | default(_monitoring_profile == 'full') | bool }}"
    _mon_promtail: "{{ monitoring_promtail | default(_monitoring_profile in ['full', 'light']) | bool }}"
    _mon_cadvisor: "{{ monitoring_cadvisor | default(_monitoring_profile == 'full') | bool }}"
    _mon_node_exporter: "{{ monitoring_node_exporter | default(_monitoring_profile in ['full', 'light']) | bool }}"
  tags: [monitoring]

- name: Skip monitoring (profile=none, no overrides)
  ansible.builtin.debug:
    msg: "Monitoring profile: none — skipping"
  when: _monitoring_profile == "none" and not (_mon_grafana or _mon_prometheus or _mon_loki or _mon_promtail or _mon_cadvisor or _mon_node_exporter)
  tags: [monitoring]

# === Directories ===
- name: Create monitoring directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  loop:
    - "{{ drayve_deploy_dir }}/monitoring"
    - "{{ drayve_deploy_dir }}/monitoring/grafana"
    - "{{ drayve_deploy_dir }}/monitoring/prometheus"
  when: _mon_grafana or _mon_prometheus
  tags: [monitoring]

- name: Create node_exporter textfile collector directory
  ansible.builtin.file:
    path: "{{ drayve_deploy_dir }}/monitoring/node-exporter-textfile"
    state: directory
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  when: _mon_node_exporter and (monitoring_node_exporter_textfile | default(false) | bool)
  tags: [monitoring]

# === Prometheus config ===
- name: Deploy Prometheus config
  ansible.builtin.copy:
    dest: "{{ drayve_deploy_dir }}/monitoring/prometheus/prometheus.yml"
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']
      {% if _mon_node_exporter %}

        - job_name: 'node'
          static_configs:
            - targets: ['node-exporter:9100']
      {% endif %}
      {% if _mon_cadvisor %}

        - job_name: 'cadvisor'
          static_configs:
            - targets: ['cadvisor:8080']
      {% endif %}

        - job_name: 'traefik'
          static_configs:
            - targets: ['traefik:8080']

      {% if crowdsec_enabled %}

        - job_name: 'crowdsec'
          static_configs:
            - targets: ['crowdsec:6060']
      {% endif %}
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: _mon_prometheus
  register: prometheus_config
  tags: [monitoring]

# === Loki config ===
- name: Create Loki directory
  ansible.builtin.file:
    path: "{{ drayve_deploy_dir }}/monitoring/loki"
    state: directory
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  when: _mon_loki
  tags: [monitoring]

- name: Deploy Loki config
  ansible.builtin.copy:
    dest: "{{ drayve_deploy_dir }}/monitoring/loki/loki-config.yml"
    content: |
      auth_enabled: false
      server:
        http_listen_port: 3100
      common:
        ring:
          instance_addr: 127.0.0.1
          kvstore:
            store: inmemory
        replication_factor: 1
        path_prefix: /loki
      schema_config:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage_config:
        filesystem:
          directory: /loki/chunks
      compactor:
        working_directory: /loki/compactor
        retention_enabled: true
        delete_request_store: filesystem
      limits_config:
        retention_period: "{{ monitoring_loki_retention_period }}"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: _mon_loki
  register: _loki_config
  tags: [monitoring]

# === Promtail config ===
- name: Resolve Promtail Loki URL
  ansible.builtin.set_fact:
    _promtail_loki_url: "{{ monitoring.loki_url | default(monitoring_loki_url) | default('http://loki:3100/loki/api/v1/push') }}"
  when: _mon_promtail
  tags: [monitoring]

# Optional HTTP Basic-Auth for the Promtail Loki client, e.g. an external
# Loki behind nginx Basic-Auth (monitoring.loki_url). Username lives in
# stack.yaml, password in secrets.yml (monitoring_loki_basic_auth_password,
# roles/secrets) — empty user (default) keeps promtail-config.yml.j2
# byte-identical to v0.8.2.
- name: Resolve Promtail Loki Basic-Auth user
  ansible.builtin.set_fact:
    _promtail_loki_basic_auth_user: "{{ monitoring.loki_basic_auth_user | default(monitoring_loki_basic_auth_user) | default('') }}"
  when: _mon_promtail
  tags: [monitoring]

# Optional external_labels.host for the Promtail Loki client — useful when
# several hosts push into the same external Loki. Empty (default) keeps
# promtail-config.yml.j2 byte-identical to v0.8.2.
- name: Resolve Promtail external host label
  ansible.builtin.set_fact:
    _promtail_host_label: "{{ monitoring.loki_host_label | default(monitoring_loki_host_label) | default('') }}"
  when: _mon_promtail
  tags: [monitoring]

- name: Warn — Promtail without local Loki and no loki_url configured
  ansible.builtin.debug:
    msg: >-
      WARNING: Promtail is enabled but no local Loki is running (profile={{ _monitoring_profile }})
      and no monitoring.loki_url is set. Promtail will try http://loki:3100 which will fail.
      Set monitoring.loki_url in stack.yaml to point to a remote Loki instance.
  when:
    - _mon_promtail
    - not (_mon_loki | bool)
    - _promtail_loki_url == "http://loki:3100/loki/api/v1/push"
  tags: [monitoring]

- name: Create Promtail directory
  ansible.builtin.file:
    path: "{{ drayve_deploy_dir }}/monitoring/promtail"
    state: directory
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  when: _mon_promtail
  tags: [monitoring]

- name: Write Promtail Loki Basic-Auth password file
  ansible.builtin.copy:
    content: "{{ monitoring_loki_basic_auth_password | default('') }}"
    dest: "{{ drayve_deploy_dir }}/monitoring/promtail/loki-basic-auth-password"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0600"
  when:
    - _mon_promtail
    - _promtail_loki_basic_auth_user | length > 0
  no_log: true
  tags: [monitoring]

- name: Deploy Promtail config
  ansible.builtin.template:
    src: promtail-config.yml.j2
    dest: "{{ drayve_deploy_dir }}/monitoring/promtail/promtail-config.yml"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: _mon_promtail
  register: _promtail_config
  tags: [monitoring]

# === Grafana provisioning (dashboards + datasources) ===
- name: Create Grafana provisioning directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  loop:
    - "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/dashboards/json"
    - "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/datasources"
    - "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/alerting"
  when: _mon_grafana
  tags: [monitoring, dashboards]

- name: Deploy Grafana dashboard provider config
  ansible.builtin.copy:
    src: "{{ ops_deploy_root }}/config/grafana/provisioning/dashboards/provider.yml"
    dest: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/dashboards/provider.yml"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: _mon_grafana
  tags: [monitoring, dashboards]

- name: Deploy Grafana datasources
  ansible.builtin.copy:
    src: "{{ ops_deploy_root }}/config/grafana/provisioning/datasources/prometheus.yml"
    dest: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/datasources/prometheus.yml"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: _mon_grafana
  register: grafana_datasources
  tags: [monitoring, dashboards]

- name: Deploy CrowdSec LAPI datasource
  ansible.builtin.copy:
    dest: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/datasources/crowdsec-lapi.yml"
    content: |
      apiVersion: 1

      deleteDatasources:
        - name: CrowdSec LAPI
          orgId: 1

      datasources:
        - name: CrowdSec LAPI
          uid: crowdsec-lapi
          type: yesoreyeram-infinity-datasource
          access: proxy
          editable: false
          url: http://crowdsec:8080
          jsonData:
            auth_method: apiKey
            apiKeyKey: X-Api-Key
            apiKeyType: header
            allowedHosts:
              - "http://crowdsec:8080"
          secureJsonData:
            apiKeyValue: $__env{CROWDSEC_LAPI_KEY}
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: _mon_grafana and (crowdsec_enabled)
  register: grafana_crowdsec_ds
  tags: [monitoring, dashboards]

- name: Remove CrowdSec LAPI datasource when CrowdSec disabled
  ansible.builtin.file:
    path: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/datasources/crowdsec-lapi.yml"
    state: absent
  when: _mon_grafana and not (crowdsec_enabled)
  tags: [monitoring, dashboards]

- name: Deploy Grafana dashboards
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/dashboards/json/"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  with_fileglob:
    - "{{ ops_deploy_root }}/config/grafana/provisioning/dashboards/json/*.json"
  when: _mon_grafana
  register: grafana_dashboards
  tags: [monitoring, dashboards]

# === Grafana alerting: kigulls-api-webhook contact point + routing policy ===
# Optional, gated on grafana_alert_api_token — off by default, no config migration
# for consumers that never set it. CW-W-245: same contact point/policy pattern
# already hand-copied onto genua/cloud/hub/kakapo, now versioned + wired to a
# real secret instead of an unset $KIGULLS_API_TOKEN env var.
- name: Deploy Grafana alert contact point (kigulls-api-webhook)
  ansible.builtin.copy:
    src: "{{ ops_deploy_root }}/config/grafana/provisioning/alerting/contact-points.yaml"
    dest: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/alerting/contact-points.yaml"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: _mon_grafana and (grafana_alert_api_token | default('') | length > 0)
  register: grafana_alert_contact_points
  tags: [monitoring, alerting]

- name: Deploy Grafana alert policy (route to kigulls-api-webhook)
  ansible.builtin.copy:
    src: "{{ ops_deploy_root }}/config/grafana/provisioning/alerting/policies.yaml"
    dest: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/alerting/policies.yaml"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: _mon_grafana and (grafana_alert_api_token | default('') | length > 0)
  register: grafana_alert_policies
  tags: [monitoring, alerting]

# === Grafana alerting: email contact point via SMTP (KIG-W-054) ===
# Optional, gated on grafana_smtp_host — off by default, no config migration
# for consumers that never set it (same idiom as the kigulls-api-webhook
# block above). Additive: does not touch policies.yaml/routing, does not
# retire the webhook contact point — a host can have both deployed, wiring
# either into the routing policy is a separate step.
- name: Assert Grafana alert email recipient is configured when SMTP is enabled
  ansible.builtin.assert:
    that:
      - grafana_alert_email_to | default('') | length > 0
    fail_msg: |
      grafana_smtp_host is set but grafana_alert_email_to is empty. Set
      grafana_alert_email_to (e.g. in stack.yaml) to the address that should
      receive Grafana alert emails, or unset grafana_smtp_host to disable
      the SMTP alert contact point.
  when: _mon_grafana and (grafana_smtp_host | default('') | length > 0)
  tags: [monitoring, alerting]

- name: Deploy Grafana alert contact point (email via SMTP)
  ansible.builtin.copy:
    dest: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/alerting/contact-points-email.yaml"
    content: |
      apiVersion: 1

      contactPoints:
        - orgId: 1
          name: grafana-smtp-email
          receivers:
            - uid: grafana-smtp-email-1
              type: email
              disableResolveMessage: false
              settings:
                addresses: {{ grafana_alert_email_to }}
                singleEmail: true
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: _mon_grafana and (grafana_smtp_host | default('') | length > 0)
  register: grafana_alert_email_contact_point
  tags: [monitoring, alerting]

# === Grafana alerting: Slack contact point for severity=critical (KIG-W-054 Schritt 2b) ===
# Optional, gated on grafana_slack_token — off by default, same idiom as the
# SMTP block above. Additive: does not touch the root routing by itself —
# wiring severity=critical into policies.yaml happens in the root-policy
# block further down, alongside the SMTP root receiver.
- name: Assert Grafana alert Slack channel is configured when Slack token is set
  ansible.builtin.assert:
    that:
      - grafana_alert_slack_channel | default('') | length > 0
    fail_msg: |
      grafana_slack_token is set but grafana_alert_slack_channel is empty. Set
      grafana_alert_slack_channel (e.g. in stack.yaml) to the Slack channel
      that should receive severity=critical alerts, or unset
      grafana_slack_token to disable the Slack alert contact point.
  when: _mon_grafana and (grafana_slack_token | default('') | length > 0)
  tags: [monitoring, alerting]

- name: Deploy Grafana alert contact point (Slack critical)
  ansible.builtin.copy:
    dest: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/alerting/contact-points-slack-critical.yaml"
    content: |
      apiVersion: 1

      contactPoints:
        - orgId: 1
          name: slack-critical
          receivers:
            - uid: slack-critical-1
              type: slack
              disableResolveMessage: false
              settings:
                recipient: '{{ grafana_alert_slack_channel }}'
                token: $SLACK_TOKEN
                username: reggi_woos_ki
                title: 'CRIT — {{ "{{" }} .CommonLabels.alertname {{ "}}" }} ({{ "{{" }} .CommonLabels.host {{ "}}" }})'
                text: |
                  {{ "{{" }} range .Alerts {{ "}}" }}
                  *{{ "{{" }} .Annotations.summary {{ "}}" }}*
                  {{ "{{" }} .Annotations.description {{ "}}" }}
                  <{{ "{{" }} .GeneratorURL {{ "}}" }}|Grafana>
                  {{ "{{" }} end {{ "}}" }}
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: _mon_grafana and (grafana_slack_token | default('') | length > 0)
  register: grafana_alert_slack_contact_point
  tags: [monitoring, alerting]

# === Grafana alerting: root policy for SMTP email + Slack critical (KIG-W-054) ===
# Found while wiring Slack: policies.yaml is deployed by the webhook block
# above ONLY when grafana_alert_api_token is set — a host that migrated to
# SMTP (grafana_alert_api_token unset) never gets a policies.yaml at all,
# and Grafana alerts silently fall back to its own built-in default contact
# point instead of grafana-smtp-email. This block replaces that gap: deployed
# whenever grafana_smtp_host OR grafana_slack_token is set (not just the old
# webhook token), independent of the webhook path. Runs after the webhook
# policy task above, so once a host has SMTP and/or Slack configured this
# becomes the effective policies.yaml (last write wins on the same dest) —
# that IS the intended cutover away from the webhook root receiver.
# Root receiver is grafana-smtp-email when SMTP is configured; if only Slack
# is configured (no SMTP), root stays on Grafana's own built-in default
# contact point (grafana-default-email) rather than pointing at an undefined
# receiver. severity=critical additionally routes to Slack with
# continue: true (Mail/default AND Slack, no replacement) when Slack is set.
- name: "Deploy Grafana alert policy (root: SMTP email + Slack critical)"
  ansible.builtin.copy:
    dest: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/alerting/policies.yaml"
    content: |
      apiVersion: 1

      policies:
        - orgId: 1
          receiver: {{ 'grafana-smtp-email' if (grafana_smtp_host | default('') | length > 0) else 'grafana-default-email' }}
          group_by: ['alertname', 'severity']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
      {% if grafana_slack_token | default('') | length > 0 %}
          routes:
            # KIG-W-054 Schritt 2b: severity=critical zusaetzlich nach Slack.
            # continue:true -> Root-Receiver feuert trotzdem, kein Ersatz sondern Zusatz.
            - receiver: slack-critical
              matchers:
                - severity = critical
              continue: true
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
      {% endif %}
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: >-
    _mon_grafana and
    ((grafana_smtp_host | default('') | length > 0) or
     (grafana_slack_token | default('') | length > 0))
  register: grafana_alert_root_policy
  tags: [monitoring, alerting]

# === Grafana alert rules: optional per-host override (DRAYVE-W-014) ===
# Alert rule thresholds/labels/host-names are inherently host-specific (unlike
# the contact-point/policy above), so this follows the same per-host-override
# idiom as compose.override.yml (roles/deploy/tasks/main.yml) rather than the
# framework-fixed config/ pattern: optional file under deploy/<host>/, copied
# if present, removed if not -- no consumer without one sees any change.
# Found live: prod-cloud's alerting rules.yaml was hand-maintained directly on
# the host, outside any repo, surviving only because no deploy task touched it
# -- the same "invisible until the host is rebuilt" drift class as the
# unversioned backup-freshness-write script this ticket also retires.
- name: Check for host Grafana alert rules override
  ansible.builtin.stat:
    path: "{{ ops_secrets_root }}/deploy/{{ inventory_hostname }}/grafana-alert-rules.yaml"
  register: _grafana_alert_rules_override
  delegate_to: localhost
  become: false
  when: _mon_grafana
  tags: [monitoring, alerting]

- name: Deploy host Grafana alert rules
  ansible.builtin.copy:
    src: "{{ ops_secrets_root }}/deploy/{{ inventory_hostname }}/grafana-alert-rules.yaml"
    dest: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/alerting/rules.yaml"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: _mon_grafana and _grafana_alert_rules_override.stat.exists | default(false)
  tags: [monitoring, alerting]

- name: Remove host Grafana alert rules if not present locally
  ansible.builtin.file:
    path: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/alerting/rules.yaml"
    state: absent
  when: _mon_grafana and not (_grafana_alert_rules_override.stat.exists | default(false))
  tags: [monitoring, alerting]

# AFKI-W-239 (Befund 1, closes oops-0096): the removal below is destructive —
# it deletes an already-deployed alert config, not just skips deploying one.
# grafana_alert_api_token comes exclusively from roles/secrets (tag [secrets]).
# A tag-scoped run without that tag (e.g. --tags monitoring) leaves the token
# empty and would delete a correctly deployed contact-points.yaml/policies.yaml
# (this is exactly the oops-0096 incident). Re-stat secrets.yml + the target
# files here (cheap, independent of whether roles/secrets ran this pass) and
# fail before the delete, same pattern as AFKI-W-233's deploy-role guard.
- name: Check for host secrets file (cross-tag guard, AFKI-W-239)
  ansible.builtin.stat:
    path: "{{ ops_secrets_root }}/deploy/{{ inventory_hostname }}/secrets.yml"
  register: _mon_secrets_file_check
  delegate_to: localhost
  become: false
  when: _mon_grafana
  tags: [monitoring, alerting]

- name: Check for existing Grafana alert contact-point file (cross-tag guard, AFKI-W-239)
  ansible.builtin.stat:
    path: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/alerting/contact-points.yaml"
  register: _mon_alert_contact_points_precheck
  when: _mon_grafana
  tags: [monitoring, alerting]

- name: Check for existing Grafana alert policy file (cross-tag guard, AFKI-W-239)
  ansible.builtin.stat:
    path: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/alerting/policies.yaml"
  register: _mon_alert_policies_precheck
  when: _mon_grafana
  tags: [monitoring, alerting]

- name: Check for existing Grafana alert contact-point file (email via SMTP) (cross-tag guard, AFKI-W-239)
  ansible.builtin.stat:
    path: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/alerting/contact-points-email.yaml"
  register: _mon_alert_email_contact_point_precheck
  when: _mon_grafana
  tags: [monitoring, alerting]

- name: Check for existing Grafana alert contact-point file (Slack critical) (cross-tag guard, AFKI-W-239)
  ansible.builtin.stat:
    path: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/alerting/contact-points-slack-critical.yaml"
  register: _mon_alert_slack_contact_point_precheck
  when: _mon_grafana
  tags: [monitoring, alerting]

- name: Guard — fail instead of deleting Grafana alert config when secrets weren't loaded (AFKI-W-239)
  ansible.builtin.assert:
    that:
      - >-
        not (
          _mon_secrets_file_check.stat.exists and
          drayve_secrets_facts_loaded is not defined and
          (grafana_alert_api_token | default('') | length == 0) and
          (_mon_alert_contact_points_precheck.stat.exists | default(false))
        )
      - >-
        not (
          _mon_secrets_file_check.stat.exists and
          drayve_secrets_facts_loaded is not defined and
          (grafana_alert_api_token | default('') | length == 0) and
          (grafana_smtp_host | default('') | length == 0) and
          (grafana_slack_token | default('') | length == 0) and
          (_mon_alert_policies_precheck.stat.exists | default(false))
        )
      - >-
        not (
          _mon_secrets_file_check.stat.exists and
          drayve_secrets_facts_loaded is not defined and
          (grafana_smtp_host | default('') | length == 0) and
          (_mon_alert_email_contact_point_precheck.stat.exists | default(false))
        )
      - >-
        not (
          _mon_secrets_file_check.stat.exists and
          drayve_secrets_facts_loaded is not defined and
          (grafana_slack_token | default('') | length == 0) and
          (_mon_alert_slack_contact_point_precheck.stat.exists | default(false))
        )
    fail_msg: |
      Secrets nicht geladen — Monitoring-Deploy ohne `secrets`-Tag gefahren?
      deploy/{{ inventory_hostname }}/secrets.yml existiert, aber die Rolle
      secrets (Task "Set secret variables", tag [secrets]) hat in diesem
      Lauf nicht gesetzt. grafana_alert_api_token bzw. grafana_smtp_host bzw.
      grafana_slack_token ist deshalb leer, und der naechste Schritt wuerde
      die bestehende Grafana-Alert-Config (contact-points.yaml/policies.yaml
      bzw. contact-points-email.yaml bzw. contact-points-slack-critical.yaml)
      LOESCHEN statt sie unangetastet zu lassen (oops-0096).

      Fix: `--tags secrets,monitoring` statt `--tags monitoring` allein, oder
      den vollen Lauf ohne Tag-Scoping fahren.
  when: _mon_grafana
  tags: [monitoring, alerting]

- name: Remove Grafana alert contact point/policy when token not configured
  ansible.builtin.file:
    path: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/alerting/{{ item }}"
    state: absent
  loop:
    - contact-points.yaml
    - policies.yaml
  when: >-
    _mon_grafana and (grafana_alert_api_token | default('') | length == 0) and
    (item == 'contact-points.yaml' or
     ((grafana_smtp_host | default('') | length == 0) and
      (grafana_slack_token | default('') | length == 0)))
  tags: [monitoring, alerting]

- name: Remove Grafana alert contact point (email) when SMTP not configured
  ansible.builtin.file:
    path: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/alerting/contact-points-email.yaml"
    state: absent
  when: _mon_grafana and (grafana_smtp_host | default('') | length == 0)
  tags: [monitoring, alerting]

- name: Remove Grafana alert contact point (Slack critical) when Slack not configured
  ansible.builtin.file:
    path: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/alerting/contact-points-slack-critical.yaml"
    state: absent
  when: _mon_grafana and (grafana_slack_token | default('') | length == 0)
  tags: [monitoring, alerting]

- name: Check if compose file exists (skip restart on first provision)
  ansible.builtin.stat:
    path: "{{ drayve_deploy_dir }}/docker-compose.yml"
  register: _compose_file
  tags: [monitoring, dashboards]

- name: Force-recreate Grafana on config change
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate grafana
    chdir: "{{ drayve_deploy_dir }}"
  become: true
  become_user: "{{ drayve_user }}"
  when: >-
    _compose_file.stat.exists and
    ((grafana_dashboards.changed | default(false)) or
    (grafana_datasources.changed | default(false)) or
    (grafana_crowdsec_ds.changed | default(false)) or
    (grafana_alert_contact_points.changed | default(false)) or
    (grafana_alert_policies.changed | default(false)) or
    (grafana_alert_email_contact_point.changed | default(false)) or
    (grafana_alert_slack_contact_point.changed | default(false)) or
    (grafana_alert_root_policy.changed | default(false)))
  tags: [monitoring, dashboards]

- name: Force-recreate Loki on config change
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate loki
    chdir: "{{ drayve_deploy_dir }}"
  become: true
  become_user: "{{ drayve_user }}"
  when: >-
    _compose_file.stat.exists and _mon_loki and
    (_loki_config.changed | default(false))
  tags: [monitoring]

- name: Force-recreate Promtail on config change
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate promtail
    chdir: "{{ drayve_deploy_dir }}"
  become: true
  become_user: "{{ drayve_user }}"
  when: >-
    _compose_file.stat.exists and _mon_promtail and
    (_promtail_config.changed | default(false))
  tags: [monitoring]

# === Set facts for compose template ===
- name: Export monitoring flags for compose template
  ansible.builtin.set_fact:
    monitoring_services:
      grafana: "{{ _mon_grafana }}"
      prometheus: "{{ _mon_prometheus }}"
      loki: "{{ _mon_loki }}"
      promtail: "{{ _mon_promtail }}"
      cadvisor: "{{ _mon_cadvisor }}"
      node_exporter: "{{ _mon_node_exporter }}"
  tags: [monitoring]
