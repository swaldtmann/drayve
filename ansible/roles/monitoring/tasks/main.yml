---
# Monitoring role — profile-based with a-la-carte overrides.
#
# Profiles:
#   full (~800MB)  — Prometheus, Grafana, Loki, Promtail, cAdvisor, node_exporter
#   light (~50MB)  — node_exporter, Promtail (push to remote Grafana)
#   none           — no monitoring containers

# === Resolve profile from stack.yaml or flat var ===
- name: Resolve monitoring profile
  ansible.builtin.set_fact:
    _monitoring_profile: "{{ monitoring.profile | default(monitoring_profile) | default('full') }}"
  tags: [monitoring]

# === Resolve effective flags ===
- name: Set monitoring defaults from profile
  ansible.builtin.set_fact:
    _mon_grafana: "{{ monitoring_grafana | default(_monitoring_profile == 'full') | bool }}"
    _mon_prometheus: "{{ monitoring_prometheus | default(_monitoring_profile == 'full') | bool }}"
    _mon_loki: "{{ monitoring_loki | default(_monitoring_profile == 'full') | bool }}"
    _mon_promtail: "{{ monitoring_promtail | default(_monitoring_profile in ['full', 'light']) | bool }}"
    _mon_cadvisor: "{{ monitoring_cadvisor | default(_monitoring_profile == 'full') | bool }}"
    _mon_node_exporter: "{{ monitoring_node_exporter | default(_monitoring_profile in ['full', 'light']) | bool }}"
  tags: [monitoring]

- name: Skip monitoring (profile=none, no overrides)
  ansible.builtin.debug:
    msg: "Monitoring profile: none — skipping"
  when: _monitoring_profile == "none" and not (_mon_grafana or _mon_prometheus or _mon_loki or _mon_promtail or _mon_cadvisor or _mon_node_exporter)
  tags: [monitoring]

# === Directories ===
- name: Create monitoring directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  loop:
    - "{{ drayve_deploy_dir }}/monitoring"
    - "{{ drayve_deploy_dir }}/monitoring/grafana"
    - "{{ drayve_deploy_dir }}/monitoring/prometheus"
  when: _mon_grafana or _mon_prometheus
  tags: [monitoring]

- name: Create node_exporter textfile collector directory
  ansible.builtin.file:
    path: "{{ drayve_deploy_dir }}/monitoring/node-exporter-textfile"
    state: directory
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  when: _mon_node_exporter and (monitoring_node_exporter_textfile | default(false) | bool)
  tags: [monitoring]

# === Prometheus config ===
- name: Deploy Prometheus config
  ansible.builtin.copy:
    dest: "{{ drayve_deploy_dir }}/monitoring/prometheus/prometheus.yml"
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']
      {% if _mon_node_exporter %}

        - job_name: 'node'
          static_configs:
            - targets: ['node-exporter:9100']
      {% endif %}
      {% if _mon_cadvisor %}

        - job_name: 'cadvisor'
          static_configs:
            - targets: ['cadvisor:8080']
      {% endif %}

        - job_name: 'traefik'
          static_configs:
            - targets: ['traefik:8080']

        - job_name: 'crowdsec'
          static_configs:
            - targets: ['crowdsec:6060']
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: _mon_prometheus
  tags: [monitoring]

# === Loki config ===
- name: Create Loki directory
  ansible.builtin.file:
    path: "{{ drayve_deploy_dir }}/monitoring/loki"
    state: directory
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  when: _mon_loki
  tags: [monitoring]

- name: Deploy Loki config
  ansible.builtin.copy:
    dest: "{{ drayve_deploy_dir }}/monitoring/loki/loki-config.yml"
    content: |
      auth_enabled: false
      server:
        http_listen_port: 3100
      common:
        ring:
          instance_addr: 127.0.0.1
          kvstore:
            store: inmemory
        replication_factor: 1
        path_prefix: /loki
      schema_config:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage_config:
        filesystem:
          directory: /loki/chunks
      compactor:
        working_directory: /loki/compactor
        retention_enabled: true
        delete_request_store: filesystem
      limits_config:
        retention_period: "{{ monitoring_loki_retention_period }}"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: _mon_loki
  register: _loki_config
  tags: [monitoring]

# === Promtail config ===
- name: Resolve Promtail Loki URL
  ansible.builtin.set_fact:
    _promtail_loki_url: "{{ monitoring.loki_url | default(monitoring_loki_url) | default('http://loki:3100/loki/api/v1/push') }}"
  when: _mon_promtail
  tags: [monitoring]

- name: Warn — Promtail without local Loki and no loki_url configured
  ansible.builtin.debug:
    msg: >-
      WARNING: Promtail is enabled but no local Loki is running (profile={{ _monitoring_profile }})
      and no monitoring.loki_url is set. Promtail will try http://loki:3100 which will fail.
      Set monitoring.loki_url in stack.yaml to point to a remote Loki instance.
  when:
    - _mon_promtail
    - not (_mon_loki | bool)
    - _promtail_loki_url == "http://loki:3100/loki/api/v1/push"
  tags: [monitoring]

- name: Create Promtail directory
  ansible.builtin.file:
    path: "{{ drayve_deploy_dir }}/monitoring/promtail"
    state: directory
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  when: _mon_promtail
  tags: [monitoring]

- name: Deploy Promtail config
  ansible.builtin.template:
    src: promtail-config.yml.j2
    dest: "{{ drayve_deploy_dir }}/monitoring/promtail/promtail-config.yml"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: _mon_promtail
  register: _promtail_config
  tags: [monitoring]

# === Grafana provisioning (dashboards + datasources) ===
- name: Create Grafana provisioning directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  loop:
    - "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/dashboards/json"
    - "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/datasources"
    - "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/alerting"
  when: _mon_grafana
  tags: [monitoring, dashboards]

- name: Deploy Grafana dashboard provider config
  ansible.builtin.copy:
    src: "{{ ops_deploy_root }}/config/grafana/provisioning/dashboards/provider.yml"
    dest: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/dashboards/provider.yml"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: _mon_grafana
  tags: [monitoring, dashboards]

- name: Deploy Grafana datasources
  ansible.builtin.copy:
    src: "{{ ops_deploy_root }}/config/grafana/provisioning/datasources/prometheus.yml"
    dest: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/datasources/prometheus.yml"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: _mon_grafana
  register: grafana_datasources
  tags: [monitoring, dashboards]

- name: Deploy CrowdSec LAPI datasource
  ansible.builtin.copy:
    dest: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/datasources/crowdsec-lapi.yml"
    content: |
      apiVersion: 1

      deleteDatasources:
        - name: CrowdSec LAPI
          orgId: 1

      datasources:
        - name: CrowdSec LAPI
          uid: crowdsec-lapi
          type: yesoreyeram-infinity-datasource
          access: proxy
          editable: false
          url: http://crowdsec:8080
          jsonData:
            auth_method: apiKey
            apiKeyKey: X-Api-Key
            apiKeyType: header
            allowedHosts:
              - "http://crowdsec:8080"
          secureJsonData:
            apiKeyValue: $__env{CROWDSEC_LAPI_KEY}
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: _mon_grafana and (crowdsec_enabled)
  register: grafana_crowdsec_ds
  tags: [monitoring, dashboards]

- name: Remove CrowdSec LAPI datasource when CrowdSec disabled
  ansible.builtin.file:
    path: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/datasources/crowdsec-lapi.yml"
    state: absent
  when: _mon_grafana and not (crowdsec_enabled)
  tags: [monitoring, dashboards]

- name: Deploy Grafana dashboards
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/dashboards/json/"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  with_fileglob:
    - "{{ ops_deploy_root }}/config/grafana/provisioning/dashboards/json/*.json"
  when: _mon_grafana
  register: grafana_dashboards
  tags: [monitoring, dashboards]

# === Grafana alerting: kigulls-api-webhook contact point + routing policy ===
# Optional, gated on grafana_alert_api_token — off by default, no config migration
# for consumers that never set it. CW-W-245: same contact point/policy pattern
# already hand-copied onto genua/cloud/hub/kakapo, now versioned + wired to a
# real secret instead of an unset $KIGULLS_API_TOKEN env var.
- name: Deploy Grafana alert contact point (kigulls-api-webhook)
  ansible.builtin.copy:
    src: "{{ ops_deploy_root }}/config/grafana/provisioning/alerting/contact-points.yaml"
    dest: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/alerting/contact-points.yaml"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: _mon_grafana and (grafana_alert_api_token | default('') | length > 0)
  register: grafana_alert_contact_points
  tags: [monitoring, alerting]

- name: Deploy Grafana alert policy (route to kigulls-api-webhook)
  ansible.builtin.copy:
    src: "{{ ops_deploy_root }}/config/grafana/provisioning/alerting/policies.yaml"
    dest: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/alerting/policies.yaml"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: _mon_grafana and (grafana_alert_api_token | default('') | length > 0)
  register: grafana_alert_policies
  tags: [monitoring, alerting]

- name: Remove Grafana alert contact point/policy when token not configured
  ansible.builtin.file:
    path: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/alerting/{{ item }}"
    state: absent
  loop:
    - contact-points.yaml
    - policies.yaml
  when: _mon_grafana and (grafana_alert_api_token | default('') | length == 0)
  tags: [monitoring, alerting]

- name: Check if compose file exists (skip restart on first provision)
  ansible.builtin.stat:
    path: "{{ drayve_deploy_dir }}/docker-compose.yml"
  register: _compose_file
  tags: [monitoring, dashboards]

- name: Force-recreate Grafana on config change
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate grafana
    chdir: "{{ drayve_deploy_dir }}"
  become: true
  become_user: "{{ drayve_user }}"
  when: >-
    _compose_file.stat.exists and
    ((grafana_dashboards.changed | default(false)) or
    (grafana_datasources.changed | default(false)) or
    (grafana_crowdsec_ds.changed | default(false)) or
    (grafana_alert_contact_points.changed | default(false)) or
    (grafana_alert_policies.changed | default(false)))
  tags: [monitoring, dashboards]

- name: Force-recreate Loki on config change
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate loki
    chdir: "{{ drayve_deploy_dir }}"
  become: true
  become_user: "{{ drayve_user }}"
  when: >-
    _compose_file.stat.exists and _mon_loki and
    (_loki_config.changed | default(false))
  tags: [monitoring]

- name: Force-recreate Promtail on config change
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate promtail
    chdir: "{{ drayve_deploy_dir }}"
  become: true
  become_user: "{{ drayve_user }}"
  when: >-
    _compose_file.stat.exists and _mon_promtail and
    (_promtail_config.changed | default(false))
  tags: [monitoring]

# === Set facts for compose template ===
- name: Export monitoring flags for compose template
  ansible.builtin.set_fact:
    monitoring_services:
      grafana: "{{ _mon_grafana }}"
      prometheus: "{{ _mon_prometheus }}"
      loki: "{{ _mon_loki }}"
      promtail: "{{ _mon_promtail }}"
      cadvisor: "{{ _mon_cadvisor }}"
      node_exporter: "{{ _mon_node_exporter }}"
  tags: [monitoring]
