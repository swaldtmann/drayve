---
# Profile: full | light | none
monitoring_profile: full

# A-la-carte overrides (optional, override profile defaults)
# Set to true/false to force on/off regardless of profile.
# monitoring_grafana: true
# monitoring_prometheus: true
# monitoring_loki: true
# monitoring_cadvisor: true
# monitoring_node_exporter: true

# Grafana
grafana_admin_password: ""
grafana_root_url: "https://grafana.{{ drayve_domain | default('localhost') }}"

# Grafana alert email recipient. Only relevant when
# grafana_smtp_host (roles/secrets) is set — no default, deliberately: the
# monitoring role asserts this is non-empty before deploying the email
# contact point rather than silently mailing nobody.
grafana_alert_email_to: ""

# Grafana alert Slack channel for the severity=critical route.
# Only relevant when grafana_slack_token (roles/secrets) is
# set — no default, deliberately, same idiom as grafana_alert_email_to.
grafana_alert_slack_channel: ""

# Display name the Slack bot posts under (Slack contact point "username").
grafana_alert_slack_username: "drayve"

# Loki retention (Go duration, e.g. "168h", "720h"). Enforced by the compactor.
monitoring_loki_retention_period: "168h"

# Loki query limits (limits_config). The defaults are the Loki upstream
# defaults of the pinned version (grafana/loki 3.3.2: max_entries_limit_per_query
# 5000, max_query_series 500) — shipped unchanged so behaviour does not move.
# Lower them if a single query over long log lines can exhaust mem_loki
# (5000 entries of 16 KiB lines already needs ~80 MiB of raw data per query,
# before Loki's own overhead).
monitoring_loki_max_entries_limit_per_query: 5000
monitoring_loki_max_query_series: 500

# Grafana /api/health without Authelia/basic auth for these sources only
# (list of IPs/CIDRs), e.g. for an external monitoring probe. Empty (default):
# no extra router, nothing changes. When set, an extra Traefik router matches
# exactly Host(grafana.<domain>) && Path(`/api/health`) (no prefix), carries an
# ipAllowList middleware and no auth@file. All other paths stay protected.
grafana_health_allowlist: []

# Optional HTTP Basic-Auth username for the Promtail Loki client
# (monitoring.loki_url pointing at an external Loki behind Basic-Auth).
# Password lives in secrets.yml (monitoring_loki_basic_auth_password,
# roles/secrets), never here. Empty (default) renders promtail-config.yml
# and the promtail service in docker-compose.yml byte-identical to v0.8.2.
monitoring_loki_basic_auth_user: ""

# Optional Promtail external_labels.host value, e.g. "buckbeak" — set this
# when several hosts push into the same external Loki so log streams stay
# distinguishable. Empty (default) renders promtail-config.yml byte-identical
# to v0.8.2.
monitoring_loki_host_label: ""

# Extra Promtail scrape_configs entries (list of dicts), appended after the
# built-in docker job. Use this to scrape host-side log files (already
# mounted read-only at /var/log in the promtail container). Example for a
# cron-driven kedge host log:
#   monitoring_promtail_extra_scrape_configs:
#     - job_name: kedge
#       static_configs:
#         - targets:
#             - localhost
#           labels:
#             job: kedge
#             __path__: /var/log/kedge.log
monitoring_promtail_extra_scrape_configs: []

# node_exporter textfile collector. Off by default, no behavior
# change for existing consumers. When true, node_exporter gets
# --collector.textfile.directory and a read-only mount of
# {{ drayve_deploy_dir }}/monitoring/node-exporter-textfile, so host-side
# cron jobs (e.g. backup-freshness signals) can drop .prom files there.
monitoring_node_exporter_textfile: false
