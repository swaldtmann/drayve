---
authentik_config_dir: "{{ drayve_deploy_dir }}/authentik"
# Landing host: services.landing.domain (stack.yaml), else the drayve domain. The deploy role's
# landing_domain fact is not set yet when this role's config phase runs, hence the explicit chain.
authentik_landing_domain: "{{ (landing_domain | default('', true)) or ((services | default({})).landing | default({})).domain | default(drayve_domain, true) }}"
authentik_bootstrap_dir: "{{ drayve_deploy_dir }}/authentik/bootstrap"

# LDAP Source (optional, from auth.ldap in stack.yaml)
authentik_ldap_enabled: "{{ (auth.ldap | default({})) | length > 0 }}"
authentik_ldap_host: "{{ auth.ldap.host | default('') }}"
authentik_ldap_port: "{{ auth.ldap.port | default(636) }}"
authentik_ldap_base_dn: "{{ auth.ldap.base_dn | default('') }}"
authentik_ldap_bind_dn: "{{ auth.ldap.bind_dn | default('') }}"
authentik_ldap_readonly: "{{ auth.ldap.readonly | default(true) | bool }}"
authentik_ldap_sync_interval: "{{ auth.ldap.sync_interval | default(60) }}"
authentik_ldap_start_tls: "{{ auth.ldap.start_tls | default(false) | bool }}"

# LDAP Source layout — defaults fit a 389-DS (nsPerson accounts, entryUUID, groupOfNames).
# Override per stack in auth.ldap.* (see config/stack.schema.yaml).
authentik_ldap_user_dn: "{{ auth.ldap.user_dn | default('ou=people') }}"
authentik_ldap_group_dn: "{{ auth.ldap.group_dn | default('ou=groups') }}"
authentik_ldap_user_filter: "{{ auth.ldap.user_filter | default('(|(objectClass=inetOrgPerson)(objectClass=nsOrgPerson))') }}"
authentik_ldap_group_filter: "{{ auth.ldap.group_filter | default('(objectClass=groupOfNames)') }}"
authentik_ldap_uniqueness_field: "{{ auth.ldap.uniqueness_field | default('entryUUID') }}"
authentik_ldap_group_membership_field: "{{ auth.ldap.group_membership_field | default('member') }}"
# Built-in user property mappings, by the suffix of their `managed` id
# (goauthentik.io/sources/ldap/<suffix>). Only these are used — never "everything with ldap in its name"
# (ms-samaccountname yields username None on 389-DS).
authentik_ldap_user_mappings: "{{ auth.ldap.user_mappings | default(['openldap-uid', 'openldap-cn', 'default-mail', 'default-dn-path']) }}"
# Group mapping created by the bootstrap: name = <this LDAP attribute> (required for sync_groups).
authentik_ldap_group_name_attr: "{{ auth.ldap.group_name_attr | default('cn') }}"
# Name of an existing certificate keypair in Authentik holding the CA of the LDAP server.
# Empty = the server certificate is NOT verified (Authentik default without peer certificate).
authentik_ldap_tls_ca_name: "{{ auth.ldap.tls_ca_name | default('') }}"
