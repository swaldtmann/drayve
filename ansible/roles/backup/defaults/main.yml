---
backup_enabled: false
backup_target: local  # local | sftp | kedge
backup_schedule: "0 3 * * *"  # 03:00 daily
backup_prune_schedule: "30 4 * * 0"  # Sun 04:30 weekly (kedge target)
backup_retain_daily: 7
backup_retain_weekly: 4
backup_retain_monthly: 6
backup_local_repo: /opt/drayve/backups
backup_sftp_host: ""
backup_sftp_path: ""

# kedge target (backup_target: kedge) — delegates to kedge CLI
# https://codeberg.org/StephanWaldtmann/kedge
backup_kedge_repo: "https://codeberg.org/StephanWaldtmann/kedge.git"
backup_kedge_version: "v0.3.4"
backup_kedge_install_dir: /opt/kedge
backup_kedge_env_file: /root/.kedge.env
backup_kedge_log_file: /var/log/kedge.log
backup_kedge_stack_dir: "{{ drayve_deploy_dir }}"
backup_kedge_restic_repository: ""  # required when target=kedge, e.g. sftp:u1234@u1234.your-storagebox.de:/genua
backup_kedge_stop_stack: true
backup_kedge_exclude_mounts: ""  # space-separated paths, see kedge BACKUP_EXCLUDE_VOLUMES
backup_kedge_healthcheck_url: ""  # optional Healthchecks.io / Uptime Kuma URL
backup_kedge_pre_hook: ""  # optional command, runs before kedge's own backup steps
backup_kedge_post_hook: ""  # optional command, runs after a successful backup (e.g.
                             # freshness-metric export — kedge's own BACKUP_POST_HOOK,
                             # see backup.sh; distinct from backup_kedge_cron_wrapper,
                             # which only signals cron-level failure, not backup success)
backup_kedge_cron_wrapper: ""  # optional cron wrapper, contract: <wrapper> <job-name> -- <cmd...>
                                # (e.g. a fail-signal helper). Wraps both the backup and the
                                # prune cron line, since kedge itself has no fail-hook for prune.

# OpenBao-backed restic password (CW-W-254) — opt-in per host, default off.
# When true: .kedge.env.j2 does NOT template backup_restic_password into
# RESTIC_PASSWORD (that var stays populated from SOPS/ansible-vars only as
# the break-glass copy, unused for the live consumption path). Instead a
# small fetch script logs in via AppRole (role_id here + a locally-stored
# secret_id, delivered once via response-wrapping during bootstrap — not an
# ansible task, see CW-W-254 migration plan) and refreshes RESTIC_PASSWORD
# in .kedge.env right before each cron run, so an ansible redeploy never
# clobbers the live value with a stale templated one.
backup_kedge_use_openbao: false
backup_kedge_openbao_role_id: ""  # not secret, role_id from AppRole "backup-consumer-<host>"
backup_kedge_openbao_base_url: "https://bao.authbox.org/v1"
backup_kedge_openbao_secret_path: "secret/data/backup/{{ stack_name | default(inventory_hostname) }}/kedge"
backup_kedge_openbao_secret_id_file: /root/.kedge-openbao/secret_id
backup_kedge_openbao_fetch_script: /usr/local/bin/kedge-openbao-fetch.py
