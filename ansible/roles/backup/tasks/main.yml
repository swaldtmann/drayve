---
# Backup role — Restic-based backup for Drayve volumes.

- name: Resolve backup settings from stack.yaml
  ansible.builtin.set_fact:
    backup_enabled: "{{ backup.enabled | default(backup_enabled) | default(false) | bool }}"
    backup_target: "{{ backup.target | default(backup_target) | default('local') }}"
    backup_schedule: "{{ backup.schedule | default(backup_schedule) | default('0 3 * * *') }}"
    backup_prune_schedule: "{{ backup.prune_schedule | default(backup_prune_schedule) | default('30 4 * * 0') }}"
    # Resolve canonical stack identifier for derived artefact names
    # (e.g. /etc/cron.d/kedge-<stack_name>). Order: stack.name from
    # stack.yaml, then drayve_name CLI var, then inventory hostname.
    stack_name: "{{ stack.name | default(drayve_name) | default(inventory_hostname) }}"
  tags: [backup]

- name: Skip backup (disabled)
  ansible.builtin.debug:
    msg: "Backup disabled — set backup.enabled: true in stack.yaml"
  when: not (backup_enabled | bool)
  tags: [backup]

- name: Validate kedge target prerequisites
  ansible.builtin.assert:
    that:
      - backup_kedge_restic_repository | length > 0
      - backup_restic_password | length > 0
    fail_msg: "backup_target=kedge requires backup_kedge_restic_repository and backup_restic_password (host_secrets)."
  when:
    - backup_enabled | bool
    - backup_target == "kedge"
  tags: [backup]

- name: Install restic (legacy targets local/sftp)
  ansible.builtin.apt:
    name: restic
    state: present
    cache_valid_time: 3600
  when:
    - backup_enabled | bool
    - backup_target in ["local", "sftp"]
  tags: [backup]

- name: Create local backup directory
  ansible.builtin.file:
    path: "{{ backup_local_repo }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - backup_enabled | bool
    - backup_target == "local"
  tags: [backup]

  # NOTE: restic error message for existing repos varies by version:
  # older: "already initialized", newer: "config file already exists".
  # Match on 'already' (not full string) for cross-version compatibility.
- name: Initialize restic repo (local)
  ansible.builtin.command:
    cmd: "restic init --repo {{ backup_local_repo }}"
  environment:
    RESTIC_PASSWORD: "{{ backup_restic_password }}"
  register: restic_init
  changed_when: "'created restic repository' in restic_init.stdout"
  failed_when: restic_init.rc != 0 and 'already' not in restic_init.stderr
  when:
    - backup_enabled | bool
    - backup_target == "local"
  tags: [backup]

- name: Deploy backup script
  ansible.builtin.copy:
    dest: "{{ drayve_deploy_dir }}/backup.sh"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      export RESTIC_PASSWORD="{{ backup_restic_password }}"
      {% if backup_target == "local" %}
      REPO="{{ backup_local_repo }}"
      {% elif backup_target == "sftp" %}
      REPO="sftp:{{ backup_sftp_host }}:{{ backup_sftp_path }}"
      {% endif %}

      # Stop services for consistent backup
      cd {{ drayve_deploy_dir }}
      docker compose stop grafana prometheus loki 2>/dev/null || true

      # Backup named volumes
      for vol in $(docker volume ls --filter name=drayve_ -q); do
        mountpoint=$(docker volume inspect "$vol" --format '{% raw %}{{.Mountpoint}}{% endraw %}')
        restic backup --repo "$REPO" --tag "$vol" "$mountpoint"
      done

      # Backup deploy dir (configs, .env, compose)
      restic backup --repo "$REPO" --tag config {{ drayve_deploy_dir }}

      # Restart services
      cd {{ drayve_deploy_dir }}
      docker compose up -d

      # Prune old snapshots
      restic forget --repo "$REPO" \
        --keep-daily {{ backup_retain_daily }} \
        --keep-weekly {{ backup_retain_weekly }} \
        --keep-monthly {{ backup_retain_monthly }} \
        --prune
    owner: root
    group: root
    mode: "0700"
  no_log: true
  when:
    - backup_enabled | bool
    - backup_target in ["local", "sftp"]
  tags: [backup]

- name: Deploy backup cron job (legacy targets)
  ansible.builtin.cron:
    name: "drayve-backup"
    minute: "{{ backup_schedule.split(' ')[0] }}"
    hour: "{{ backup_schedule.split(' ')[1] }}"
    day: "{{ backup_schedule.split(' ')[2] }}"
    month: "{{ backup_schedule.split(' ')[3] }}"
    weekday: "{{ backup_schedule.split(' ')[4] }}"
    job: "{{ drayve_deploy_dir }}/backup.sh >> /var/log/drayve-backup.log 2>&1"
    user: root
  when:
    - backup_enabled | bool
    - backup_target in ["local", "sftp"]
  tags: [backup]

# ── kedge target ──────────────────────────────────────────────────────
# Delegates backup/prune to the kedge CLI (https://codeberg.org/StephanWaldtmann/kedge).
# Replaces the in-role restic wrapper above with a separately-versioned tool that
# auto-discovers compose volumes, bind mounts, and DB pre-hooks.
- name: Install kedge dependencies
  ansible.builtin.apt:
    name:
      - restic
      - jq
      - rsync
      - git
    state: present
    cache_valid_time: 3600
  when:
    - backup_enabled | bool
    - backup_target == "kedge"
  tags: [backup]

- name: Clone kedge repository
  ansible.builtin.git:
    repo: "{{ backup_kedge_repo }}"
    dest: "{{ backup_kedge_install_dir }}"
    version: "{{ backup_kedge_version }}"
    force: false
    update: true
  when:
    - backup_enabled | bool
    - backup_target == "kedge"
  tags: [backup]

- name: Symlink kedge CLI to /usr/local/bin
  ansible.builtin.file:
    src: "{{ backup_kedge_install_dir }}/backup.sh"
    dest: /usr/local/bin/kedge
    state: link
    force: true
  when:
    - backup_enabled | bool
    - backup_target == "kedge"
  tags: [backup]

- name: Deploy kedge environment file
  ansible.builtin.template:
    src: .kedge.env.j2
    dest: "{{ backup_kedge_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when:
    - backup_enabled | bool
    - backup_target == "kedge"
  tags: [backup]

# CW-W-254 — OpenBao-backed restic password, opt-in per host.
- name: Deploy kedge OpenBao fetch script
  ansible.builtin.template:
    src: kedge-openbao-fetch.py.j2
    dest: "{{ backup_kedge_openbao_fetch_script }}"
    owner: root
    group: root
    mode: "0700"
  when:
    - backup_enabled | bool
    - backup_target == "kedge"
    - backup_kedge_use_openbao | default(false) | bool
  tags: [backup]

- name: Ensure OpenBao secret_id directory exists (root-only)
  ansible.builtin.file:
    path: "{{ backup_kedge_openbao_secret_id_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - backup_enabled | bool
    - backup_target == "kedge"
    - backup_kedge_use_openbao | default(false) | bool
  tags: [backup]

# Cron is deployed as a single /etc/cron.d/kedge-<stack_name> file holding
# both the backup and prune entries — visible to ls /etc/cron.d/, debuggable
# without crontab -l, atomically versionable. See ADR / role README for the
# rationale (chosen over the Ansible cron module / root crontab).
- name: Remove legacy root-crontab entries (drayve-backup, drayve-kedge-*)
  ansible.builtin.cron:
    name: "{{ item }}"
    state: absent
    user: root
  loop:
    - drayve-backup
    - drayve-kedge-backup
    - drayve-kedge-prune
  when:
    - backup_enabled | bool
    - backup_target == "kedge"
  tags: [backup]

- name: Deploy kedge cron file
  ansible.builtin.template:
    src: kedge-cron.j2
    dest: "/etc/cron.d/kedge-{{ stack_name }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - backup_enabled | bool
    - backup_target == "kedge"
  tags: [backup]
