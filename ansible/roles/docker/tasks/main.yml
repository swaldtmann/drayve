---
- name: Check if Docker is installed
  ansible.builtin.command:
    cmd: docker --version
  register: docker_check
  changed_when: false
  failed_when: false
  tags: [docker]

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: docker_check.rc != 0
  tags: [docker]

- name: Add Docker GPG key
  ansible.builtin.shell:
    cmd: |
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
    creates: /etc/apt/keyrings/docker.asc
  when: docker_check.rc != 0
  tags: [docker]

- name: Add Docker apt repository
  ansible.builtin.shell:
    cmd: |
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" \
        > /etc/apt/sources.list.d/docker.list
    creates: /etc/apt/sources.list.d/docker.list
  when: docker_check.rc != 0
  tags: [docker]

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
      - docker-buildx-plugin
    state: present
    update_cache: true
  when: docker_check.rc != 0
  tags: [docker]

- name: Configure Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  register: docker_daemon_config
  tags: [docker]

- name: Restart Docker if daemon config changed
  ansible.builtin.service:
    name: docker
    state: restarted
  when: docker_daemon_config.changed
  tags: [docker]

- name: Ensure Docker is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  tags: [docker]

- name: Ensure drayve user is in docker group
  ansible.builtin.user:
    name: "{{ drayve_user }}"
    groups: docker
    append: true
  tags: [docker]

# === DOCKER-USER firewall baseline (default DROP) ===
# Re-applied whenever docker restarts (PartOf=docker.service).
- name: Install iptables
  ansible.builtin.apt:
    name: iptables
    state: present
    cache_valid_time: 3600
  when: docker_firewall_enabled | bool
  tags: [docker, firewall]

- name: Install DOCKER-USER firewall script
  ansible.builtin.template:
    src: docker-user-fw.sh.j2
    dest: /usr/local/sbin/drayve-docker-user-fw
    owner: root
    group: root
    mode: "0750"
  register: docker_firewall_script
  when: docker_firewall_enabled | bool
  tags: [docker, firewall]

- name: Install DOCKER-USER firewall unit
  ansible.builtin.template:
    src: drayve-docker-user-fw.service.j2
    dest: /etc/systemd/system/drayve-docker-user-fw.service
    owner: root
    group: root
    mode: "0644"
  register: docker_firewall_unit
  when: docker_firewall_enabled | bool
  tags: [docker, firewall]

- name: Enable DOCKER-USER firewall unit
  ansible.builtin.systemd:
    name: drayve-docker-user-fw
    enabled: true
    state: "{{ 'restarted' if (docker_firewall_script.changed or docker_firewall_unit.changed) else 'started' }}"
    daemon_reload: "{{ docker_firewall_unit.changed }}"
  when: docker_firewall_enabled | bool
  tags: [docker, firewall]
