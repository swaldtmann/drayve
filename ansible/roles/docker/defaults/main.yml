---
docker_users:
  - "{{ drayve_user }}"
docker_registry_mirrors: []  # e.g. ["http://192.0.2.10:5000"]
docker_daemon_extra: {}  # host-specific /etc/docker/daemon.json overrides, e.g. data-root, runtimes

# DOCKER-USER firewall baseline (default DROP). Docker publishes container
# ports around UFW (nat/FORWARD), so `ufw default deny` does not protect
# published ports. The baseline rebuilds the DOCKER-USER chain: replies and
# container-originated traffic RETURN, inbound traffic to published ports is
# RETURNed only for the ports below, everything else is DROPped.
# Default ports = the ports the operator already opens in UFW, so a stack that
# is reachable today stays reachable. A port published by a compose override
# but missing from ufw_allowed_ports is blocked from the outside after the
# upgrade — add it to ufw_allowed_ports (or docker_firewall_allowed_ports).
# Set docker_firewall_enabled: false to keep the old behaviour.
docker_firewall_enabled: true
docker_firewall_allowed_ports: "{{ ufw_allowed_ports | default([{'port': '80', 'proto': 'tcp'}, {'port': '443', 'proto': 'tcp'}]) }}"
