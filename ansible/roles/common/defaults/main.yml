---
common_packages:
  - curl
  - jq
  - rsync
  - git
  - ufw
  - python3-pip
  - acl

swap_size_mb: 2048
swap_file: /swapfile

# Public SSH key for the drayve_user authorized_keys.
# By default tries ~/.ssh/id_ed25519.pub of the Ansible controller; if the
# key is missing (e.g. in CI without a key), the authorized_key task is skipped.
# Override via stack.yaml or -e drayve_ssh_authorized_key=...
drayve_ssh_authorized_key: "{{ lookup('file', '~/.ssh/id_ed25519.pub', errors='ignore') | default('', true) }}"

# The docker role's daemon.json.j2 fixes log-driver=journald, which by
# default ALSO gets duplicated into /var/log/syslog via journald's own
# ForwardToSyslog (systemd default is enabled when unset). Every
# container-log line then exists twice on disk in two undocumented-scope
# retentions. journald already has its own retention
# (journald_max_retention_sec below); syslog's copy is pure duplication with
# no independent consumer.
# Override to true if a host genuinely needs syslog-forwarded journal
# entries (e.g. an external rsyslog-based log shipper).
journald_forward_to_syslog: false

# Hard upper bound for journal entries on disk (journald.conf MaxRetentionSec).
# Docker's log-driver=journald means container logs live here, so this is the
# container-log retention too. Accepts systemd time spans (e.g. 14day, 2week).
journald_max_retention_sec: 14day

# Time-based rotation of the active journal file (journald.conf MaxFileSec,
# systemd default: 1 month). MaxRetentionSec only deletes whole archived files,
# so without a short rotation interval a low-volume host keeps entries well
# past the retention limit inside one long-lived file.
journald_max_file_sec: 1day
