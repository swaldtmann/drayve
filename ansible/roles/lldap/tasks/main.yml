---
# Config phase — runs BEFORE deploy (compose up).
# Creates data directory. User provisioning happens in post-deploy.yml.

# AFKI-W-080 SEC-1 (S317b): Fail fast if lldap_jwt_secret is empty.
# Empty secret causes LLDAP to fall back to a deterministic default key,
# which means every install with an empty secret shares the same effective
# signing key — cross-installation token forgery becomes possible.
# Run: scripts/secrets-generate.sh on the deploy host or set the value in
# deploy/<host>/secrets.yml manually (>= 32 chars random).
- name: Assert lldap_jwt_secret is set
  ansible.builtin.assert:
    that:
      - lldap_jwt_secret is defined
      - lldap_jwt_secret | length >= 32
    fail_msg: >-
      lldap_jwt_secret is empty or too short. Generate via
      `scripts/secrets-generate.sh` or set host_secrets.lldap_jwt_secret
      in deploy/{{ inventory_hostname }}/secrets.yml (min. 32 chars).
      Empty/short JWT secrets let LLDAP fall back to a deterministic key
      that is identical across installations.
  tags: [lldap, secrets]

- name: Create lldap data directory
  ansible.builtin.file:
    path: "{{ lldap_data_dir }}"
    state: directory
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  tags: [lldap]
