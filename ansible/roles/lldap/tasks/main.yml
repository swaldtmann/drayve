---
# Config phase — runs BEFORE deploy (compose up).
# Creates data directory. User provisioning happens in post-deploy.yml.

- name: Create lldap data directory
  ansible.builtin.file:
    path: "{{ lldap_data_dir }}"
    state: directory
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  tags: [lldap]
