---
# lldap is up: wait until healthy, then verify the admin password BEFORE any
# task uses it. A wrong password fails here with a readable message instead of
# inside a later no_log task. Included by the deploy role before the full
# `docker compose up` (so the Authelia bind user can be created first) and
# imported by post-deploy.yml (so `--tags lldap` runs verify as well).
# Tag `deploy` is required: include_role tags do not reach inner tasks.

- name: Wait for lldap to be healthy
  ansible.builtin.command:
    cmd: docker inspect lldap --format {% raw %}"{{.State.Health.Status}}"{% endraw %}
  register: lldap_health
  until: lldap_health.stdout == "healthy"
  retries: 15
  delay: 2
  changed_when: false
  tags: [deploy, lldap, lldap-users]

- name: Verify LLDAP admin password matches secrets.yml
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      LLDAP_IP=$(docker inspect lldap --format '{% raw %}{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}{% endraw %}')
      RESP=$(curl -sw '%{http_code}' -o /dev/null http://$LLDAP_IP:{{ lldap_http_port }}/auth/simple/login \
        -H "Content-Type: application/json" \
        -d '{"username":"admin","password":"{{ lldap_admin_password }}"}')
      if [ "$RESP" != "200" ]; then
        echo "LLDAP admin login failed (HTTP $RESP). The admin password on the server does not match secrets.yml." >&2
        echo "Fix: update secrets.yml to match, or reset the password via 'docker exec lldap /app/lldap_set_password'." >&2
        exit 1
      fi
    executable: /bin/bash
  changed_when: false
  no_log: true
  tags: [deploy, lldap, lldap-users]
