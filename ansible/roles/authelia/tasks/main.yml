---
# Config phase — runs BEFORE deploy (compose up).
# Creates dirs, keys, and config files so Docker can mount them.

- name: Create Authelia directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  loop:
    - "{{ authelia_config_dir }}"
    - "{{ authelia_data_dir }}"
  tags: [authelia]

- name: Generate OIDC JWKS RSA key (if not exists)
  ansible.builtin.command:
    cmd: openssl genrsa -out "{{ authelia_config_dir }}/jwks.pem" 4096
    creates: "{{ authelia_config_dir }}/jwks.pem"
  tags: [authelia]

- name: Set JWKS key permissions
  ansible.builtin.file:
    path: "{{ authelia_config_dir }}/jwks.pem"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0600"
  tags: [authelia]

- name: Read JWKS key for config embedding
  ansible.builtin.slurp:
    src: "{{ authelia_config_dir }}/jwks.pem"
  register: jwks_pem_raw
  no_log: true
  tags: [authelia]

- name: Set JWKS key variable
  ansible.builtin.set_fact:
    authelia_jwks_pem: "{{ jwks_pem_raw.content | b64decode }}"
  no_log: true
  tags: [authelia]

# W-144: per-client OIDC secret + hash. One PBKDF2-SHA512 hash file per client
# under <data>/.oidc_<id>_hash. Plain secret comes from host_secrets via the
# convention `authelia_oidc_<id>_secret`. The legacy variable
# `authelia_oidc_grafana_secret` keeps working through that convention.

- name: Fail when any OIDC client is missing a plain secret
  ansible.builtin.assert:
    that:
      - authelia_oidc_client_secrets[item.id] | length > 0
    fail_msg: >-
      No plain OIDC secret found for client '{{ item.id }}'.
      Set host_secrets.authelia_oidc_{{ item.id }}_secret in
      deploy/{{ inventory_hostname }}/secrets.yml.
  loop: "{{ authelia_oidc_clients }}"
  loop_control:
    label: "{{ item.id }}"
  no_log: true
  tags: [authelia]

- name: Check for existing OIDC client secret hash file (per client)
  ansible.builtin.stat:
    path: "{{ authelia_data_dir }}/.oidc_{{ item.id }}_hash"
  register: _oidc_hash_files
  loop: "{{ authelia_oidc_clients }}"
  loop_control:
    label: "{{ item.id }}"
  tags: [authelia]

- name: Generate Argon2id hash for OIDC client secret (per client)
  # HUB-W-003: argon2id via Authelia-CLI, kein Python-pwhash mehr.
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      docker run --rm "{{ authelia_image }}" \
        authelia crypto hash generate argon2 \
        --variant argon2id \
        --no-confirm \
        --password "$(cat)" 2>/dev/null \
        | awk '/^Digest:/ { print $2 }'
    executable: /bin/bash
    stdin: "{{ authelia_oidc_client_secrets[item.item.id] }}"
  register: _oidc_hash_generated
  changed_when: false
  no_log: true
  when: not item.stat.exists
  loop: "{{ _oidc_hash_files.results }}"
  loop_control:
    label: "{{ item.item.id }}"
  tags: [authelia]

- name: Store OIDC client secret hash (per client)
  ansible.builtin.copy:
    content: "{{ item.stdout }}"
    dest: "{{ authelia_data_dir }}/.oidc_{{ item.item.item.id }}_hash"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0600"
  when: item.skipped is not defined
  loop: "{{ _oidc_hash_generated.results }}"
  loop_control:
    label: "{{ item.item.item.id | default('skipped') }}"
  no_log: true
  tags: [authelia]

- name: Read OIDC client secret hashes (per client)
  ansible.builtin.slurp:
    src: "{{ authelia_data_dir }}/.oidc_{{ item.id }}_hash"
  register: _oidc_hash_raws
  loop: "{{ authelia_oidc_clients }}"
  loop_control:
    label: "{{ item.id }}"
  no_log: true
  tags: [authelia]

- name: Build OIDC client secret hash map
  ansible.builtin.set_fact:
    authelia_oidc_client_secret_hashes: >-
      {{ authelia_oidc_client_secret_hashes | default({}) | combine({
           item.item.id: item.content | b64decode
         })
      }}
  loop: "{{ _oidc_hash_raws.results }}"
  loop_control:
    label: "{{ item.item.id }}"
  no_log: true
  tags: [authelia]

# Backward-compat alias for any service still referencing the old per-client name.
- name: Expose legacy authelia_oidc_grafana_secret_hash alias
  ansible.builtin.set_fact:
    authelia_oidc_grafana_secret_hash: "{{ authelia_oidc_client_secret_hashes['grafana'] }}"
  when: "'grafana' in authelia_oidc_client_secret_hashes"
  no_log: true
  tags: [authelia]

# File user backend (auth.lldap=false): stack.yaml (auth.users) + secrets.yml
# (authelia_user_password_hashes) are the only source of truth. Fail before
# anything is written if a user or its hash is missing.
- name: Check file-backend users and password hashes
  ansible.builtin.import_tasks: ../../../tasks/authelia_file_users_check.yml
  tags: [authelia]

- name: Resolve file-backend password hashes
  ansible.builtin.set_fact:
    authelia_user_password_hashes: "{{ (host_secrets | default({})).get('authelia_user_password_hashes', {}) }}"
  when: not (auth_lldap | default(false) | bool)
  no_log: true
  tags: [authelia]

- name: Deploy Authelia users database (file backend)
  ansible.builtin.template:
    src: "{{ ops_deploy_root }}/config/authelia/users_database.yml.j2"
    dest: "{{ authelia_config_dir }}/users_database.yml"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0600"
  when: not (auth_lldap | default(false) | bool)
  no_log: true
  tags: [authelia]

- name: Deploy Authelia configuration
  ansible.builtin.template:
    src: "{{ ops_deploy_root }}/config/authelia/configuration.yml.j2"
    dest: "{{ authelia_config_dir }}/configuration.yml"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0600"
  register: authelia_config
  tags: [authelia]

# AFKI-W-240 (Befund 1): authelia_jwt_secret/authelia_session_secret/
# authelia_storage_encryption_key/authelia_ldap_password/authelia_oidc_*
# rendered into configuration.yml above come exclusively from roles/secrets
# (tag [secrets]). A `--tags authelia` run (no `secrets` tag) leaves them
# empty, "Deploy Authelia configuration" then reports changed:true (content
# differs from the correctly-rendered version on disk), and the removal
# below would delete an already-deployed, working Authelia DB (2FA
# registrations, sessions, tokens) — same bug class as AFKI-W-233/238/239.
# The DB is no longer deleted on a config change (see key-change handling
# below), but a config rendered with empty secrets would still be deployed
# broken, so the guard stays and fails the run before that happens.
# Re-stat secrets.yml + the DB file here (cheap, independent of whether
# roles/secrets ran this pass) and fail early, same pattern as
# AFKI-W-239's monitoring-role guard. Only blocks when the DB already
# exists — a genuinely fresh install with nothing to lose is unaffected.
- name: Check for host secrets file (cross-tag guard, AFKI-W-240 authelia)
  ansible.builtin.stat:
    path: "{{ ops_secrets_root }}/deploy/{{ inventory_hostname }}/secrets.yml"
  register: _authelia_secrets_file_check
  delegate_to: localhost
  become: false
  when: authelia_config.changed | default(false)
  tags: [authelia]

- name: Check for existing Authelia DB (cross-tag guard, AFKI-W-240 authelia)
  ansible.builtin.stat:
    path: "{{ authelia_data_dir }}/db.sqlite3"
  register: _authelia_db_precheck
  when: authelia_config.changed | default(false)
  tags: [authelia]

- name: Guard — fail instead of deleting Authelia DB when secrets weren't loaded (AFKI-W-240)
  ansible.builtin.assert:
    that:
      - >-
        not (
          _authelia_secrets_file_check.stat.exists and
          drayve_secrets_facts_loaded is not defined and
          (authelia_config.changed | default(false)) and
          (_authelia_db_precheck.stat.exists | default(false))
        )
    fail_msg: |
      Secrets nicht geladen — Authelia-Deploy ohne `secrets`-Tag gefahren?
      deploy/{{ inventory_hostname }}/secrets.yml existiert, aber die Rolle
      secrets (Task "Set secret variables", tag [secrets]) hat in diesem
      Lauf nicht gesetzt. Die authelia_*-Secrets (JWT/Session/Storage-
      Encryption/LDAP/OIDC) rendern deshalb leer, "Deploy Authelia
      configuration" gilt dadurch als geaendert und wuerde eine kaputte
      Konfiguration (leere Secrets) neben der bestehenden Authelia-DB
      (db.sqlite3 — 2FA-Registrierungen, Sessions, Tokens) ausrollen.

      Fix: `--tags secrets,auth` (die Authelia-Rolle haengt per include_role
      im Block mit Tag `auth`; `authelia` allein fuehrt keinen ihrer Tasks
      aus), oder den vollen Lauf ohne Tag-Scoping fahren.
  when: authelia_config.changed | default(false)
  tags: [authelia]

# A configuration.yml change must NOT touch the Authelia DB (TOTP/2FA
# registrations, sessions, tokens live in db.sqlite3). The DB is only unusable
# when storage_encryption_key changed, because Authelia encrypts columns with
# it. Detect that via a sha256 marker file next to the DB (never the key
# itself). An empty rendered key (secrets not loaded) is never treated as a
# key change and never touches the marker.
- name: Stat Authelia DB
  ansible.builtin.stat:
    path: "{{ authelia_data_dir }}/db.sqlite3"
  register: _authelia_db_stat
  tags: [authelia]

- name: Stat storage encryption key marker
  ansible.builtin.stat:
    path: "{{ authelia_data_dir }}/.storage_encryption_key.sha256"
  register: _authelia_key_marker_stat
  tags: [authelia]

- name: Read storage encryption key marker
  ansible.builtin.slurp:
    src: "{{ authelia_data_dir }}/.storage_encryption_key.sha256"
  register: _authelia_key_marker
  when: _authelia_key_marker_stat.stat.exists
  no_log: true
  tags: [authelia]

- name: Detect storage encryption key change
  ansible.builtin.set_fact:
    _authelia_key_changed: >-
      {{
        (authelia_storage_encryption_key | default('') | length > 0)
        and _authelia_db_stat.stat.exists
        and _authelia_key_marker_stat.stat.exists
        and ((_authelia_key_marker.content | default('') | b64decode | trim)
             != (authelia_storage_encryption_key | hash('sha256')))
      }}
  no_log: true
  tags: [authelia]

- name: Abort — storage encryption key changed, DB cannot be reused
  ansible.builtin.fail:
    msg: |
      The Authelia storage_encryption_key differs from the one the existing
      database (db.sqlite3) was created with. Authelia cannot read that DB
      with the new key; continuing would break login.

      Two ways out:
        1. Restore the previous storage_encryption_key in the host secrets
           and deploy again (keeps 2FA registrations and sessions).
        2. Accept the loss of all TOTP/2FA registrations and sessions: set
           `authelia_reset_db_on_key_change: true` for this deploy. The DB is
           deleted and users must re-register their second factor.
  when:
    - _authelia_key_changed | bool
    - not (authelia_reset_db_on_key_change | bool)
  tags: [authelia]

- name: Warn — resetting Authelia DB after key change (authelia_reset_db_on_key_change)
  ansible.builtin.debug:
    msg: >-
      WARNING: storage_encryption_key changed and authelia_reset_db_on_key_change
      is set — deleting db.sqlite3. All TOTP/2FA registrations and sessions are lost.
  when:
    - _authelia_key_changed | bool
    - authelia_reset_db_on_key_change | bool
  tags: [authelia]

- name: Remove Authelia DB after storage encryption key change
  ansible.builtin.file:
    path: "{{ authelia_data_dir }}/db.sqlite3"
    state: absent
  when:
    - _authelia_key_changed | bool
    - authelia_reset_db_on_key_change | bool
  tags: [authelia]

# Written when there is no DB yet, on upgrade from versions without a marker
# (DB kept), and after a deliberate reset. Never with an empty key.
- name: Record storage encryption key checksum
  ansible.builtin.copy:
    content: "{{ authelia_storage_encryption_key | hash('sha256') }}\n"
    dest: "{{ authelia_data_dir }}/.storage_encryption_key.sha256"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0600"
  when:
    - authelia_storage_encryption_key | default('') | length > 0
    - (not _authelia_db_stat.stat.exists) or (not _authelia_key_marker_stat.stat.exists) or (_authelia_key_changed | bool)
  no_log: true
  tags: [authelia]
