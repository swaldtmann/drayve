---
# Config phase — runs BEFORE deploy (compose up).
# Creates dirs, keys, and config files so Docker can mount them.

- name: Create Authelia directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  loop:
    - "{{ authelia_config_dir }}"
    - "{{ authelia_data_dir }}"
  tags: [authelia]

- name: Generate OIDC JWKS RSA key (if not exists)
  ansible.builtin.command:
    cmd: openssl genrsa -out "{{ authelia_config_dir }}/jwks.pem" 4096
    creates: "{{ authelia_config_dir }}/jwks.pem"
  tags: [authelia]

- name: Set JWKS key permissions
  ansible.builtin.file:
    path: "{{ authelia_config_dir }}/jwks.pem"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0600"
  tags: [authelia]

- name: Read JWKS key for config embedding
  ansible.builtin.slurp:
    src: "{{ authelia_config_dir }}/jwks.pem"
  register: jwks_pem_raw
  no_log: true
  tags: [authelia]

- name: Set JWKS key variable
  ansible.builtin.set_fact:
    authelia_jwks_pem: "{{ jwks_pem_raw.content | b64decode }}"
  no_log: true
  tags: [authelia]

- name: Check for existing OIDC client secret hash
  ansible.builtin.stat:
    path: "{{ authelia_data_dir }}/.oidc_grafana_hash"
  register: _oidc_hash_file
  tags: [authelia]

- name: Generate PBKDF2 hash for OIDC client secret
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      python3 << 'PYEOF'
      import hashlib, os, base64, sys
      salt = os.urandom(16)
      dk = hashlib.pbkdf2_hmac('sha512', sys.stdin.read().strip().encode(), salt, 310000, dklen=32)
      salt_b64 = base64.b64encode(salt).decode().rstrip('=')
      dk_b64 = base64.b64encode(dk).decode().rstrip('=')
      print(f'$pbkdf2-sha512$310000${salt_b64}${dk_b64}')
      PYEOF
    executable: /bin/bash
    stdin: "{{ authelia_oidc_grafana_secret }}"
  register: _oidc_hash_generated
  changed_when: false
  no_log: true
  when: not _oidc_hash_file.stat.exists
  tags: [authelia]

- name: Store OIDC client secret hash
  ansible.builtin.copy:
    content: "{{ _oidc_hash_generated.stdout }}"
    dest: "{{ authelia_data_dir }}/.oidc_grafana_hash"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0600"
  when: not _oidc_hash_file.stat.exists
  no_log: true
  tags: [authelia]

- name: Read OIDC client secret hash
  ansible.builtin.slurp:
    src: "{{ authelia_data_dir }}/.oidc_grafana_hash"
  register: _oidc_hash_raw
  no_log: true
  tags: [authelia]

- name: Set OIDC client secret hash variable
  ansible.builtin.set_fact:
    authelia_oidc_grafana_secret_hash: "{{ _oidc_hash_raw.content | b64decode }}"
  no_log: true
  tags: [authelia]

- name: Deploy Authelia configuration
  ansible.builtin.template:
    src: "{{ ops_deploy_root }}/config/authelia/configuration.yml.j2"
    dest: "{{ authelia_config_dir }}/configuration.yml"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0600"
  register: authelia_config
  tags: [authelia]

- name: Remove stale Authelia DB on config change
  ansible.builtin.file:
    path: "{{ authelia_data_dir }}/db.sqlite3"
    state: absent
  when: authelia_config.changed | default(false)
  tags: [authelia]
