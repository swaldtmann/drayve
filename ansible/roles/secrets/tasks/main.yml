---
# Secrets role — load per-host secrets from deploy/<name>/secrets.yml.
# In quickstart mode the file is plaintext; in sops mode it's encrypted.
#
# SOPS caveat: re-encrypting produces a new MAC/nonce even with identical
# plaintext, so the file always changes → triggers template cascades.
# Only encrypt once at creation; avoid repeated `sops -e` on existing files.

- name: Check for host secrets file
  ansible.builtin.stat:
    path: "{{ ops_secrets_root }}/deploy/{{ inventory_hostname }}/secrets.yml"
  register: secrets_file
  delegate_to: localhost
  become: false
  tags: [secrets]

- name: Decrypt SOPS secrets (if encrypted)
  ansible.builtin.command:
    cmd: "sops -d {{ ops_secrets_root }}/deploy/{{ inventory_hostname }}/secrets.yml"
  environment:
    SOPS_AGE_KEY_FILE: "{{ ops_secrets_root }}/deploy/.age-key.txt"
  register: sops_decrypt
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  check_mode: false  # Read-only sops decrypt — must run in --check too,
                     # otherwise downstream assertions see empty secrets.
  no_log: true
  when: secrets_file.stat.exists
  tags: [secrets]

- name: Load host secrets (SOPS-decrypted)
  ansible.builtin.set_fact:
    host_secrets: "{{ sops_decrypt.stdout | from_yaml }}"
  when: secrets_file.stat.exists and sops_decrypt.rc == 0
  no_log: true
  tags: [secrets]

- name: Load host secrets (plaintext/quickstart)
  ansible.builtin.include_vars:
    file: "{{ ops_secrets_root }}/deploy/{{ inventory_hostname }}/secrets.yml"
    name: host_secrets
  delegate_to: localhost
  become: false
  when: secrets_file.stat.exists and (sops_decrypt.rc != 0 or sops_decrypt is skipped)
  tags: [secrets]

- name: Warn if no secrets file found
  ansible.builtin.debug:
    msg: >-
      No secrets file found for {{ inventory_hostname }}.
      Run: make secrets-template NAME={{ inventory_hostname }}
  when: not secrets_file.stat.exists
  tags: [secrets]

# Map secrets to role variables
- name: Set secret variables
  ansible.builtin.set_fact:
    auth_basic_password: "{{ host_secrets.auth_basic_password | default('changeme') }}"
    grafana_admin_password: "{{ host_secrets.grafana_admin_pass | default('changeme') }}"
    crowdsec_bouncer_key: "{{ host_secrets.crowdsec_bouncer_key | default('') }}"
    crowdsec_lapi_key: "{{ host_secrets.crowdsec_lapi_key | default('') }}"
    lldap_jwt_secret: "{{ host_secrets.lldap_jwt_secret | default('') }}"
    lldap_admin_password: "{{ host_secrets.lldap_admin_password | default('') }}"
    authelia_jwt_secret: "{{ host_secrets.authelia_jwt_secret | default('') }}"
    authelia_session_secret: "{{ host_secrets.authelia_session_secret | default('') }}"
    authelia_storage_encryption_key: "{{ host_secrets.authelia_storage_encryption_key | default('') }}"
    authelia_ldap_password: "{{ host_secrets.authelia_ldap_password | default('') }}"
    authelia_oidc_hmac_secret: "{{ host_secrets.authelia_oidc_hmac_secret | default('') }}"
    authelia_oidc_grafana_secret: "{{ host_secrets.authelia_oidc_grafana_secret | default('') }}"
    authentik_secret_key: "{{ host_secrets.authentik_secret_key | default('') }}"
    authentik_pg_pass: "{{ host_secrets.authentik_pg_pass | default('') }}"
    authentik_bootstrap_password: "{{ host_secrets.authentik_bootstrap_password | default('') }}"
    authentik_bootstrap_token: "{{ host_secrets.authentik_bootstrap_token | default('') }}"
    authentik_oidc_grafana_secret: "{{ host_secrets.authentik_oidc_grafana_secret | default('') }}"
    backup_restic_password: "{{ host_secrets.backup_restic_password | default('') }}"
  when: secrets_file.stat.exists
  no_log: true
  tags: [secrets]
