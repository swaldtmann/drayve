---
# Auth provider: none | basic | authelia
# Roles query auth_provider, not specific implementations.
auth_provider: basic

# basic auth credentials (used when auth_provider=basic)
auth_basic_user: admin
# auth_basic_password must be set in secrets

# Authelia settings (used when auth_provider=authelia)
auth_lldap: false
authelia_image: authelia/authelia:4.39

# W-144: default OIDC client list when stack.yaml omits auth.oidc_clients.
# Keeps v0.1.x stacks (Grafana-only SSO) working without schema changes.
# Override in stack.yaml under auth.oidc_clients to add Forgejo, Vaultwarden, etc.
authelia_oidc_clients_default:
  - id: grafana
    name: Grafana
    authorization_policy: one_factor
    redirect_uris:
      - "https://grafana.{{ drayve_domain }}/login/generic_oauth"
    scopes:
      - openid
      - profile
      - email
      - groups
    consent_mode: implicit
