---
- name: Resolve stack.yaml values for traefik
  ansible.builtin.set_fact:
    acme_email: "{{ stack.acme_email | default(acme_email) | default('') }}"
    auth_provider: "{{ auth.provider | default(auth_provider) | default('basic') }}"
    crowdsec_enabled: "{{ security.crowdsec | default(crowdsec_enabled) | default(true) | bool }}"
  tags: [traefik]

- name: Create Traefik directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  loop:
    - "{{ traefik_config_dir }}"
    - "{{ traefik_dynamic_dir }}"
    - "{{ traefik_certs_dir }}"
  tags: [traefik]

# === Auth middleware (provider-aware) ===
- name: Deploy basic auth middleware
  ansible.builtin.copy:
    dest: "{{ traefik_dynamic_dir }}/auth-basic.yml"
    content: |
      http:
        middlewares:
          auth:
            basicAuth:
              usersFile: /etc/traefik/.htpasswd
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: auth_provider == "basic"
  tags: [traefik, auth]

- name: Deploy forwardAuth middleware (authelia)
  ansible.builtin.copy:
    dest: "{{ traefik_dynamic_dir }}/auth-authelia.yml"
    content: |
      http:
        middlewares:
          auth:
            forwardAuth:
              address: http://authelia:9091/api/authz/forward-auth
              trustForwardHeader: true
              authResponseHeaders:
                - Remote-User
                - Remote-Groups
                - Remote-Email
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: auth_provider == "authelia"
  tags: [traefik, auth]

- name: Deploy forwardAuth middleware (authentik)
  ansible.builtin.copy:
    dest: "{{ traefik_dynamic_dir }}/auth-authentik.yml"
    content: |
      http:
        middlewares:
          auth:
            forwardAuth:
              address: http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
              trustForwardHeader: true
              maxResponseBodySize: 1048576
              authResponseHeaders:
                - X-authentik-username
                - X-authentik-groups
                - X-authentik-email
                - X-authentik-name
                - X-authentik-uid
                - X-authentik-jwt
                - X-authentik-meta-jwks
                - X-authentik-meta-outpost
                - X-authentik-meta-provider
                - X-authentik-meta-app
                - X-authentik-meta-version
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: auth_provider == "authentik"
  tags: [traefik, auth]

- name: Deploy no-auth middleware (passthrough)
  ansible.builtin.copy:
    dest: "{{ traefik_dynamic_dir }}/auth-none.yml"
    content: |
      # No auth middleware — passthrough
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: auth_provider == "none"
  tags: [traefik, auth]

- name: Remove stale auth middleware files
  ansible.builtin.file:
    path: "{{ traefik_dynamic_dir }}/{{ item }}"
    state: absent
  loop:
    - auth-basic.yml
    - auth-authelia.yml
    - auth-authentik.yml
    - auth-none.yml
  when: >-
    (item == 'auth-basic.yml' and auth_provider != 'basic') or
    (item == 'auth-authelia.yml' and auth_provider != 'authelia') or
    (item == 'auth-authentik.yml' and auth_provider != 'authentik') or
    (item == 'auth-none.yml' and auth_provider != 'none')
  tags: [traefik, auth]

# === Security headers ===
- name: Deploy security headers middleware
  ansible.builtin.copy:
    dest: "{{ traefik_dynamic_dir }}/security-headers.yml"
    content: |
      http:
        middlewares:
          sec-headers:
            headers:
              browserXssFilter: true
              contentTypeNosniff: true
              frameDeny: true
              stsIncludeSubdomains: true
              stsPreload: true
              stsSeconds: 31536000
              customFrameOptionsValue: SAMEORIGIN
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  tags: [traefik]

# === CrowdSec middleware ===
- name: Deploy CrowdSec bouncer middleware (plugin)
  ansible.builtin.copy:
    dest: "{{ traefik_dynamic_dir }}/crowdsec.yml"
    content: |
      http:
        middlewares:
          crowdsec:
            plugin:
              bouncer:
                enabled: true
                crowdsecMode: stream
                crowdsecLapiKey: "{{ crowdsec_bouncer_key }}"
                crowdsecLapiHost: crowdsec:8080
                crowdsecLapiScheme: http
                updateIntervalSeconds: 15
                defaultDecisionSeconds: 60
                forwardedHeadersTrustedIPs:
                  - 172.16.0.0/12
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0600"
  when: crowdsec_enabled
  tags: [traefik, crowdsec]

- name: Remove CrowdSec middleware when disabled
  ansible.builtin.file:
    path: "{{ traefik_dynamic_dir }}/crowdsec.yml"
    state: absent
  when: not (crowdsec_enabled)
  tags: [traefik, crowdsec]

# === CrowdSec config ===
- name: Create CrowdSec config directory
  ansible.builtin.file:
    path: "{{ drayve_deploy_dir }}/crowdsec"
    state: directory
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  when: crowdsec_enabled
  tags: [traefik, crowdsec]

- name: Deploy CrowdSec acquis.yaml
  ansible.builtin.copy:
    dest: "{{ drayve_deploy_dir }}/crowdsec/acquis.yaml"
    content: |
      filenames:
        - /var/log/traefik/access.log
      labels:
        type: traefik
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: crowdsec_enabled
  tags: [traefik, crowdsec]

- name: Deploy CrowdSec IP whitelist
  ansible.builtin.copy:
    dest: "{{ drayve_deploy_dir }}/crowdsec/whitelist.yaml"
    content: "{{ lookup('template', 'crowdsec-whitelist.yaml.j2') }}"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: crowdsec_enabled and (security.crowdsec_whitelist | default([]) | length > 0)
  register: crowdsec_whitelist
  tags: [traefik, crowdsec]

- name: Remove CrowdSec whitelist when empty
  ansible.builtin.file:
    path: "{{ drayve_deploy_dir }}/crowdsec/whitelist.yaml"
    state: absent
  when: crowdsec_enabled and (security.crowdsec_whitelist | default([]) | length == 0)
  tags: [traefik, crowdsec]
