---
- name: Verify drayve_domain is set
  ansible.builtin.fail:
    msg: "drayve_domain is required. Set it in inventory or via -e domain=<domain>"
  when: drayve_domain is not defined or drayve_domain == ""
  tags: [deploy]

# Ensure monitoring_services is set even if monitoring role didn't run (e.g. tag-only deploy)
- name: Resolve monitoring profile for deploy
  ansible.builtin.set_fact:
    _deploy_mon_profile: "{{ monitoring.profile | default(monitoring_profile) | default('full') }}"
  when: monitoring_services is not defined
  tags: [deploy]

- name: Set monitoring_services from profile (monitoring role didn't run)
  ansible.builtin.set_fact:
    monitoring_services:
      grafana: "{{ _deploy_mon_profile == 'full' }}"
      prometheus: "{{ _deploy_mon_profile == 'full' }}"
      loki: "{{ _deploy_mon_profile == 'full' }}"
      promtail: "{{ _deploy_mon_profile in ['full', 'light'] }}"
      cadvisor: "{{ _deploy_mon_profile == 'full' }}"
      node_exporter: "{{ _deploy_mon_profile in ['full', 'light'] }}"
  when: monitoring_services is not defined
  tags: [deploy]

- name: Verify htpasswd exists (basic auth)
  ansible.builtin.stat:
    path: "{{ drayve_deploy_dir }}/.htpasswd"
  register: htpasswd_check
  when: auth_provider == "basic"
  tags: [deploy]

- name: Fail if htpasswd missing
  ansible.builtin.fail:
    msg: ".htpasswd not found at {{ drayve_deploy_dir }}/.htpasswd — run the auth role first"
  when:
    - auth_provider == "basic"
    - htpasswd_check.stat is defined
    - not htpasswd_check.stat.exists
  tags: [deploy]

- name: Read existing bouncer key from .env
  ansible.builtin.command:
    cmd: grep -oP '^CROWDSEC_BOUNCER_KEY=\K.+' {{ drayve_deploy_dir }}/.env
  register: existing_bouncer_key
  changed_when: false
  failed_when: false
  when: crowdsec_enabled | default(true)
  tags: [deploy]

- name: Preserve existing bouncer key (unless secrets provided a real one)
  ansible.builtin.set_fact:
    crowdsec_bouncer_key: "{{ existing_bouncer_key.stdout | trim }}"
  when:
    - crowdsec_enabled | default(true)
    - existing_bouncer_key.stdout | default('') | trim | length > 0
    - crowdsec_bouncer_key | default('') | trim in ['', 'changeme']
  tags: [deploy]

- name: Read existing LAPI key from .env
  ansible.builtin.command:
    cmd: grep -oP '^CROWDSEC_LAPI_KEY=\K.+' {{ drayve_deploy_dir }}/.env
  register: existing_lapi_key
  changed_when: false
  failed_when: false
  when: crowdsec_enabled | default(true)
  tags: [deploy]

- name: Preserve existing LAPI key (unless secrets provided a real one)
  ansible.builtin.set_fact:
    crowdsec_lapi_key: "{{ existing_lapi_key.stdout | trim }}"
  when:
    - crowdsec_enabled | default(true)
    - existing_lapi_key.stdout | default('') | trim | length > 0
    - crowdsec_lapi_key | default('') | trim in ['', 'changeme']
  tags: [deploy]

- name: Create landing page directory
  ansible.builtin.file:
    path: "{{ drayve_deploy_dir }}/landing"
    state: directory
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  tags: [deploy]

- name: Deploy landing page
  ansible.builtin.template:
    src: "{{ ops_repo_root }}/ansible/templates/landing.html.j2"
    dest: "{{ drayve_deploy_dir }}/landing/index.html"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  tags: [deploy]

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: "{{ ops_repo_root }}/ansible/templates/docker-compose.yml.j2"
    dest: "{{ drayve_deploy_dir }}/docker-compose.yml"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  tags: [deploy]

- name: Template .env
  ansible.builtin.template:
    src: "{{ ops_repo_root }}/ansible/templates/env.j2"
    dest: "{{ drayve_deploy_dir }}/.env"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0600"
  no_log: true
  tags: [deploy]

- name: Deploy Traefik static config
  ansible.builtin.template:
    src: "{{ ops_repo_root }}/config/traefik/traefik.yml.j2"
    dest: "{{ traefik_config_dir }}/traefik.yml"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  tags: [deploy, traefik]

- name: Docker compose pull
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ drayve_deploy_dir }}"
  become: true
  become_user: "{{ drayve_user }}"
  changed_when: "'Pull complete' in compose_pull.stdout or 'Downloaded' in compose_pull.stdout"
  register: compose_pull
  tags: [deploy]

- name: Docker compose up
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ drayve_deploy_dir }}"
  become: true
  become_user: "{{ drayve_user }}"
  changed_when: "'Started' in compose_up.stderr or 'Recreated' in compose_up.stderr"
  register: compose_up
  tags: [deploy]

- name: Wait for containers to stabilize
  ansible.builtin.pause:
    seconds: 10
  tags: [deploy]

- name: Verify containers are running
  ansible.builtin.command:
    cmd: docker compose ps --format json
    chdir: "{{ drayve_deploy_dir }}"
  become: true
  become_user: "{{ drayve_user }}"
  register: compose_ps
  tags: [deploy]

- name: Show running containers
  ansible.builtin.debug:
    msg: "{{ compose_ps.stdout }}"
  tags: [deploy]

# === CrowdSec bouncer registration ===
- name: Check if CrowdSec bouncer is registered
  ansible.builtin.command:
    cmd: docker exec crowdsec cscli bouncers list -o raw
  register: bouncer_list
  changed_when: false
  failed_when: false
  when: crowdsec_enabled | default(true)
  tags: [deploy, crowdsec]

- name: Register CrowdSec bouncer with secrets key
  ansible.builtin.command:
    cmd: >-
      docker exec crowdsec cscli bouncers add traefik-bouncer
      --key "{{ crowdsec_bouncer_key }}"
  when:
    - crowdsec_enabled | default(true)
    - bouncer_list.rc == 0
    - "'traefik-bouncer' not in bouncer_list.stdout"
    - crowdsec_bouncer_key | default('') | length > 0
  no_log: true
  tags: [deploy, crowdsec]

- name: Register CrowdSec LAPI bouncer for Grafana
  ansible.builtin.command:
    cmd: >-
      docker exec crowdsec cscli bouncers add grafana-lapi
      --key "{{ crowdsec_lapi_key }}"
  when:
    - crowdsec_enabled | default(true)
    - bouncer_list.rc == 0
    - "'grafana-lapi' not in bouncer_list.stdout"
    - crowdsec_lapi_key | default('') | length > 0
  no_log: true
  tags: [deploy, crowdsec]
