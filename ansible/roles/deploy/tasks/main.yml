---
- name: Verify drayve_domain is set
  ansible.builtin.fail:
    msg: "drayve_domain is required. Set it in inventory or via -e domain=<domain>"
  when: drayve_domain is not defined or drayve_domain == ""
  tags: [deploy]

# Ensure monitoring_services is set even if monitoring role didn't run (e.g. tag-only deploy)
- name: Resolve monitoring profile for deploy
  ansible.builtin.set_fact:
    _deploy_mon_profile: "{{ monitoring.profile | default(monitoring_profile) | default('full') }}"
  when: monitoring_services is not defined
  tags: [deploy]

- name: Set monitoring_services from profile (monitoring role didn't run)
  ansible.builtin.set_fact:
    monitoring_services:
      grafana: "{{ _deploy_mon_profile == 'full' }}"
      prometheus: "{{ _deploy_mon_profile == 'full' }}"
      loki: "{{ _deploy_mon_profile == 'full' }}"
      promtail: "{{ _deploy_mon_profile in ['full', 'light'] }}"
      cadvisor: "{{ _deploy_mon_profile == 'full' }}"
      node_exporter: "{{ _deploy_mon_profile in ['full', 'light'] }}"
  when: monitoring_services is not defined
  tags: [deploy]

# Resolve nested stack.yaml values to flat vars
- name: Resolve auth_provider from stack.yaml
  ansible.builtin.set_fact:
    auth_provider: "{{ auth.provider | default(auth_provider) | default('basic') }}"
  tags: [deploy]

- name: Resolve crowdsec_enabled from stack.yaml
  ansible.builtin.set_fact:
    crowdsec_enabled: "{{ security.crowdsec | default(crowdsec_enabled) | default(true) | bool }}"
  tags: [deploy]

- name: Resolve backup_enabled from stack.yaml
  ansible.builtin.set_fact:
    backup_enabled: "{{ backup.enabled | default(backup_enabled) | default(false) | bool }}"
    backup_target: "{{ backup.target | default(backup_target) | default('local') }}"
    backup_schedule: "{{ backup.schedule | default(backup_schedule) | default('0 3 * * *') }}"
  tags: [deploy]

- name: Resolve landing_enabled from stack.yaml
  ansible.builtin.set_fact:
    landing_enabled: "{{ services.landing.enabled | default(landing_enabled) | default(true) | bool }}"
  tags: [deploy]

- name: Resolve landing_domain from stack.yaml
  ansible.builtin.set_fact:
    landing_domain: "{{ (services.landing.domain | default('')) or drayve_domain }}"
  tags: [deploy]

- name: Resolve acme_email from stack.yaml
  ansible.builtin.set_fact:
    acme_email: "{{ stack.acme_email | default(acme_email) | default('') }}"
  tags: [deploy]

# CW-Ticket DRAYVE-W-011: stack.acme_challenge steuerte bislang gar keinen
# Ansible-Var (kein Resolve-Task) UND selbst waere der Wert wirkungslos
# gewesen, weil jeder Router-Label in docker-compose.yml.j2 fest auf den
# httpChallenge-Resolver "letsencrypt" zeigte statt auf eine Variable.
# acme_dns_provider/-env_vars/-propagation_delay wurden aus demselben Grund
# nie aus stack.yaml gelesen — die Ansible-Var-Defaults aus
# roles/traefik/defaults/main.yml griffen immer, egal was in stack.yaml stand.
- name: Resolve acme_challenge from stack.yaml
  ansible.builtin.set_fact:
    acme_challenge: "{{ stack.acme_challenge | default('http') }}"
  tags: [deploy]

- name: Resolve acme_dns_provider from stack.yaml
  ansible.builtin.set_fact:
    acme_dns_provider: "{{ stack.acme_dns_provider | default(acme_dns_provider) | default('hetzner') }}"
  tags: [deploy]

- name: Resolve acme_dns_env_vars from stack.yaml
  ansible.builtin.set_fact:
    acme_dns_env_vars: "{{ stack.acme_dns_env_vars | default(acme_dns_env_vars) | default(['HETZNER_API_TOKEN']) }}"
  tags: [deploy]

- name: Resolve acme_dns_propagation_delay from stack.yaml
  ansible.builtin.set_fact:
    acme_dns_propagation_delay: "{{ stack.acme_dns_propagation_delay | default(acme_dns_propagation_delay) | default(30) }}"
  tags: [deploy]

- name: Derive traefik_certresolver from acme_challenge
  ansible.builtin.set_fact:
    traefik_certresolver: "{{ 'letsencrypt-dns' if acme_challenge == 'dns' else 'letsencrypt' }}"
  tags: [deploy]

- name: Resolve apps from stack.yaml
  ansible.builtin.set_fact:
    apps: "{{ apps | default([]) }}"
  tags: [deploy]

- name: Validate apps[].category is set on every app
  ansible.builtin.assert:
    that:
      - apps | rejectattr('category', 'defined') | list | length == 0
    fail_msg: |
      stack.yaml: every entry under `apps:` must declare a `category` field.
      Missing on: {{ apps | rejectattr('category', 'defined') | map(attribute='name') | list }}
      Add `category: <group-name>` (e.g. "Apps", "Monitoring") to each
      app — the landing page groups apps by category at render time.
    success_msg: "apps[].category present on all {{ apps | length }} app(s)"
  when: apps | length > 0
  tags: [deploy]

- name: Resolve auth_lldap from stack.yaml
  ansible.builtin.set_fact:
    auth_lldap: "{{ auth.lldap | default(auth_lldap) | default(false) | bool }}"
    lldap_base_dn: "{{ auth.lldap_base_dn | default(lldap_base_dn) | default('DC=drayve,DC=local') }}"
    lldap_users: "{{ auth.lldap_users | default(lldap_users) | default([]) }}"
    lldap_admin_email: "{{ lldap_admin_email | default('admin@' ~ drayve_domain) }}"
    lldap_verbose: "{{ lldap_verbose | default(false) | bool }}"
  when: auth_provider == 'authelia'
  tags: [deploy]

- name: Verify htpasswd exists (basic auth)
  ansible.builtin.stat:
    path: "{{ drayve_deploy_dir }}/.htpasswd"
  register: htpasswd_check
  when: auth_provider == "basic"
  tags: [deploy]

- name: Fail if htpasswd missing
  ansible.builtin.fail:
    msg: ".htpasswd not found at {{ drayve_deploy_dir }}/.htpasswd — run the auth role first"
  when:
    - auth_provider == "basic"
    - htpasswd_check.stat is defined
    - not htpasswd_check.stat.exists
  tags: [deploy]

- name: Read existing bouncer key from .env
  ansible.builtin.command:
    cmd: grep -oP '^CROWDSEC_BOUNCER_KEY=\K.+' {{ drayve_deploy_dir }}/.env
  register: existing_bouncer_key
  changed_when: false
  failed_when: false
  when: crowdsec_enabled
  tags: [deploy]

- name: Preserve existing bouncer key (unless secrets provided a real one)
  ansible.builtin.set_fact:
    crowdsec_bouncer_key: "{{ existing_bouncer_key.stdout | trim }}"
  when:
    - crowdsec_enabled
    - existing_bouncer_key.stdout | default('') | trim | length > 0
    - crowdsec_bouncer_key | default('') | trim in ['', 'changeme']
  tags: [deploy]

- name: Read existing LAPI key from .env
  ansible.builtin.command:
    cmd: grep -oP '^CROWDSEC_LAPI_KEY=\K.+' {{ drayve_deploy_dir }}/.env
  register: existing_lapi_key
  changed_when: false
  failed_when: false
  when: crowdsec_enabled
  tags: [deploy]

- name: Preserve existing LAPI key (unless secrets provided a real one)
  ansible.builtin.set_fact:
    crowdsec_lapi_key: "{{ existing_lapi_key.stdout | trim }}"
  when:
    - crowdsec_enabled
    - existing_lapi_key.stdout | default('') | trim | length > 0
    - crowdsec_lapi_key | default('') | trim in ['', 'changeme']
  tags: [deploy]

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: "{{ ops_deploy_root }}/ansible/templates/docker-compose.yml.j2"
    dest: "{{ drayve_deploy_dir }}/docker-compose.yml"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  tags: [deploy]

- name: Check for compose override
  ansible.builtin.stat:
    path: "{{ ops_secrets_root }}/deploy/{{ inventory_hostname }}/compose.override.yml"
  register: compose_override
  delegate_to: localhost
  become: false
  tags: [deploy]

- name: Deploy compose override
  ansible.builtin.copy:
    src: "{{ ops_secrets_root }}/deploy/{{ inventory_hostname }}/compose.override.yml"
    dest: "{{ drayve_deploy_dir }}/docker-compose.override.yml"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: compose_override.stat.exists
  tags: [deploy]

- name: Remove compose override if not present locally
  ansible.builtin.file:
    path: "{{ drayve_deploy_dir }}/docker-compose.override.yml"
    state: absent
  when: not compose_override.stat.exists
  tags: [deploy]

# === Multinet label fix (W-112) ===
# Drayve's main compose project name is "drayve" → default network "drayve_default".
# Services in compose.override.yml that join more than one network and have
# traefik routing labels need an explicit traefik.docker.network label so
# Traefik does not pick a random backend IP. Inject it automatically.
- name: Ensure tools directory
  ansible.builtin.file:
    path: "{{ drayve_deploy_dir }}/.tools"
    state: directory
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  when: compose_override.stat.exists
  tags: [deploy]

- name: Deploy multinet label fixer
  ansible.builtin.copy:
    src: "{{ ops_deploy_root }}/scripts/multinet-label-fix.py"
    dest: "{{ drayve_deploy_dir }}/.tools/multinet-label-fix.py"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  when: compose_override.stat.exists
  tags: [deploy]

- name: Apply multinet label fix to compose override
  ansible.builtin.command:
    cmd: >-
      python3 {{ drayve_deploy_dir }}/.tools/multinet-label-fix.py
      --primary {{ multinet_primary_network | default('drayve_default') }}
      --write
      {{ drayve_deploy_dir }}/docker-compose.override.yml
  register: multinet_fix
  changed_when: multinet_fix.stderr is search('injecting')
  when: compose_override.stat.exists
  tags: [deploy]

# === Extra files — out-of-band per-service config (e.g. nginx.conf, .htpasswd) ===
# Declared in stack.yaml `extra_files:`. Copied from deploy/<host>/<src> on the
# controller to <deploy_dir>/<dest> on the target BEFORE compose up, so that
# bind-mounts in compose.override.yml resolve. A declared src missing locally
# fails the deploy here, not later as a container crash.
- name: Resolve extra_files from stack.yaml
  ansible.builtin.set_fact:
    extra_files: "{{ extra_files | default([]) }}"
  tags: [deploy]

- name: Check extra_files sources exist on controller
  ansible.builtin.stat:
    path: "{{ ops_secrets_root }}/deploy/{{ inventory_hostname }}/{{ item.src }}"
  loop: "{{ extra_files }}"
  loop_control:
    label: "{{ item.src }}"
  delegate_to: localhost
  become: false
  register: extra_files_check
  when: extra_files | length > 0
  tags: [deploy]

- name: Fail early if any extra_files source is missing
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: >-
      extra_files: declared source
      deploy/{{ inventory_hostname }}/{{ item.item.src }} not found on the
      controller. Create it or remove the entry from stack.yaml `extra_files:`.
    quiet: true
  loop: "{{ extra_files_check.results | default([]) }}"
  loop_control:
    label: "{{ item.item.src }}"
  when: extra_files | length > 0
  tags: [deploy]

- name: Ensure extra_files target directories exist
  ansible.builtin.file:
    path: "{{ (drayve_deploy_dir ~ '/' ~ (item.dest | default(item.src))) | dirname }}"
    state: directory
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  loop: "{{ extra_files }}"
  loop_control:
    label: "{{ item.dest | default(item.src) }}"
  when: extra_files | length > 0
  tags: [deploy]

- name: Copy extra_files to target host
  ansible.builtin.copy:
    src: "{{ ops_secrets_root }}/deploy/{{ inventory_hostname }}/{{ item.src }}"
    dest: "{{ drayve_deploy_dir }}/{{ item.dest | default(item.src) }}"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ extra_files }}"
  loop_control:
    label: "{{ item.dest | default(item.src) }}"
  when: extra_files | length > 0
  tags: [deploy]

# AFKI-W-233: cross-tag guard. "Set secret variables" (roles/secrets, tag
# [secrets]) sets drayve_secrets_facts_loaded once host_secrets is mapped.
# A tag-scoped run without the `secrets` tag (e.g. --tags monitoring,deploy)
# skips that task silently, and env.j2 below would then template every
# secret with Jinja default('') — .env gets overwritten empty, lldap/
# Authelia crash on the next `docker compose up` (oops-0092, prod-genua).
# Re-stat secrets.yml here (cheap, independent of whether the secrets role
# ran this pass) and fail before the write.
- name: Check for host secrets file (cross-tag guard, AFKI-W-233)
  ansible.builtin.stat:
    path: "{{ ops_secrets_root }}/deploy/{{ inventory_hostname }}/secrets.yml"
  register: _deploy_secrets_file_check
  delegate_to: localhost
  become: false
  tags: [deploy]

- name: Guard — fail if secrets.yml exists but its facts were never loaded (AFKI-W-233)
  ansible.builtin.assert:
    that:
      - not (_deploy_secrets_file_check.stat.exists and drayve_secrets_facts_loaded is not defined)
    fail_msg: |
      Secrets nicht geladen — Deploy ohne `secrets`-Tag gefahren?
      deploy/{{ inventory_hostname }}/secrets.yml existiert, aber die Rolle
      secrets (Task "Set secret variables", tag [secrets]) hat in diesem
      Lauf nicht gesetzt. `.env` würde jetzt mit leeren Secret-Werten
      überschrieben (Jinja default('')) — lldap/Authelia crashen beim
      nächsten `docker compose up` (oops-0092).

      Fix: `--tags secrets,deploy` statt `--tags deploy` allein, oder den
      vollen Lauf ohne Tag-Scoping fahren.
  tags: [deploy]

- name: Template .env
  ansible.builtin.template:
    src: "{{ ops_deploy_root }}/ansible/templates/env.j2"
    dest: "{{ drayve_deploy_dir }}/.env"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0600"
  no_log: true
  tags: [deploy]

- name: Check for env.override
  ansible.builtin.stat:
    path: "{{ ops_secrets_root }}/deploy/{{ inventory_hostname }}/env.override"
  register: env_override
  delegate_to: localhost
  become: false
  tags: [deploy]

# env.override may be plaintext (quickstart mode) or sops-encrypted dotenv
# (sops mode). Try sops first; fall back to a plain file read if sops can't
# decrypt (which is the case for unencrypted files — sops exits non-zero).
- name: Try sops-decrypt env.override
  ansible.builtin.command:
    cmd: "sops -d --input-type dotenv --output-type dotenv {{ ops_secrets_root }}/deploy/{{ inventory_hostname }}/env.override"
  environment:
    SOPS_AGE_KEY_FILE: "{{ ops_secrets_root }}/deploy/.age-key.txt"
  register: env_override_sops
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  no_log: true
  when: env_override.stat.exists
  tags: [deploy]

- name: Resolve env.override content
  ansible.builtin.set_fact:
    env_override_content: >-
      {{ env_override_sops.stdout
         if (env_override_sops is defined
             and env_override_sops.rc is defined
             and env_override_sops.rc == 0)
         else lookup('file', ops_secrets_root + '/deploy/' + inventory_hostname + '/env.override') }}
  no_log: true
  when: env_override.stat.exists
  tags: [deploy]

- name: Append env.override to .env
  ansible.builtin.blockinfile:
    path: "{{ drayve_deploy_dir }}/.env"
    marker: "# {mark} USER APP SECRETS (from env.override)"
    block: "{{ env_override_content }}"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0600"
  no_log: true
  when: env_override.stat.exists
  tags: [deploy]

# === Label Scanner — scan compose files for drayve.* labels ===
- name: Deploy label-scanner script
  ansible.builtin.copy:
    src: "{{ ops_deploy_root }}/scripts/label-scanner.py"
    dest: "{{ drayve_deploy_dir }}/label-scanner.py"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  tags: [deploy]

- name: Run label-scanner
  ansible.builtin.command:
    cmd: python3 {{ drayve_deploy_dir }}/label-scanner.py {{ drayve_deploy_dir }}
  register: label_scanner_output
  changed_when: false
  check_mode: false  # Read-only scan; must run in --check too so the
                     # downstream from_json parse has real input.
  tags: [deploy]

- name: Parse label-scanner results
  ansible.builtin.set_fact:
    scanned_labels: "{{ label_scanner_output.stdout | from_json }}"
  tags: [deploy]

# === Landing Page (rendered from scanned labels + frame services) ===
# Skipped on single-app hosts (services.landing.enabled: false in stack.yaml).
- name: Create landing page directory
  ansible.builtin.file:
    path: "{{ drayve_deploy_dir }}/landing"
    state: directory
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  when: landing_enabled
  tags: [deploy]

- name: Deploy landing page
  ansible.builtin.template:
    src: "{{ ops_deploy_root }}/ansible/templates/landing.html.j2"
    dest: "{{ drayve_deploy_dir }}/landing/index.html"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: landing_enabled
  tags: [deploy]

- name: Remove landing page directory when disabled
  ansible.builtin.file:
    path: "{{ drayve_deploy_dir }}/landing"
    state: absent
  when: not landing_enabled
  tags: [deploy]

- name: Deploy Traefik static config
  ansible.builtin.template:
    src: "{{ ops_deploy_root }}/config/traefik/traefik.yml.j2"
    dest: "{{ traefik_config_dir }}/traefik.yml"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  register: traefik_config
  tags: [deploy, traefik]

- name: Check for Traefik dynamic config changes
  ansible.builtin.find:
    paths: "{{ traefik_dynamic_dir }}"
    patterns: "*.yml"
  register: traefik_dynamic_files
  tags: [deploy, traefik]

- name: Check Prometheus config
  ansible.builtin.stat:
    path: "{{ drayve_deploy_dir }}/monitoring/prometheus/prometheus.yml"
    checksum_algorithm: sha256
  register: prom_config_before
  tags: [deploy]

- name: Docker compose pull
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ drayve_deploy_dir }}"
  become: true
  become_user: "{{ drayve_user }}"
  changed_when: >-
    'Pull complete' in compose_pull.stdout + compose_pull.stderr or
    'Downloaded' in compose_pull.stdout + compose_pull.stderr
  register: compose_pull
  tags: [deploy]

- name: Docker compose up
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ drayve_deploy_dir }}"
  become: true
  become_user: "{{ drayve_user }}"
  # 'Started' allein zaehlt nicht: Compose druckt das auch wenn ein Container
  # ohne jede Config-Aenderung neu gestartet wird (depends_on:service_healthy
  # wird bei jedem 'up' neu ausgewertet, kann bei Health-Poll-Race einen bereits
  # korrekten Container einfach neu starten). Nur 'Created'/'Recreated' zeigen
  # echte Drift (CW-W-181 — molecule (authelia) Idempotence-Flake, Run #193).
  changed_when: "'Created' in compose_up.stderr or 'Recreated' in compose_up.stderr"
  register: compose_up
  tags: [deploy]

- name: Force-recreate Traefik on config change
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate traefik
    chdir: "{{ drayve_deploy_dir }}"
  become: true
  become_user: "{{ drayve_user }}"
  when: traefik_config.changed | default(false)
  tags: [deploy, traefik]

- name: Force-recreate Authelia on config change
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate authelia
    chdir: "{{ drayve_deploy_dir }}"
  become: true
  become_user: "{{ drayve_user }}"
  when:
    - auth_provider == 'authelia'
    - authelia_config.changed | default(false)
  tags: [deploy, authelia]

- name: Reload Prometheus config via API
  ansible.builtin.uri:
    url: "http://localhost:9090/-/reload"
    method: POST
    status_code: [200, 204]
  when:
    - monitoring_services.prometheus | default(false) | bool
    - prom_config_before.stat.checksum | default('') != ''
  failed_when: false
  tags: [deploy]

- name: Wait for containers to stabilize
  ansible.builtin.pause:
    seconds: 10
  tags: [deploy]

- name: Verify containers are running
  ansible.builtin.command:
    cmd: docker compose ps --format json
    chdir: "{{ drayve_deploy_dir }}"
  become: true
  become_user: "{{ drayve_user }}"
  register: compose_ps
  changed_when: false
  tags: [deploy]

- name: Show running containers
  ansible.builtin.debug:
    msg: "{{ compose_ps.stdout }}"
  tags: [deploy]

- name: Force-recreate CrowdSec on whitelist change
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate crowdsec
    chdir: "{{ drayve_deploy_dir }}"
  become: true
  become_user: "{{ drayve_user }}"
  when: crowdsec_whitelist.changed | default(false)
  tags: [deploy, crowdsec]

# === CrowdSec bouncer registration ===
# AFKI-W-239 (Befund 2): crowdsec_bouncer_key/crowdsec_lapi_key come exclusively
# from roles/secrets (tag [secrets]). These registration tasks are tagged
# [deploy, crowdsec] — Ansible runs a task if ANY of its tags is requested, so
# `--tags crowdsec` alone (no `deploy`, no `secrets`) also reaches them. With
# an empty key, the registration tasks' `when` (key | length > 0) silently
# skips — no crash, but the bouncer stays unregistered (security gap, not
# just cosmetics). Guard is tagged identically ([deploy, crowdsec]) so it
# fires under every tag combination that reaches the registration tasks —
# the AFKI-W-233 guard above is tagged [deploy] only and would NOT fire for a
# bare `--tags crowdsec` run.
- name: Check for host secrets file (cross-tag guard, AFKI-W-239 crowdsec)
  ansible.builtin.stat:
    path: "{{ ops_secrets_root }}/deploy/{{ inventory_hostname }}/secrets.yml"
  register: _deploy_crowdsec_secrets_file_check
  delegate_to: localhost
  become: false
  when: crowdsec_enabled
  tags: [deploy, crowdsec]

- name: Guard — fail if secrets.yml exists but its facts were never loaded before CrowdSec bouncer registration (AFKI-W-239)
  ansible.builtin.assert:
    that:
      - not (_deploy_crowdsec_secrets_file_check.stat.exists and drayve_secrets_facts_loaded is not defined)
    fail_msg: |
      Secrets nicht geladen — CrowdSec-Bouncer-Registrierung ohne `secrets`-Tag
      gefahren? deploy/{{ inventory_hostname }}/secrets.yml existiert, aber
      die Rolle secrets (Task "Set secret variables", tag [secrets]) hat in
      diesem Lauf nicht gesetzt. crowdsec_bouncer_key/crowdsec_lapi_key sind
      deshalb leer — die Registrierung wuerde jetzt still uebersprungen und
      der Bouncer bliebe unbemerkt unregistriert.

      Fix: `--tags secrets,deploy,crowdsec` statt `--tags deploy,crowdsec`
      (oder `--tags crowdsec`) allein, oder den vollen Lauf ohne Tag-Scoping
      fahren.
  when: crowdsec_enabled
  tags: [deploy, crowdsec]

- name: Check if CrowdSec bouncer is registered
  ansible.builtin.command:
    cmd: docker exec crowdsec cscli bouncers list -o raw
  register: bouncer_list
  changed_when: false
  failed_when: false
  when: crowdsec_enabled
  tags: [deploy, crowdsec]

- name: Register CrowdSec bouncer with secrets key
  ansible.builtin.command:
    cmd: >-
      docker exec crowdsec cscli bouncers add traefik-bouncer
      --key "{{ crowdsec_bouncer_key }}"
  when:
    - crowdsec_enabled
    - bouncer_list.rc == 0
    - "'traefik-bouncer' not in bouncer_list.stdout"
    - crowdsec_bouncer_key | default('') | length > 0
  no_log: true
  tags: [deploy, crowdsec]

- name: Register CrowdSec LAPI bouncer for Grafana
  ansible.builtin.command:
    cmd: >-
      docker exec crowdsec cscli bouncers add grafana-lapi
      --key "{{ crowdsec_lapi_key }}"
  when:
    - crowdsec_enabled
    - bouncer_list.rc == 0
    - "'grafana-lapi' not in bouncer_list.stdout"
    - crowdsec_lapi_key | default('') | length > 0
  no_log: true
  tags: [deploy, crowdsec]

# === Post-deploy: LLDAP user provisioning (containers are running) ===
- name: Post-deploy authelia (LLDAP bind user)
  ansible.builtin.include_role:
    name: authelia
    tasks_from: post-deploy
  when: auth_provider == 'authelia'
  tags: [deploy, authelia]

- name: Post-deploy lldap (user provisioning)
  ansible.builtin.include_role:
    name: lldap
    tasks_from: post-deploy
  when: auth_provider == 'authelia' and (auth_lldap | default(false) | bool)
  tags: [deploy, lldap]

- name: Post-deploy authentik (bootstrap)
  ansible.builtin.include_role:
    name: authentik
    tasks_from: post-deploy
  when: auth_provider == 'authentik'
  tags: [deploy, authentik]

# === Auth-Sync: create Authentik providers/apps from labels ===
- name: Save label-scanner output for auth-sync
  ansible.builtin.copy:
    content: "{{ scanned_labels | to_nice_json }}"
    dest: "{{ drayve_deploy_dir }}/scanned-labels.json"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  when: auth_provider == 'authentik'
  tags: [deploy, authentik]

- name: Deploy auth-sync script
  ansible.builtin.template:
    src: "{{ ops_deploy_root }}/scripts/auth-sync.py.j2"
    dest: "{{ drayve_deploy_dir }}/auth-sync.py"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0755"
  when: auth_provider == 'authentik'
  tags: [deploy, authentik]

- name: Run auth-sync
  ansible.builtin.command:
    cmd: python3 {{ drayve_deploy_dir }}/auth-sync.py {{ drayve_deploy_dir }}/scanned-labels.json
  register: auth_sync_output
  changed_when: "'Created' in auth_sync_output.stderr"
  when:
    - auth_provider == 'authentik'
    - (scanned_labels.auth_sync | default([])) | length > 0
  tags: [deploy, authentik]

- name: Show auth-sync output
  ansible.builtin.debug:
    msg: "{{ auth_sync_output.stderr_lines | default([]) }}"
  when:
    - auth_provider == 'authentik'
    - auth_sync_output is defined
    - auth_sync_output.stderr_lines | default([]) | length > 0
  tags: [deploy, authentik]

# === Dashboard Drop-in: copy custom dashboards from labels ===
- name: Copy custom Grafana dashboards from labels
  ansible.builtin.copy:
    src: "{{ ops_deploy_root }}/dashboards/{{ item.dashboard }}.json"
    dest: "{{ drayve_deploy_dir }}/monitoring/grafana/provisioning/dashboards/json/{{ item.dashboard }}.json"
    owner: "{{ drayve_user }}"
    group: "{{ drayve_group }}"
    mode: "0644"
  loop: "{{ scanned_labels.dashboards | default([]) }}"
  loop_control:
    label: "{{ item.dashboard }}"
  when:
    - monitoring_services.grafana | default(false) | bool
    - scanned_labels.dashboards | default([]) | length > 0
  register: custom_dashboards
  tags: [deploy, dashboards]

- name: Check custom dashboards source files exist
  ansible.builtin.stat:
    path: "{{ ops_deploy_root }}/dashboards/{{ item.dashboard }}.json"
  loop: "{{ scanned_labels.dashboards | default([]) }}"
  loop_control:
    label: "{{ item.dashboard }}"
  delegate_to: localhost
  become: false
  register: dashboard_check
  when:
    - monitoring_services.grafana | default(false) | bool
    - scanned_labels.dashboards | default([]) | length > 0
  tags: [deploy, dashboards]

- name: Warn about missing custom dashboards
  ansible.builtin.debug:
    msg: "WARNING: Dashboard file dashboards/{{ item.item.dashboard }}.json not found — skipping"
  loop: "{{ dashboard_check.results | default([]) }}"
  loop_control:
    label: "{{ item.item.dashboard | default('unknown') }}"
  when:
    - item.stat is defined
    - not item.stat.exists
  tags: [deploy, dashboards]
