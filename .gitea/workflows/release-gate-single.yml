name: Release Gate — Single (manual)

# Manual single-scenario run via workflow_dispatch. One job, no matrix
# (Forgejo's matrix-context is not available in job-level `if`, and dynamic
# matrices are evaluated statically — see CodebergF runner #525).
#
# Runs on the self-hosted runner VM (one job per cycle, Incus test VM nested in
# it, see docs/testing.md). Tests only: no cloud credentials.
#
# Pick one of: basic | auth-none | authelia | authelia-file | authentik
#              | authentik-ldap | light | sops | backup | backup-kedge | integration
#              | upgrade
#
# `upgrade` converges a previous release first (tag from the optional input
# `upgrade_from`; default: the newest release tag), then this branch on top.
#
# For a full gate (all 12 scenarios) push a v* tag — see release-gate-matrix.yml.

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "molecule scenario to run"
        required: true
        default: "basic"
        type: choice
        options:
          - basic
          - auth-none
          - authelia
          - authelia-file
          - authentik
          - authentik-ldap
          - light
          - sops
          - backup
          - backup-kedge
          - integration
          - upgrade
      upgrade_from:
        description: "release tag to upgrade from (scenario upgrade only; empty = newest tag)"
        required: false
        default: ""
        type: string

jobs:
  molecule:
    runs-on: self-hosted
    env:
      WORKDIR: /tmp/ci-drayve-${{ github.run_id }}-${{ inputs.scenario }}
      # Images pre-loaded in the runner VM's inner Incus cache: u24c = stock
      # images:ubuntu/24.04/cloud, u24c-base = stock plus the packages of the roles
      # `common` and `docker`. Default is the base image; `basic` switches to the
      # stock image in the run step (real installation stays covered).
      DRAYVE_MOLECULE_INCUS_IMAGE: u24c-base
      # Docker Hub pull-through cache in the runner VM (inner Incus bridge address);
      # the test VMs pull through it. Empty/unset outside CI = no mirror.
      DRAYVE_MOLECULE_REGISTRY_MIRROR: http://10.99.0.1:5000

    steps:
      - name: Checkout
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          rm -rf $WORKDIR
          git -c http.extraheader="Authorization: token ${CI_TOKEN}" clone --depth 1 -b ${GITHUB_REF_NAME} ${{ github.server_url }}/${{ github.repository }}.git $WORKDIR

      - name: Fetch the baseline tag of the upgrade scenario
        # The checkout is shallow and has no tags. `upgrade` converges a previous
        # release first: the input `upgrade_from`, or the newest release tag.
        if: inputs.scenario == 'upgrade'
        env:
          CI_TOKEN: ${{ github.token }}
          UPGRADE_FROM: ${{ inputs.upgrade_from }}
        run: |
          cd $WORKDIR
          auth="Authorization: token ${CI_TOKEN}"
          tag="$UPGRADE_FROM"
          if [ -z "$tag" ]; then
            tag=$(git -c http.extraheader="$auth" ls-remote --tags --refs origin 'v*' \
              | sed 's#.*refs/tags/##' | scripts/upgrade-from-tag.sh)
          fi
          git -c http.extraheader="$auth" fetch --depth 1 origin "refs/tags/${tag}:refs/tags/${tag}"
          echo "DRAYVE_UPGRADE_FROM=${tag}" >> "$GITHUB_ENV"
          echo "upgrade baseline: ${tag}"

      - name: Install dependencies
        run: |
          cd $WORKDIR
          python3 -m pip install -q --break-system-packages -r requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run full molecule test_sequence
        # Full test_sequence (create+converge+idempotence+verify+destroy). No
        # safety-destroy step: the inner Incus VMs die with the runner VM,
        # which is reset to its clean snapshot after the job.
        run: |
          cd $WORKDIR
          if [ "${{ inputs.scenario }}" = basic ]; then export DRAYVE_MOLECULE_INCUS_IMAGE=u24c; fi
          molecule test -s ${{ inputs.scenario }}
