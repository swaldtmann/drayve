name: Release Gate — Single (manual)

# Manual single-scenario run via workflow_dispatch. One job, no matrix
# (Forgejo's matrix-context is not available in job-level `if`, and dynamic
# matrices are evaluated statically — see CodebergF runner #525).
#
# Pick one of: basic | auth-none | authelia | authentik | authentik-ldap
#              | light | sops | backup | backup-kedge | integration
#
# For a full gate (all 9 scenarios) push a v* tag — see release-gate-matrix.yml.

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "molecule scenario to run"
        required: true
        default: "basic"
        type: choice
        options:
          - basic
          - auth-none
          - authelia
          - authentik
          - authentik-ldap
          - light
          - sops
          - backup
          - backup-kedge
          - integration

jobs:
  molecule:
    runs-on: self-hosted
    container:
      image: catthehacker/ubuntu:act-24.04
    env:
      WORKDIR: /tmp/ci-drayve-${{ github.run_id }}-${{ inputs.scenario }}

    steps:
      - name: Checkout
        run: |
          rm -rf $WORKDIR
          git clone --depth 1 -b ${GITHUB_REF_NAME} https://codeberg.org/${GITHUB_REPOSITORY}.git $WORKDIR

      - name: Install dependencies
        run: |
          cd $WORKDIR
          python3 -m pip install -q --break-system-packages -r requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run full molecule test_sequence
        # self-hosted Runner hat keinen 10-min-Cap → full test_sequence
        # (create+converge+idempotence+verify+destroy) statt converge+destroy.
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          cd $WORKDIR
          molecule test -s ${{ inputs.scenario }}

      - name: Safety-destroy test host (interrupt/failure net)
        # molecule test zerstoert am Sequenz-Ende selbst — aber bei hartem
        # Abbruch (Cancel/OOM/Netz) zwischen create und destroy leakt der
        # hcloud-Host. Idempotent: no-op wenn schon weg. Muss VOR dem
        # Workspace-rm laufen (braucht $WORKDIR + molecule-State).
        if: always()
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          cd $WORKDIR && molecule destroy -s ${{ inputs.scenario }} || true

      - name: Cleanup workspace
        if: always()
        run: rm -rf $WORKDIR
