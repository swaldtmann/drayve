name: Release Gate — Single (manual)

# Manual single-scenario run via workflow_dispatch. One job, no matrix
# (Forgejo's matrix-context is not available in job-level `if`, and dynamic
# matrices are evaluated statically — see CodebergF runner #525).
#
# Pick one of: basic | auth-none | authelia | authentik | authentik-ldap
#              | light | sops | backup | integration
#
# For a full gate (all 9 scenarios) push a v* tag — see release-gate-matrix.yml.

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "molecule scenario to run"
        required: true
        default: "basic"
        type: choice
        options:
          - basic
          - auth-none
          - authelia
          - authentik
          - authentik-ldap
          - light
          - sops
          - backup
          - integration

jobs:
  molecule:
    runs-on: codeberg-medium
    env:
      WORKDIR: /home/forgejo-runner/ci-drayve-${{ github.run_id }}-${{ inputs.scenario }}

    steps:
      - name: Checkout
        run: |
          rm -rf $WORKDIR
          git clone --depth 1 -b ${GITHUB_REF_NAME} https://codeberg.org/${GITHUB_REPOSITORY}.git $WORKDIR

      - name: Install dependencies
        run: |
          cd $WORKDIR
          python3 -m pip install -q --break-system-packages -r requirements.txt

      - name: Run molecule scenario (converge + destroy)
        # Skip idempotence/verify/side_effect — codeberg-medium has a 10-min
        # cap, full molecule test_sequence runs ~12-13 min. Locally use
        # `molecule test -s <scenario>` for the full sequence.
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          cd $WORKDIR
          set -e
          trap 'molecule destroy -s ${{ inputs.scenario }} || true' EXIT
          molecule converge -s ${{ inputs.scenario }}

      - name: Cleanup workspace
        if: always()
        run: rm -rf $WORKDIR
