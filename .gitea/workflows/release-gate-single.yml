name: Release Gate — Single (manual)

# Manual single-scenario run via workflow_dispatch. One job, no matrix
# (Forgejo's matrix-context is not available in job-level `if`, and dynamic
# matrices are evaluated statically — see CodebergF runner #525).
#
# Runs on the self-hosted runner VM (one job per cycle, Incus test VM nested in
# it, see docs/testing.md). Tests only: no cloud credentials.
#
# Pick one of: basic | auth-none | authelia | authentik | authentik-ldap
#              | light | sops | backup | backup-kedge | integration
#
# For a full gate (all 10 scenarios) push a v* tag — see release-gate-matrix.yml.

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "molecule scenario to run"
        required: true
        default: "basic"
        type: choice
        options:
          - basic
          - auth-none
          - authelia
          - authentik
          - authentik-ldap
          - light
          - sops
          - backup
          - backup-kedge
          - integration

jobs:
  molecule:
    runs-on: self-hosted
    env:
      WORKDIR: /tmp/ci-drayve-${{ github.run_id }}-${{ inputs.scenario }}
      # Image pre-loaded in the runner VM's inner Incus cache (alias u24c).
      DRAYVE_MOLECULE_INCUS_IMAGE: u24c

    steps:
      - name: Checkout
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          rm -rf $WORKDIR
          git -c http.extraheader="Authorization: token ${CI_TOKEN}" clone --depth 1 -b ${GITHUB_REF_NAME} ${{ github.server_url }}/${{ github.repository }}.git $WORKDIR

      - name: Install dependencies
        run: |
          cd $WORKDIR
          python3 -m pip install -q --break-system-packages -r requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run full molecule test_sequence
        # Full test_sequence (create+converge+idempotence+verify+destroy). No
        # safety-destroy step: the inner Incus VMs die with the runner VM,
        # which is reset to its clean snapshot after the job.
        run: |
          cd $WORKDIR
          molecule test -s ${{ inputs.scenario }}
