name: Test & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  WORKDIR: /tmp/ci-drayve-${{ github.run_id }}

jobs:
  test:
    runs-on: self-hosted
    container:
      image: catthehacker/ubuntu:act-24.04
    steps:
      - name: Checkout
        run: |
          rm -rf $WORKDIR
          git clone --depth 1 -b ${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}} https://codeberg.org/${GITHUB_REPOSITORY}.git $WORKDIR

      - name: Install dependencies
        run: |
          cd $WORKDIR
          python3 -m pip install -q --break-system-packages pyyaml ansible-lint pytest jinja2
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Ansible Lint
        run: cd $WORKDIR/ansible && ansible-lint playbooks/ roles/ 2>&1 | grep -v "^WARNING"

      - name: Ansible Syntax Check
        run: |
          cd $WORKDIR/ansible
          for pb in playbooks/*.yml; do
            ansible-playbook --syntax-check "$pb" -i /dev/null \
              -e drayve_name=ci-check -e domain=ci.local 2>&1 \
              | grep -v "^\[WARNING\]" || true
          done

      - name: ShellCheck
        run: |
          apt-get update -qq && apt-get install -y -qq shellcheck > /dev/null
          cd $WORKDIR
          shellcheck scripts/*.sh

      - name: Python Syntax (test files)
        run: |
          cd $WORKDIR
          for f in molecule/*/tests/*.py; do
            python3 -m py_compile "$f"
          done

      - name: Validate examples
        run: cd $WORKDIR && for f in examples/*.yaml; do python3 scripts/validate-stack.py "$f"; done

      - name: Pre-Inventur (var refs vs definitions)
        run: cd $WORKDIR && python3 scripts/check-vars.py

      - name: Pytest unit tests (template + role contracts)
        run: cd $WORKDIR && python3 -m pytest tests/python/ -v

      - name: Cleanup
        if: always()
        run: rm -rf $WORKDIR

  # AFKI-W-197 — Push-statt-Pull: roter main-Run schickt EINE Nachricht an
  # Stephans Messenger (#00_wooki). Gate: nur wenn `test` failt UND es ein
  # push auf main war (PRs + Tags schweigen) — sonst stirbt die Flaeche.
  # Runs #58-60 (16.05.-10.06.) waren rot und blieben einen Monat unbemerkt,
  # weil das CI-UI ein Holschuld-Surface ist.
  notify-failure:
    needs: test
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: self-hosted
    container:
      image: catthehacker/ubuntu:act-24.04
    env:
      NWORKDIR: /tmp/ci-drayve-notify-${{ github.run_id }}
    steps:
      - name: Checkout (nur fuer das Notify-Script)
        run: |
          rm -rf $NWORKDIR
          git clone --depth 1 -b ${GITHUB_REF_NAME} https://codeberg.org/${GITHUB_REPOSITORY}.git $NWORKDIR
      - name: Notify Slack (#00_wooki)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CI_REPO: ${{ github.repository }}
          CI_WORKFLOW: ${{ github.workflow }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          CI_REF: ${{ github.ref_name }}
          CI_SHA: ${{ github.sha }}
          CI_RUN_NUMBER: ${{ github.run_number }}
        run: bash $NWORKDIR/scripts/notify-ci-failure.sh
      - name: Cleanup
        if: always()
        run: rm -rf $NWORKDIR
