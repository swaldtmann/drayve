name: Test & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  WORKDIR: /tmp/ci-drayve-${{ github.run_id }}

jobs:
  test:
    # Runner label `self-hosted` = host mode inside the one-job runner VM (runs
    # as root; a `container:` key is ignored there). Tests only: no deploy, no
    # release, no cloud resources.
    runs-on: self-hosted
    steps:
      - name: Checkout
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          rm -rf $WORKDIR
          git -c http.extraheader="Authorization: token ${CI_TOKEN}" clone --depth 1 -b ${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}} ${{ github.server_url }}/${{ github.repository }}.git $WORKDIR

      - name: Install dependencies
        run: |
          cd $WORKDIR
          python3 -m pip install -q --break-system-packages pyyaml ansible-lint pytest jinja2
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Ansible Lint
        run: cd $WORKDIR/ansible && ansible-lint playbooks/ roles/ 2>&1 | grep -v "^WARNING"

      - name: Ansible Syntax Check
        run: |
          cd $WORKDIR/ansible
          for pb in playbooks/*.yml; do
            ansible-playbook --syntax-check "$pb" -i /dev/null \
              -e drayve_name=ci-check -e domain=ci.local 2>&1 \
              | grep -v "^\[WARNING\]" || true
          done

      - name: ShellCheck
        run: |
          apt-get update -qq && apt-get install -y -qq shellcheck > /dev/null
          cd $WORKDIR
          shellcheck scripts/*.sh

      - name: Python Syntax (test files)
        run: |
          cd $WORKDIR
          for f in molecule/*/tests/*.py; do
            python3 -m py_compile "$f"
          done

      - name: Validate examples
        run: cd $WORKDIR && for f in examples/*.yaml; do python3 scripts/validate-stack.py "$f"; done

      - name: Pre-Inventur (var refs vs definitions)
        run: cd $WORKDIR && python3 scripts/check-vars.py

      - name: Pytest unit tests (template + role contracts)
        run: cd $WORKDIR && python3 -m pytest tests/python/ -v

      # AFKI-W-197 — Push-statt-Pull: roter main-Run schickt EINE Nachricht an
      # Stephans Messenger (#00_wooki). Gate: nur wenn ein Schritt davor failt
      # UND es ein push auf main war (PRs + Tags schweigen) — sonst stirbt die
      # Flaeche. Runs #58-60 (16.05.-10.06.) waren rot und blieben einen Monat
      # unbemerkt, weil das CI-UI ein Holschuld-Surface ist.
      # Letzter Schritt im selben Job statt eigener Job: jeder Job kostet auf
      # dem Ein-Job-Runner einen kompletten Reset-Zyklus (~140 s).
      - name: Notify Slack (#00_wooki) on red main
        if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CI_REPO: ${{ github.repository }}
          CI_WORKFLOW: ${{ github.workflow }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          CI_REF: ${{ github.ref_name }}
          CI_SHA: ${{ github.sha }}
          CI_RUN_NUMBER: ${{ github.run_number }}
        run: bash $WORKDIR/scripts/notify-ci-failure.sh

      - name: Cleanup
        if: always()
        run: rm -rf $WORKDIR
