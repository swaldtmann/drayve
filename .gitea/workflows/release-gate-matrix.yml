name: Release Gate — Matrix (tag-push)

# Real-VM molecule scenarios on tag-push (v*). All 9 scenarios run.
# Cost: ~0.05 EUR × 9 + wall-clock ~10 min/scenario.
#
# For single-scenario manual runs use release-gate-single.yml (workflow_dispatch).
#
# Requires repository secret HCLOUD_TOKEN with project-write rights for the
# hcloud project that hosts the test boxes (greenfields).

on:
  push:
    tags:
      - "v*"

jobs:
  molecule:
    runs-on: codeberg-medium
    env:
      WORKDIR: /home/forgejo-runner/ci-drayve-${{ github.run_id }}-${{ matrix.scenario }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scenario:
          - basic
          - auth-none
          - authelia
          - authentik
          - authentik-ldap
          - light
          - sops
          - backup
          - backup-kedge
          - integration

    steps:
      - name: Checkout
        run: |
          rm -rf $WORKDIR
          git clone --depth 1 -b ${GITHUB_REF_NAME} https://codeberg.org/${GITHUB_REPOSITORY}.git $WORKDIR

      - name: Install dependencies
        run: |
          cd $WORKDIR
          python3 -m pip install -q --break-system-packages -r requirements.txt

      - name: Run molecule scenario (converge + destroy)
        # Skip idempotence/verify/side_effect — codeberg-medium has a 10-min
        # cap. Locally use `molecule test -s <scenario>` for full sequence.
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          cd $WORKDIR
          set -e
          trap 'molecule destroy -s ${{ matrix.scenario }} || true' EXIT
          molecule converge -s ${{ matrix.scenario }}

      - name: Cleanup workspace
        if: always()
        run: rm -rf $WORKDIR
