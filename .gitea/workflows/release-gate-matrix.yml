name: Release Gate — Matrix (tag-push)

# Real-VM molecule scenarios on tag-push (v*). All 10 scenarios run, on Incus
# test VMs nested inside the self-hosted runner VM (default molecule driver, see
# docs/testing.md). Tests only: no cloud credentials, no deploy, no release.
#
# The runner takes exactly ONE job per cycle and is reset afterwards (~140 s
# overhead per job), so scenarios are not one job each. They run one after the
# other inside a job; two jobs (5 + 5 scenarios) keep each job well below the
# runner's 2 h job timeout.
#
# For single-scenario manual runs use release-gate-single.yml (workflow_dispatch).

on:
  push:
    tags:
      - "v*"

jobs:
  molecule:
    runs-on: self-hosted
    env:
      WORKDIR: /tmp/ci-drayve-${{ github.run_id }}-${{ matrix.group }}
      # Image pre-loaded in the runner VM's inner Incus cache (alias u24c =
      # images:ubuntu/24.04/cloud); the VM is reset after every job.
      DRAYVE_MOLECULE_INCUS_IMAGE: u24c
      # Docker Hub pull-through cache in the runner VM (inner Incus bridge address);
      # the test VMs pull through it. Empty/unset outside CI = no mirror.
      DRAYVE_MOLECULE_REGISTRY_MIRROR: http://10.99.0.1:5000
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        group:
          - "basic auth-none authelia authentik authentik-ldap"
          - "light sops backup backup-kedge integration"

    steps:
      - name: Checkout
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          rm -rf $WORKDIR
          git -c http.extraheader="Authorization: token ${CI_TOKEN}" clone --depth 1 -b ${GITHUB_REF_NAME} ${{ github.server_url }}/${{ github.repository }}.git $WORKDIR

      - name: Install dependencies
        run: |
          cd $WORKDIR
          python3 -m pip install -q --break-system-packages -r requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run full molecule test_sequence per scenario
        # Full test_sequence (create+converge+idempotence+verify+destroy). A red
        # scenario does not stop the rest; the step fails at the end if any failed.
        # No safety-destroy step: the inner Incus VMs die with the runner VM,
        # which is reset to its clean snapshot after the job.
        run: |
          cd $WORKDIR
          failed=""
          for s in ${{ matrix.group }}; do
            echo "::group::molecule test -s $s"
            molecule test -s "$s" || failed="$failed $s"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "FAILED scenarios:$failed"
            exit 1
          fi
