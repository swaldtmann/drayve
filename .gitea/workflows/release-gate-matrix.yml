name: Release Gate — Matrix (tag-push)

# Real-VM molecule scenarios on tag-push (v*). All 10 scenarios run.
# Cost: ~0.05 EUR × 10 + wall-clock ~10 min/scenario.
#
# For single-scenario manual runs use release-gate-single.yml (workflow_dispatch).
#
# Requires repository secret HCLOUD_TOKEN with project-write rights for the
# hcloud project that hosts the test boxes (greenfields).

on:
  push:
    tags:
      - "v*"

jobs:
  molecule:
    runs-on: self-hosted
    container:
      image: catthehacker/ubuntu:act-24.04
    env:
      WORKDIR: /tmp/ci-drayve-${{ github.run_id }}-${{ matrix.scenario }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scenario:
          - basic
          - auth-none
          - authelia
          - authentik
          - authentik-ldap
          - light
          - sops
          - backup
          - backup-kedge
          - integration

    steps:
      - name: Checkout
        run: |
          rm -rf $WORKDIR
          git clone --depth 1 -b ${GITHUB_REF_NAME} https://codeberg.org/${GITHUB_REPOSITORY}.git $WORKDIR

      - name: Install dependencies
        run: |
          cd $WORKDIR
          python3 -m pip install -q --break-system-packages -r requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run full molecule test_sequence
        # self-hosted Runner hat keinen 10-min-Cap → full test_sequence.
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          cd $WORKDIR
          molecule test -s ${{ matrix.scenario }}

      - name: Safety-destroy test host (interrupt/failure net)
        # molecule test zerstoert am Sequenz-Ende selbst — aber bei hartem
        # Abbruch (Cancel/OOM/Netz) zwischen create und destroy leakt der
        # hcloud-Host. Idempotent: no-op wenn schon weg. Muss VOR dem
        # Workspace-rm laufen (braucht $WORKDIR + molecule-State).
        if: always()
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          cd $WORKDIR && molecule destroy -s ${{ matrix.scenario }} || true

      - name: Cleanup workspace
        if: always()
        run: rm -rf $WORKDIR
