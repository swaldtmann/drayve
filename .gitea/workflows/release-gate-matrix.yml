name: Release Gate — Matrix (tag-push)

# Real-VM molecule scenarios on tag-push (v*). All 12 scenarios run, on Incus
# test VMs nested inside the self-hosted runner VM (default molecule driver, see
# docs/testing.md). Tests only: no cloud credentials, no deploy, no release.
#
# The runner takes exactly ONE job per cycle and is reset afterwards (~140 s
# overhead per job), so scenarios are not one job each. They run one after the
# other inside a job; two jobs (5 + 7 scenarios) keep each job below the
# runner's 2 h job timeout. authelia-file (about an hour: it redeploys five
# times) sits in g2, the group without the Authentik stacks. `upgrade` (two
# converges, ~15 min) joins g2 too: the Authentik groups are the longer ones.
#
# For single-scenario manual runs use release-gate-single.yml (workflow_dispatch).

on:
  push:
    tags:
      - "v*"

jobs:
  molecule:
    runs-on: self-hosted
    env:
      WORKDIR: /tmp/ci-drayve-${{ github.run_id }}-${{ matrix.name }}
      # Images pre-loaded in the runner VM's inner Incus cache; the VM is reset
      # after every job. u24c = images:ubuntu/24.04/cloud (stock), u24c-base = the
      # same plus the packages of the roles `common` and `docker`, pre-installed
      # (built at snapshot refresh, drayve-buckbeak ci-runner/runner-base-image-build.sh).
      # Default for all scenarios is the base image; `basic` runs on the stock image
      # (see the run step) so the real installation stays covered.
      DRAYVE_MOLECULE_INCUS_IMAGE: u24c-base
      # Docker Hub pull-through cache in the runner VM (inner Incus bridge address);
      # the test VMs pull through it. Empty/unset outside CI = no mirror.
      DRAYVE_MOLECULE_REGISTRY_MIRROR: http://10.99.0.1:5000
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # `name` goes into WORKDIR (no spaces), `group` is the scenario list.
        include:
          - name: g1
            group: "basic auth-none authelia authentik authentik-ldap"
          - name: g2
            group: "light sops backup backup-kedge integration authelia-file upgrade"

    steps:
      - name: Checkout
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          rm -rf "$WORKDIR"
          git -c http.extraheader="Authorization: token ${CI_TOKEN}" clone --depth 1 -b ${GITHUB_REF_NAME} ${{ github.server_url }}/${{ github.repository }}.git "$WORKDIR"

      - name: Fetch the baseline tag of the upgrade scenario
        # The checkout is shallow and has no tags. `upgrade` converges the release
        # before this tag first, so resolve it (scripts/upgrade-from-tag.sh) and fetch
        # that one tag. Only needed in the group that runs `upgrade`.
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          case " ${{ matrix.group }} " in *" upgrade "*) ;; *) echo "no upgrade scenario in this group"; exit 0 ;; esac
          cd "$WORKDIR"
          auth="Authorization: token ${CI_TOKEN}"
          tag=$(git -c http.extraheader="$auth" ls-remote --tags --refs origin 'v*' \
            | sed 's#.*refs/tags/##' | scripts/upgrade-from-tag.sh "$GITHUB_REF_NAME")
          git -c http.extraheader="$auth" fetch --depth 1 origin "refs/tags/${tag}:refs/tags/${tag}"
          echo "DRAYVE_UPGRADE_FROM=${tag}" >> "$GITHUB_ENV"
          echo "upgrade baseline: ${tag}"

      - name: Install dependencies
        run: |
          cd "$WORKDIR"
          python3 -m pip install -q --break-system-packages -r requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run full molecule test_sequence per scenario
        # Full test_sequence (create+converge+idempotence+verify+destroy). A red
        # scenario does not stop the rest; the step fails at the end if any failed.
        # No safety-destroy step: the inner Incus VMs die with the runner VM,
        # which is reset to its clean snapshot after the job.
        run: |
          cd "$WORKDIR"
          failed=""
          for s in ${{ matrix.group }}; do
            echo "::group::molecule test -s $s"
            # basic = fresh install of common + docker on the stock image; the others start
            # from the base image with those packages already in place.
            if [ "$s" = basic ]; then image=u24c; else image=u24c-base; fi
            DRAYVE_MOLECULE_INCUS_IMAGE="$image" molecule test -s "$s" || failed="$failed $s"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "FAILED scenarios:$failed"
            exit 1
          fi
