name: Release Gate (molecule on hcloud)

# Real-VM molecule scenarios. Triggers only on tag-push (v*) — too costly per
# PR (~0.05 EUR per scenario × 9 scenarios + wall-clock ~10 min). Manually
# triggerable via workflow_dispatch.
#
# Requires repository secret HCLOUD_TOKEN with project-write rights for the
# hcloud project that hosts the test boxes.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      scenario:
        description: "molecule scenario to run (single, leave empty for all)"
        required: false
        default: ""

jobs:
  molecule:
    # Skip cells whose scenario doesn't match the workflow_dispatch input.
    # On tag-push there is no inputs.scenario — all 9 cells run.
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.scenario == '' || github.event.inputs.scenario == matrix.scenario }}
    runs-on: codeberg-small
    env:
      WORKDIR: /home/forgejo-runner/ci-drayve-${{ github.run_id }}-${{ matrix.scenario }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scenario:
          - basic
          - auth-none
          - authelia
          - authentik
          - authentik-ldap
          - light
          - sops
          - backup
          - integration

    steps:
      - name: Checkout
        run: |
          rm -rf $WORKDIR
          git clone --depth 1 -b ${GITHUB_REF_NAME} https://codeberg.org/${GITHUB_REPOSITORY}.git $WORKDIR

      - name: Install dependencies
        run: |
          cd $WORKDIR
          python3 -m pip install -q --break-system-packages -r requirements.txt

      - name: Run molecule scenario
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          cd $WORKDIR
          molecule test -s ${{ matrix.scenario }}

      - name: Cleanup workspace
        if: always()
        run: rm -rf $WORKDIR
