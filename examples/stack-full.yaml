# Full Drayve stack — Authelia + LLDAP, full monitoring, SOPS secrets.
# Enterprise-grade setup on a single VPS.

drayve_version: "0.1.0"

stack:
  name: production
  domain: ops.example.com
  acme_email: admin@example.com
  # ACME challenge: "http" (default) needs port 80 reachable, no DNS secrets.
  # "dns" is needed for wildcard certs or when port 80 can't be exposed —
  # DRAYVE-W-011: acme_dns_provider alone does NOT switch the challenge type,
  # acme_challenge: dns is what actually flips the certResolver.
  # acme_challenge: dns
  # acme_dns_provider: cloudflare          # defaults to hetzner
  # acme_dns_propagation_delay: 60        # netcup typically needs ~300
  # acme_dns_env_vars:                     # which env vars traefik should see
  #   - CF_DNS_API_TOKEN                   # values live in env.override
  # See docs/dns-providers.md for the per-provider env-var list.

provider:
  type: hetzner
  server_type: cx32
  location: fsn1
  hcloud_ssh_key: my-ssh-key
  # hcloud_dns_context: my-dns-context  # hcloud CLI context for DNS API (burn cleanup)

auth:
  provider: authelia
  lldap: true
  # lldap_base_dn: "DC=myorg,DC=local"

monitoring:
  profile: full
  # loki_url: https://loki.example.com/loki/api/v1/push  # required for light profile

security:
  crowdsec: true
  # crowdsec_whitelist:
  #   - 203.0.113.1

secrets:
  mode: sops

backup:
  enabled: true
  target: kedge                  # kedge | local | sftp (kedge recommended)
  schedule: "0 3 * * *"          # daily backup
  prune_schedule: "30 4 * * 0"   # weekly prune (Sundays 04:30, kedge target only)
  # kedge target — restic repository is provided via host_secrets
  # (sops) as `backup_kedge_restic_repository`, e.g.:
  #   sftp:u123456@u123456.your-storagebox.de:/genua
  # The encryption password lives in `host_secrets.backup_restic_password`.

# Apps shown on the landing page (from compose.override.yml services)
# apps:
#   - name: Nextcloud
#     url: https://cloud.ops.example.com
#     icon: "&#x2601;"
#     description: Files, calendar, contacts
#   - name: Gitea
#     url: https://git.ops.example.com
#     icon: "&#x1F4BB;"
#     description: Git hosting

# Out-of-band static config for services in compose.override.yml that drayve
# does not template (nginx.conf, a hand-maintained .htpasswd, redis.conf, ...).
# Each src is copied from deploy/<host>/<src> to the deploy dir on the host
# BEFORE `docker compose up`, so bind-mounts in the override resolve. A missing
# src fails the deploy early. See docs/configuration.md#extra_files.
# extra_files:
#   - src: caddy/Caddyfile        # → <deploy_dir>/caddy/Caddyfile on the host
#   - src: api/.htpasswd
#     dest: api/.htpasswd
#     mode: "0640"
